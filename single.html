<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!-- 营养智链 · 外卖个性化营养管理平台 | 单文件版 2026-09 -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>营养智链 —— 外卖个性化营养管理平台</title>
<meta name="description" content="营养智链——面向用户、商家、营养师三端协同的外卖个性化营养管理平台，提供餐食智能识别、饮品营养计算、趋势分析与协同社区。">
<link rel="icon" type="image/png" href="assets/logo-mark.png">
<style>
/* 营养智链 Web 原型样式 v3.0 - UI全面升级
   设计参考：MacroFactor / Sleek.design / MyFitnessPal / Dribbble健康App */
:root {
  --primary: #0B7285; --primary-light: #2A9D8F; --primary-dark: #085A6B;
  --primary-50: #E8F4F8; --primary-100: #D1E8EC; --primary-200: #A3D1D9;
  --primary-gradient: linear-gradient(135deg, #0B7285 0%, #2A9D8F 100%);
  --accent-gold: #D9A441; --accent-gold-light: #FBF3E0;
  --accent-coral: #E76F51; --accent-coral-light: #FDEEE8;
  --success: #1A7F4C; --success-light: #E6F7EE;
  --warning: #D9A441; --warning-light: #FFF4E5;
  --error: #C0494C; --error-light: #FDF2F2;
  --unknown: #6B7280; --unknown-light: #F4F5F7;
  --protein: #6366F1; --protein-light: #EEF0FE;
  --carbs: #D9A441; --carbs-light: #FBF3E0;
  --fat: #2A9D8F; --fat-light: #E6F7F3;
  --sugar: #E76F51; --sugar-light: #FDEEE8;
  --bg: #F7F8F5; --bg-gradient: linear-gradient(180deg, #F7F8F5 0%, #EEF2F0 100%);
  --bg-card: #FFFFFF; --bg-alt: #F2F5F3;
  --text-primary: #152536; --text-secondary: #5A6B7D; --text-muted: #8B9AAB;
  --border: #E8EDEB; --border-light: #F0F4F2;
  --shadow-xs: 0 1px 2px rgba(11,114,133,0.04);
  --shadow-sm: 0 2px 8px rgba(11,114,133,0.06);
  --shadow-md: 0 4px 24px rgba(11,114,133,0.08);
  --shadow-lg: 0 8px 32px rgba(11,114,133,0.12);
  --shadow-hover: 0 12px 40px rgba(11,114,133,0.14);
  --shadow-primary: 0 4px 16px rgba(11,114,133,0.25);
  --radius-xs: 6px; --radius-sm: 10px; --radius-md: 14px; --radius-lg: 18px; --radius-xl: 24px; --radius-full: 999px;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --max-width: 960px; --header-height: 64px; --nav-height: 48px; --bottom-nav-height: 68px;
  --transition-fast: 0.15s cubic-bezier(0.4,0,0.2,1); --transition-normal: 0.25s cubic-bezier(0.4,0,0.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:var(--font-sans);background:var(--bg-gradient);background-attachment:fixed;color:var(--text-primary);line-height:1.6;min-height:100vh;padding-bottom:var(--bottom-nav-height);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--primary);text-decoration:none;transition:color var(--transition-fast)}
a:hover{color:var(--primary-dark)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:.9375rem;color:var(--text-primary)}
img{max-width:100%;height:auto;display:block}
ul,ol{list-style:none}
:focus-visible{outline:2px solid var(--primary-light);outline-offset:2px;border-radius:var(--radius-xs)}
::selection{background:var(--primary-100);color:var(--primary-dark)}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.page-content{opacity:1;animation:fadeInUp .35s cubic-bezier(.4,0,.2,1) forwards}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes modalIn{from{transform:translateY(20px) scale(.98);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}

/* 顶部导航（玻璃态） */
.app-header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid rgba(11,114,133,.08)}
.header-inner{max-width:var(--max-width);margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:var(--header-height);padding:0 20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text-primary)}
.brand-logo{height:38px;width:auto;object-fit:contain;flex-shrink:0}
.brand-mark{width:34px;height:34px;border-radius:var(--radius-sm);background:var(--primary-gradient);display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;box-shadow:var(--shadow-primary)}
.brand-mark::after{content:'';width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.95);position:absolute}
.brand-text{font-weight:700;font-size:1.0625rem;letter-spacing:-.01em;white-space:nowrap;background:var(--primary-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header-right{display:flex;align-items:center;gap:10px}
.role-switcher{display:flex;background:var(--bg-alt);border-radius:var(--radius-sm);border:1px solid var(--border-light);padding:3px;gap:2px}
.role-btn{padding:6px 14px;font-size:.8125rem;font-weight:600;color:var(--text-secondary);border-radius:var(--radius-xs);transition:all var(--transition-fast)}
.role-btn:hover{color:var(--text-primary);background:var(--bg-card)}
.role-btn.active{background:var(--bg-card);color:var(--primary);box-shadow:var(--shadow-xs)}
.menu-toggle{display:none;width:40px;height:40px;align-items:center;justify-content:center;border-radius:var(--radius-sm);color:var(--text-secondary);transition:all var(--transition-fast)}
.menu-toggle:hover{background:var(--bg-alt);color:var(--text-primary)}

/* 主导航 */
.main-nav{background:rgba(255,255,255,.7);backdrop-filter:blur(8px);border-bottom:1px solid var(--border-light);overflow-x:auto;scrollbar-width:none}
.main-nav::-webkit-scrollbar{display:none}
.nav-inner{max-width:var(--max-width);margin:0 auto;display:flex;align-items:center;gap:2px;padding:0 20px;height:var(--nav-height)}
.nav-link{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:var(--radius-sm);font-size:.875rem;font-weight:500;color:var(--text-secondary);white-space:nowrap;text-decoration:none;transition:all var(--transition-fast)}
.nav-link:hover{background:var(--bg-alt);color:var(--text-primary)}
.nav-link.active{background:var(--primary-50);color:var(--primary);font-weight:600}
.nav-link i{width:16px;height:16px}
.nav-group{display:flex;gap:2px}
.nav-divider{width:1px;height:20px;background:var(--border-light);margin:0 6px}

/* 底部导航（移动端） */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border-light);border-radius:var(--radius-lg) var(--radius-lg) 0 0;z-index:100;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 24px rgba(11,114,133,.08)}
.bottom-link{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 0;font-size:.6875rem;font-weight:500;color:var(--text-muted);text-decoration:none;transition:all var(--transition-fast);position:relative}
.bottom-link.active{color:var(--primary)}
.bottom-link.active::before{content:'';position:absolute;top:4px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--primary)}
.bottom-link i{width:20px;height:20px}

/* 主内容 */
#mainContent{max-width:var(--max-width);margin:0 auto;padding:24px 20px 48px;min-height:calc(100vh - var(--header-height) - var(--nav-height))}
.page-header{margin-bottom:24px}
.page-title{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;margin-bottom:6px;line-height:1.3}
.page-subtitle{font-size:.9375rem;color:var(--text-secondary);line-height:1.5}
.page-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}

/* 状态标签（pill形纯色块） */
.tag,.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:var(--radius-full);font-size:.75rem;font-weight:600;line-height:1.5;white-space:nowrap;letter-spacing:.01em;border:none}
.tag i,.badge i{width:12px;height:12px}
.tag-demo,.badge-demo{background:var(--primary-50);color:var(--primary)}
.tag-local,.badge-local{background:#EEF4F8;color:#3B6B8A}
.tag-demo-data,.badge-demo-data{background:var(--warning-light);color:var(--warning)}
.tag-not-connected,.badge-not-connected{background:var(--unknown-light);color:var(--unknown)}
.tag-pending,.badge-pending{background:var(--accent-gold-light);color:var(--accent-gold)}
.tag-source-low,.badge-source-low{background:var(--accent-coral-light);color:var(--accent-coral)}
.tag-non-medical,.badge-non-medical{background:var(--success-light);color:var(--success)}
.tag-success,.badge-success{background:var(--success-light);color:var(--success)}
.tag-error,.badge-error{background:var(--error-light);color:var(--error)}
.tag-unknown,.badge-unknown{background:var(--unknown-light);color:var(--unknown)}

/* 卡片 */
.card{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:20px;margin-bottom:16px;box-shadow:var(--shadow-md);transition:all var(--transition-normal)}
.card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.card-title{font-size:1rem;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.card-title i{width:18px;height:18px;color:var(--primary)}
.card-body{font-size:.9375rem;color:var(--text-secondary);line-height:1.65}
.stat-card{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow-sm);transition:all var(--transition-normal)}
.stat-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.stat-card .stat-label{font-size:.75rem;color:var(--text-muted);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat-card .stat-value{font-size:1.625rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--text-primary);line-height:1.1}
.stat-card .stat-value .unit{font-size:.875rem;font-weight:500;color:var(--text-muted)}
.stat-card .stat-sub{font-size:.8125rem;color:var(--text-secondary);margin-top:6px}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}

/* 按钮（渐变主按钮） */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 22px;border-radius:var(--radius-sm);font-size:.875rem;font-weight:600;letter-spacing:.01em;transition:all var(--transition-fast);text-decoration:none;min-height:42px;border:1px solid transparent;white-space:nowrap}
.btn:hover{text-decoration:none;transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary-gradient);color:#fff;box-shadow:var(--shadow-primary)}
.btn-primary:hover{filter:brightness(1.05);box-shadow:0 6px 20px rgba(11,114,133,.3);color:#fff}
.btn-secondary{background:var(--bg-card);color:var(--text-primary);border-color:var(--border);box-shadow:var(--shadow-xs)}
.btn-secondary:hover{background:var(--primary-50);border-color:var(--primary-200);color:var(--primary)}
.btn-accent{background:var(--accent-coral);color:#fff;box-shadow:0 4px 12px rgba(231,111,81,.25)}
.btn-accent:hover{filter:brightness(1.05);color:#fff}
.btn-danger{background:var(--error);color:#fff;box-shadow:0 4px 12px rgba(192,73,76,.25)}
.btn-danger:hover{filter:brightness(1.05);color:#fff}
.btn-ghost{background:transparent;color:var(--text-secondary)}
.btn-ghost:hover{background:var(--bg-alt);color:var(--text-primary)}
.btn-sm{padding:7px 14px;font-size:.8125rem;min-height:34px}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none!important;filter:none!important}
.btn i{width:16px;height:16px}

/* 表单 */
.form-group{margin-bottom:18px}
.form-label{display:block;font-size:.875rem;font-weight:600;margin-bottom:7px;color:var(--text-primary);letter-spacing:.01em}
.form-label .required{color:var(--error)}
.form-hint{font-size:.75rem;color:var(--text-muted);margin-top:5px;line-height:1.5}
.form-input,.form-select,.form-textarea{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-card);color:var(--text-primary);font-size:.9375rem;transition:all var(--transition-fast);box-shadow:var(--shadow-xs)}
.form-input:hover,.form-select:hover,.form-textarea:hover{border-color:var(--primary-200)}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--primary-light);box-shadow:0 0 0 3px var(--primary-50)}
.form-textarea{min-height:90px;resize:vertical;line-height:1.6}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-error{font-size:.8125rem;color:var(--error);margin-top:5px;font-weight:500}

/* 营养值展示 */
.nutrition-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.nutrition-item{background:var(--bg-alt);border-radius:var(--radius-md);padding:12px 14px;border:1px solid var(--border-light);transition:all var(--transition-fast)}
.nutrition-item:hover{background:var(--primary-50);border-color:var(--primary-100)}
.nutrition-label{font-size:.75rem;color:var(--text-muted);margin-bottom:3px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.nutrition-value{font-size:1.1875rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text-primary);letter-spacing:-.01em}
.nutrition-value.interval{font-size:1rem}
.nutrition-value.unknown{color:var(--text-muted);font-size:.875rem;font-weight:500;font-style:italic}
.nutrition-unit{font-size:.75rem;color:var(--text-muted);font-weight:400}

/* 大环形进度图 */
.ring-progress-large{position:relative;width:200px;height:200px;display:flex;align-items:center;justify-content:center;margin:0 auto}
.ring-progress-large svg{transform:rotate(-90deg)}
.ring-progress-large .ring-bg{fill:none;stroke:var(--border-light);stroke-width:14}
.ring-progress-large .ring-fill{fill:none;stroke:url(#ringGradient);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1);filter:drop-shadow(0 2px 8px rgba(11,114,133,.2))}
.ring-progress-large .ring-center{position:absolute;text-align:center}
.ring-progress-large .ring-label-top{font-size:.75rem;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.ring-progress-large .ring-value{font-size:2.5rem;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--text-primary);line-height:1}
.ring-progress-large .ring-value .unit{font-size:1rem;font-weight:500;color:var(--text-muted)}
.ring-progress-large .ring-label-bottom{font-size:.75rem;color:var(--text-muted);margin-top:4px;font-weight:500}

/* 迷你环形图（宏量营养素） */
.mini-ring-group{display:flex;justify-content:space-around;align-items:center;gap:12px;flex-wrap:wrap}
.mini-ring-item{display:flex;flex-direction:column;align-items:center;gap:6px}
.mini-ring{position:relative;width:68px;height:68px;display:flex;align-items:center;justify-content:center}
.mini-ring svg{transform:rotate(-90deg)}
.mini-ring .mini-ring-bg{fill:none;stroke:var(--border-light);stroke-width:7}
.mini-ring .mini-ring-fill{fill:none;stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)}
.mini-ring .mini-ring-center{position:absolute;text-align:center;font-size:.8125rem;font-weight:700;font-variant-numeric:tabular-nums}
.mini-ring-label{font-size:.75rem;font-weight:600;color:var(--text-secondary)}
.mini-ring-value{font-size:.6875rem;color:var(--text-muted);font-variant-numeric:tabular-nums}

/* 环形进度（通用） */
.ring-progress{position:relative;width:140px;height:140px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ring-progress svg{transform:rotate(-90deg)}
.ring-progress .ring-bg{fill:none;stroke:var(--border-light);stroke-width:10}
.ring-progress .ring-fill{fill:none;stroke:var(--primary);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)}
.ring-center{position:absolute;text-align:center}
.ring-center .ring-value{font-size:1.75rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--text-primary);line-height:1}
.ring-center .ring-value .unit{font-size:.75rem;font-weight:500;color:var(--text-muted)}
.ring-center .ring-label{font-size:.75rem;color:var(--text-muted);margin-top:4px;font-weight:500}

/* 宏量占比条 */
.macro-bar{display:flex;height:10px;border-radius:var(--radius-full);overflow:hidden;background:var(--border-light);margin:10px 0}
.macro-segment{height:100%;transition:width .6s cubic-bezier(.4,0,.2,1)}
.macro-segment.protein{background:var(--protein)}
.macro-segment.fat{background:var(--fat)}
.macro-segment.carbs{background:var(--carbs)}
.macro-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
.macro-legend-item{display:flex;align-items:center;gap:6px;font-size:.8125rem;color:var(--text-secondary);font-weight:500}
.macro-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.macro-dot.protein{background:var(--protein)}
.macro-dot.fat{background:var(--fat)}
.macro-dot.carbs{background:var(--carbs)}
.macro-legend-value{font-weight:700;color:var(--text-primary);font-variant-numeric:tabular-nums}

/* 进度条 */
.progress-bar{height:6px;background:var(--border-light);border-radius:var(--radius-full);overflow:hidden;margin-top:10px}
.progress-fill{height:100%;border-radius:var(--radius-full);transition:width .8s cubic-bezier(.4,0,.2,1)}
.progress-fill.primary{background:var(--primary-gradient)}
.progress-fill.warning{background:linear-gradient(90deg,var(--accent-gold),var(--accent-coral))}
.progress-fill.error{background:linear-gradient(90deg,var(--error),#E57373)}

/* 三餐柱状图 */
.meal-chart{display:flex;align-items:flex-end;justify-content:space-around;height:130px;padding:0 10px}
.meal-chart-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.meal-chart-bar-wrap{width:100%;max-width:52px;height:90px;display:flex;align-items:flex-end;justify-content:center}
.meal-chart-bar{width:100%;border-radius:8px 8px 0 0;background:var(--primary-gradient);transition:height .6s cubic-bezier(.4,0,.2,1);position:relative}
.meal-chart-bar.empty{background:repeating-linear-gradient(45deg,var(--border-light),var(--border-light) 4px,var(--bg-card) 4px,var(--bg-card) 8px);height:8px!important}
.meal-chart-value{font-size:.75rem;font-weight:700;color:var(--text-primary);font-variant-numeric:tabular-nums}
.meal-chart-label{font-size:.75rem;color:var(--text-muted);font-weight:600}

/* 面积图容器 */
.area-chart-container{position:relative;width:100%}
.area-chart-container svg{width:100%;height:auto;display:block}

/* 快捷操作卡片 */
.quick-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.quick-action-card{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:22px 18px;text-align:center;cursor:pointer;transition:all var(--transition-normal);text-decoration:none;color:var(--text-primary);display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:var(--shadow-sm)}
.quick-action-card:hover{border-color:var(--primary-200);box-shadow:var(--shadow-hover);transform:translateY(-3px);text-decoration:none;color:var(--text-primary)}
.quick-action-card .icon-wrap{width:56px;height:56px;border-radius:var(--radius-md);background:var(--primary-gradient);display:flex;align-items:center;justify-content:center;color:#fff;transition:all var(--transition-normal);box-shadow:var(--shadow-primary)}
.quick-action-card:hover .icon-wrap{transform:scale(1.08)}
.quick-action-card .icon-wrap i{width:26px;height:26px}
.quick-action-card .qa-title{font-weight:700;font-size:.9375rem;letter-spacing:-.01em}
.quick-action-card .qa-desc{font-size:.75rem;color:var(--text-muted);line-height:1.4}

/* 步骤指示器 */
.stepper{display:flex;align-items:center;gap:0;margin-bottom:22px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.step-item{display:flex;align-items:center;gap:8px;flex-shrink:0}
.step-num{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8125rem;font-weight:700;background:var(--bg-alt);color:var(--text-muted);border:2px solid var(--border-light);flex-shrink:0;transition:all var(--transition-normal)}
.step-item.active .step-num{background:var(--primary-gradient);color:#fff;border-color:transparent;box-shadow:var(--shadow-primary)}
.step-item.completed .step-num{background:var(--success);color:#fff;border-color:var(--success)}
.step-label{font-size:.8125rem;color:var(--text-muted);white-space:nowrap;font-weight:500;transition:color var(--transition-fast)}
.step-item.active .step-label{color:var(--text-primary);font-weight:700}
.step-item.completed .step-label{color:var(--success)}
.step-connector{width:28px;height:2px;background:var(--border-light);margin:0 6px;flex-shrink:0;border-radius:1px;transition:background var(--transition-normal)}
.step-item.completed + .step-connector{background:var(--success)}

/* 上传区 */
.upload-zone{border:2px dashed var(--border);border-radius:var(--radius-lg);padding:40px 24px;text-align:center;cursor:pointer;transition:all var(--transition-normal);background:var(--bg-card)}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--primary-light);background:var(--primary-50)}
.upload-zone .upload-icon{color:var(--text-muted);margin-bottom:10px;transition:color var(--transition-fast)}
.upload-zone:hover .upload-icon{color:var(--primary)}
.upload-zone .upload-icon i{width:48px;height:48px}
.upload-zone .upload-text{font-size:1rem;font-weight:700;color:var(--text-primary);margin-bottom:4px}
.upload-zone .upload-hint{font-size:.8125rem;color:var(--text-muted)}
.upload-preview{margin-top:14px;position:relative}
.upload-preview img{max-height:220px;border-radius:var(--radius-md);margin:0 auto;box-shadow:var(--shadow-md)}
.upload-preview .preview-tag{position:absolute;top:10px;left:10px}

/* 候选列表 */
.candidate-list{display:flex;flex-direction:column;gap:10px}
.candidate-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--border-light);border-radius:var(--radius-md);background:var(--bg-card);cursor:pointer;transition:all var(--transition-fast);box-shadow:var(--shadow-xs)}
.candidate-item:hover{border-color:var(--primary-200);box-shadow:var(--shadow-sm);transform:translateX(2px)}
.candidate-item.selected{border-color:var(--primary-light);background:var(--primary-50);box-shadow:0 0 0 3px var(--primary-50)}
.candidate-info{flex:1;min-width:0}
.candidate-name{font-weight:700;font-size:.9375rem;letter-spacing:-.01em}
.candidate-meta{font-size:.75rem;color:var(--text-muted);margin-top:3px;line-height:1.4}
.candidate-score{font-size:.75rem;color:var(--text-muted);text-align:right;flex-shrink:0;background:var(--bg-alt);padding:8px 12px;border-radius:var(--radius-sm)}
.candidate-score .score-val{font-weight:800;color:var(--primary);font-size:1.125rem;font-variant-numeric:tabular-nums;display:block}

/* 配置选择器（卡片式单选） */
.config-section{margin-bottom:20px}
.config-section-title{font-size:.875rem;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.config-options{display:flex;flex-wrap:wrap;gap:8px}
.config-option{padding:10px 18px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:.875rem;font-weight:600;cursor:pointer;transition:all var(--transition-fast);background:var(--bg-card);color:var(--text-secondary)}
.config-option:hover{border-color:var(--primary-light);color:var(--primary);background:var(--primary-50)}
.config-option.selected{background:var(--primary-gradient);color:#fff;border-color:transparent;box-shadow:var(--shadow-primary)}
.config-option.pending{border-style:dashed;color:var(--accent-gold);border-color:var(--accent-gold)}

/* 结果卡片 */
.result-card{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:24px;margin-bottom:16px;box-shadow:var(--shadow-md)}
.result-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:12px}
.result-title{font-size:1.375rem;font-weight:800;letter-spacing:-.02em;line-height:1.3}
.result-meta{font-size:.8125rem;color:var(--text-muted);margin-top:4px;line-height:1.5}
.result-confidence{display:flex;align-items:center;gap:8px;font-size:.8125rem;font-weight:600;flex-shrink:0}
.confidence-bar{width:64px;height:7px;background:var(--border-light);border-radius:var(--radius-full);overflow:hidden}
.confidence-fill{height:100%;border-radius:var(--radius-full);transition:width .6s ease}
.result-warnings{margin-top:14px}
.warning-item{display:flex;align-items:flex-start;gap:9px;padding:12px 14px;background:var(--accent-coral-light);border-radius:var(--radius-md);font-size:.8125rem;color:var(--accent-coral);margin-bottom:7px;border:1px solid rgba(231,111,81,.15);line-height:1.5}
.warning-item i{width:16px;height:16px;flex-shrink:0;margin-top:1px}

/* 来源抽屉 */
.source-list{display:flex;flex-direction:column;gap:10px}
.source-item{padding:12px 14px;background:var(--bg-alt);border-radius:var(--radius-md);border:1px solid var(--border-light);font-size:.8125rem;line-height:1.5}
.source-item .source-publisher{font-weight:700;color:var(--text-primary);margin-bottom:3px}
.source-item .source-meta{color:var(--text-muted);margin-top:2px;font-size:.75rem}

/* 表格（斑马纹+hover） */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--radius-md)}
.data-table{width:100%;border-collapse:collapse;font-size:.8125rem;min-width:600px}
.data-table th{text-align:left;padding:12px 16px;background:var(--bg-alt);font-weight:700;color:var(--text-secondary);border-bottom:1px solid var(--border);white-space:nowrap;font-size:.75rem;text-transform:uppercase;letter-spacing:.03em}
.data-table td{padding:12px 16px;border-bottom:1px solid var(--border-light);vertical-align:middle;color:var(--text-primary)}
.data-table tbody tr:nth-child(even){background:#FAFBFA}
.data-table tbody tr{transition:background var(--transition-fast)}
.data-table tbody tr:hover td{background:var(--primary-50)}
.table-actions{display:flex;gap:6px}

/* 状态视图 */
.state-view{text-align:center;padding:48px 24px}
.state-view .state-icon{margin-bottom:14px;color:var(--text-muted)}
.state-view .state-icon i{width:56px;height:56px}
.state-view .state-title{font-size:1.125rem;font-weight:700;margin-bottom:8px;letter-spacing:-.01em}
.state-view .state-desc{font-size:.875rem;color:var(--text-secondary);margin-bottom:18px;max-width:420px;margin-left:auto;margin-right:auto;line-height:1.6}
.state-view .state-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.loading-spinner{width:40px;height:40px;border:3px solid var(--border-light);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}

/* Toast */
.toast-container{position:fixed;top:84px;right:20px;z-index:1000;display:flex;flex-direction:column;gap:10px;max-width:380px}
.toast{padding:14px 18px;border-radius:var(--radius-md);background:var(--bg-card);border:1px solid var(--border-light);box-shadow:var(--shadow-lg);font-size:.875rem;display:flex;align-items:flex-start;gap:10px;animation:slideIn .25s cubic-bezier(.4,0,.2,1);font-weight:500;line-height:1.5}
.toast.success{border-left:3px solid var(--success)}
.toast.error{border-left:3px solid var(--error)}
.toast.warning{border-left:3px solid var(--accent-gold)}
.toast.info{border-left:3px solid var(--primary)}

/* 模态框 */
.modal-overlay{position:fixed;inset:0;background:rgba(21,37,54,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg-card);border-radius:var(--radius-xl);max-width:580px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 24px 64px rgba(21,37,54,.2);animation:modalIn .25s cubic-bezier(.4,0,.2,1)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border-light);position:sticky;top:0;background:var(--bg-card);z-index:1;border-radius:var(--radius-xl) var(--radius-xl) 0 0}
.modal-title{font-size:1.0625rem;font-weight:700;letter-spacing:-.01em}
.modal-close{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);color:var(--text-muted);transition:all var(--transition-fast)}
.modal-close:hover{background:var(--bg-alt);color:var(--text-primary)}
.modal-body{padding:22px}
.modal-footer{padding:14px 22px;border-top:1px solid var(--border-light);display:flex;justify-content:flex-end;gap:10px;background:var(--bg-alt);border-radius:0 0 var(--radius-xl) var(--radius-xl)}

/* 列表项 */
.record-item{display:flex;align-items:flex-start;gap:14px;padding:16px;background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-lg);margin-bottom:10px;transition:all var(--transition-fast);box-shadow:var(--shadow-xs)}
.record-item:hover{box-shadow:var(--shadow-md);border-color:var(--border);transform:translateX(2px)}
.record-icon{width:44px;height:44px;border-radius:var(--radius-md);background:var(--primary-gradient);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;box-shadow:var(--shadow-primary)}
.record-icon i{width:20px;height:20px}
.record-content{flex:1;min-width:0}
.record-title{font-weight:700;font-size:.9375rem;letter-spacing:-.01em}
.record-meta{font-size:.75rem;color:var(--text-muted);margin-top:3px}
.record-nutrition{font-size:.8125rem;color:var(--text-secondary);margin-top:5px;font-variant-numeric:tabular-nums;font-weight:500}
.record-actions{display:flex;gap:4px;flex-shrink:0}
.record-actions .btn{padding:7px;min-height:34px;border-radius:var(--radius-sm)}

/* 社区 */
.post-item{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:20px;margin-bottom:14px;box-shadow:var(--shadow-sm);transition:all var(--transition-normal)}
.post-item:hover{box-shadow:var(--shadow-md)}
.post-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.post-avatar{width:36px;height:36px;border-radius:50%;background:var(--primary-gradient);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.875rem;color:#fff;flex-shrink:0}
.post-author{font-size:.875rem;font-weight:700}
.post-role-badge{font-size:.6875rem;padding:2px 8px;border-radius:var(--radius-full);background:var(--bg-alt);color:var(--text-muted);font-weight:600}
.post-time{font-size:.75rem;color:var(--text-muted);margin-left:auto}
.post-title{font-size:1.0625rem;font-weight:700;margin-bottom:8px;letter-spacing:-.01em}
.post-body{font-size:.875rem;color:var(--text-secondary);line-height:1.7}
.post-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.post-tag{font-size:.75rem;padding:3px 10px;border-radius:var(--radius-full);background:var(--primary-50);color:var(--primary);font-weight:600}
.post-footer{display:flex;align-items:center;gap:18px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border-light)}
.post-action{display:flex;align-items:center;gap:5px;font-size:.8125rem;color:var(--text-muted);cursor:pointer;background:none;border:none;padding:5px 10px;border-radius:var(--radius-sm);font-weight:500;transition:all var(--transition-fast)}
.post-action:hover{background:var(--bg-alt);color:var(--text-primary)}
.post-action.active{color:var(--accent-coral)}
.post-action i{width:16px;height:16px}
.comment-list{margin-top:14px;padding-top:14px;border-top:1px solid var(--border-light)}
.comment-item{display:flex;gap:10px;margin-bottom:12px}
.comment-avatar{width:28px;height:28px;border-radius:50%;background:var(--bg-alt);display:flex;align-items:center;justify-content:center;font-size:.6875rem;font-weight:700;color:var(--text-muted);flex-shrink:0}
.comment-body{flex:1}
.comment-header{font-size:.75rem;color:var(--text-muted);margin-bottom:3px}
.comment-text{font-size:.8125rem;color:var(--text-secondary);line-height:1.6}

/* 项目展示页 */
.timeline{position:relative;padding-left:26px}
.timeline::before{content:'';position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--border-light);border-radius:1px}
.timeline-item{position:relative;margin-bottom:22px}
.timeline-item::before{content:'';position:absolute;left:-22px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:2px solid var(--bg-card);box-shadow:0 0 0 2px var(--primary-50)}
.timeline-title{font-weight:700;font-size:.9375rem;margin-bottom:4px}
.timeline-desc{font-size:.8125rem;color:var(--text-secondary);line-height:1.6}
.flow-diagram{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0}
.flow-node{padding:9px 16px;background:var(--primary-50);color:var(--primary);border-radius:var(--radius-md);font-size:.8125rem;font-weight:600;border:1px solid var(--primary-100)}
.flow-node.gate{background:var(--warning-light);color:var(--warning);border-color:rgba(217,164,65,.2)}
.flow-node.result{background:var(--success-light);color:var(--success);border-color:rgba(26,127,76,.2)}
.flow-arrow{color:var(--text-muted);font-size:1.125rem;font-weight:700}

/* 分割线/空状态/详情展开/筛选栏 */
.divider{height:1px;background:var(--border-light);margin:18px 0;border:none}
.empty-state{text-align:center;padding:36px 24px;color:var(--text-muted)}
.empty-state i{width:44px;height:44px;margin-bottom:10px;opacity:.4}
.detail-toggle{display:flex;align-items:center;gap:6px;font-size:.8125rem;color:var(--primary);cursor:pointer;background:none;border:none;padding:6px 0;font-weight:600;transition:color var(--transition-fast)}
.detail-toggle:hover{color:var(--primary-dark)}
.detail-content{margin-top:10px;padding-top:14px;border-top:1px solid var(--border-light)}
.filter-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;align-items:center}
.filter-bar .form-input{width:auto;min-width:180px}
.filter-bar .form-select{width:auto}

/* 页脚 */
.app-footer{background:rgba(255,255,255,.7);backdrop-filter:blur(8px);border-top:1px solid var(--border-light);padding:24px 20px;margin-top:48px}
.footer-inner{max-width:var(--max-width);margin:0 auto}
.footer-inner p{font-size:.8125rem;color:var(--text-secondary);margin-bottom:8px;line-height:1.6}
.footer-disclaimer{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:.75rem;color:var(--text-muted);line-height:1.6}

/* 响应式 */
@media (max-width:768px){
  body{overflow-x:hidden}
  .header-tag{display:none}.role-switcher{display:none}.menu-toggle{display:flex}
  .main-nav{display:none;position:absolute;top:var(--header-height);left:0;right:0;background:var(--bg-card);border-bottom:1px solid var(--border-light);max-height:calc(100vh - var(--header-height));overflow-y:auto;z-index:99;box-shadow:var(--shadow-lg)}
  .main-nav.open{display:block}
  .nav-inner{flex-direction:column;align-items:stretch;height:auto;padding:10px 16px;gap:2px}
  .nav-group{flex-direction:column;gap:2px}.nav-divider{display:none}
  .nav-link{padding:11px 14px;font-size:.9375rem}
  .bottom-nav{display:flex;height:64px}
  .bottom-link{padding:6px 0;font-size:11px}
  .bottom-link i{width:22px;height:22px}
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  #mainContent{padding:16px 14px 32px}
  .page-title{font-size:1.25rem}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  .nutrition-grid{grid-template-columns:1fr 1fr;gap:8px}
  .form-row{grid-template-columns:1fr}
  .stepper{gap:0}.step-label{display:none}.step-connector{width:14px}
  .toast-container{left:14px;right:14px;max-width:none;top:74px}
  .quick-actions{grid-template-columns:1fr;gap:10px}
  .ring-progress-large{width:160px;height:160px;max-width:180px;margin:0 auto}
  .ring-progress-large .ring-value{font-size:1.75rem}
  .ring-progress-large svg{width:160px;height:160px}
  .card{padding:16px;border-radius:var(--radius-md)}
  .stat-card{padding:14px}
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .data-table{min-width:500px}
  .meal-chart{height:110px}
  .mini-ring-group{gap:8px}
  .mini-ring{width:58px;height:58px}
  .mini-ring svg{width:58px;height:58px}
  .brand-logo{height:32px}.brand-text{font-size:.9375rem}
  .filter-bar{gap:8px}
  .filter-bar .form-input{min-width:140px}
  .post-footer{gap:12px}
  .flow-chart-desktop{display:none}
  .flow-chart-mobile{display:block}
}
@media (min-width:769px) and (max-width:1024px){
  .grid-3{grid-template-columns:1fr 1fr}.grid-4{grid-template-columns:1fr 1fr}
  .nutrition-grid{grid-template-columns:repeat(3,1fr)}
}
@media print{
  .app-header,.bottom-nav,.app-footer,.toast-container{display:none}
  #mainContent{padding:0}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
}
/* ===== 顶栏账户芯片 ===== */
.user-chip-box{display:flex;align-items:center;}
.user-chip-wrap{position:relative;}
.user-chip{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 5px;border:1px solid var(--border-light);border-radius:999px;background:#fff;cursor:pointer;transition:all .18s ease;max-width:180px;}
.user-chip:hover{box-shadow:var(--shadow-sm);border-color:var(--primary);}
.user-chip i{color:var(--text-muted);}
.user-avatar{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.8125rem;font-weight:700;flex-shrink:0;}
.user-meta{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;min-width:0;}
.user-name{font-size:.8125rem;font-weight:700;color:var(--text);max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.user-role-tag{font-size:.66rem;font-weight:600;}
.user-chip-login{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;font-size:.8125rem;font-weight:600;text-decoration:none;white-space:nowrap;}
.user-chip-login i{width:15px;height:15px;}
.user-menu{position:absolute;top:calc(100% + 8px);right:0;min-width:168px;background:#fff;border:1px solid var(--border-light);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;z-index:1200;animation:fadeInUp .18s ease;}
.user-menu a{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;font-size:.8125rem;color:var(--text);text-decoration:none;}
.user-menu a i{width:15px;height:15px;color:var(--text-muted);}
.user-menu a:hover{background:var(--bg-alt);color:var(--primary);}
@media(max-width:768px){
  .user-meta{display:none;}
  .user-chip{padding:4px;}
  .user-chip-login span{display:none;}
  .user-chip-login{padding:8px;}
}

/* ===== 注册/登录角色卡 ===== */
.config-option{cursor:pointer;transition:all .16s ease;}
.config-option i{pointer-events:none;}
/* ===== 三角色欢迎横幅 ===== */
.role-hero{border-radius:18px;padding:22px 24px;color:#fff;display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:20px;box-shadow:0 12px 26px -14px rgba(11,114,133,.55);flex-wrap:wrap;}
.role-hero-main{flex:1;min-width:260px;}
.role-hero-eyebrow{font-size:.72rem;opacity:.85;letter-spacing:.1em;font-weight:600;margin-bottom:6px;}
.role-hero-title{font-size:1.28rem;font-weight:800;margin-bottom:6px;letter-spacing:-.01em;}
.role-hero-sub{font-size:.8125rem;opacity:.93;max-width:580px;line-height:1.55;}
.role-hero-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.role-hero-btn{padding:7px 15px;border-radius:999px;background:rgba(255,255,255,.22);color:#fff;font-size:.8rem;font-weight:600;text-decoration:none;border:1px solid rgba(255,255,255,.35);transition:all .16s;cursor:pointer;}
.role-hero-btn:hover{background:rgba(255,255,255,.34);transform:translateY(-1px);}
.role-hero-btn.ghost{background:transparent;}
.role-hero-stats{display:flex;gap:22px;}
.role-stat{text-align:center;}
.role-stat-num{font-size:1.45rem;font-weight:800;line-height:1;}
.role-stat-label{font-size:.7rem;opacity:.86;margin-top:5px;}
@media(max-width:640px){.role-hero{padding:18px;border-radius:16px;}.role-hero-stats{gap:16px;width:100%;justify-content:space-between;}.role-hero-title{font-size:1.08rem;}.role-stat-num{font-size:1.2rem;}}

/* ===== 社区增强：feed / 挑战 / 榜单 / 勋章 / 消息 ===== */
.feed-tabs{display:flex;gap:6px;background:var(--bg-alt);padding:4px;border-radius:999px;margin-bottom:16px;}
.feed-tab{flex:1;text-align:center;padding:8px 12px;border-radius:999px;font-size:.8125rem;font-weight:600;color:var(--text-secondary);cursor:pointer;border:none;background:transparent;transition:all .16s;}
.feed-tab.active{background:#fff;color:var(--primary);box-shadow:var(--shadow-sm);}
.role-chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;scrollbar-width:none;}
.role-chip-row::-webkit-scrollbar{display:none;}
.role-chip{flex-shrink:0;padding:6px 14px;border-radius:999px;border:1px solid var(--border-light);background:#fff;font-size:.78rem;font-weight:600;color:var(--text-secondary);cursor:pointer;white-space:nowrap;}
.role-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.challenge-card{border-radius:16px;padding:16px;background:linear-gradient(120deg,#FFF7E6,#FDEFD3);border:1px solid #F0D9A8;margin-bottom:14px;}
.challenge-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.challenge-badge{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#D9A441,#E8B84A);display:flex;align-items:center;justify-content:center;color:#fff;}
.streak-flame{display:inline-flex;align-items:center;gap:4px;color:#E76F51;font-weight:800;font-size:.8125rem;}
.progress-track{height:8px;border-radius:999px;background:rgba(0,0,0,.08);overflow:hidden;margin:8px 0;}
.progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#D9A441,#E76F51);}
.rank-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-light);}
.rank-row:last-child{border-bottom:none;}
.rank-no{width:26px;height:26px;border-radius:50%;background:var(--bg-alt);display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;color:var(--text-secondary);flex-shrink:0;}
.rank-no.top1{background:#F7D774;color:#8a5a00;}.rank-no.top2{background:#D7DEE6;color:#46566b;}.rank-no.top3{background:#EBC9A8;color:#7a4a22;}
.medal{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:.68rem;font-weight:700;background:var(--primary-50,#eef6f5);color:var(--primary);}
.post-action-btn{display:inline-flex;align-items:center;gap:5px;background:none;border:none;color:var(--text-secondary);font-size:.8rem;cursor:pointer;padding:4px 8px;border-radius:8px;}
.post-action-btn:hover{background:var(--bg-alt);}
.post-action-btn.liked{color:#E76F51;}
.post-action-btn.collected{color:#D9A441;}
.msg-dot{position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:#E76F51;}
.ask-nutri-banner{border-radius:16px;padding:16px 18px;background:linear-gradient(120deg,#EEF2FF,#E0E7FF);border:1px solid #C7D2FE;display:flex;align-items:center;gap:14px;margin-bottom:16px;}

<script>
/* ============================================================
 * Supabase 接入模块 —— 营养智链
 * 功能：认证 + 数据同步 + 本地云端双写
 * 使用前请在 CONFIG 中填入你的 SUPABASE_URL 和 SUPABASE_ANON_KEY
 * ============================================================ */

const SupabaseDB = (() => {
  // ========== 配置（请填入你的 Supabase 项目信息） ==========
  const CONFIG = {
    SUPABASE_URL: 'https://eakcvpayxeqbgzdzxtyz.supabase.co',
    SUPABASE_ANON_KEY: 'sb_publishable_BcOzWEzodc6TtPIqbycWig_gvnMau0Y',
    STORAGE_BUCKET_MEAL: 'meal-images',
    STORAGE_BUCKET_BEVERAGE: 'beverage-images',
    STORAGE_BUCKET_AVATAR: 'avatars'
  };

  // ========== 状态 ==========
  let supabaseClient = null;
  let currentUser = null;
  let isInitialized = false;
  let syncListeners = [];

  // ========== 初始化 ==========
  function init() {
    if (isInitialized) return;
    try {
      // 检查是否已配置
      if (CONFIG.SUPABASE_URL === 'https://your-project.supabase.co' || 
          CONFIG.SUPABASE_ANON_KEY === 'your-anon-key') {
        console.log('[Supabase] 未配置，使用本地 localStorage 模式');
        isInitialized = true;
        return;
      }
      // 动态加载 Supabase SDK
      if (typeof window.supabase === 'undefined') {
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
        script.onload = () => {
          createClient();
        };
        script.onerror = () => {
          console.warn('[Supabase] SDK 加载失败，使用本地模式');
        };
        document.head.appendChild(script);
      } else {
        createClient();
      }
      isInitialized = true;
    } catch (e) {
      console.error('[Supabase] 初始化失败:', e);
    }
  }

  function createClient() {
    try {
      supabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      });
      // 监听认证状态变化
      supabaseClient.auth.onAuthStateChange((event, session) => {
        currentUser = session?.user || null;
        if (event === 'SIGNED_IN') {
          console.log('[Supabase] 用户登录:', currentUser.email);
          // 登录后从云端拉取数据
          pullAllData();
        } else if (event === 'SIGNED_OUT') {
          console.log('[Supabase] 用户登出');
          currentUser = null;
        }
        notifySyncListeners('auth', currentUser);
      });
      // 检查当前会话
      supabaseClient.auth.getSession().then(({ data }) => {
        currentUser = data.session?.user || null;
        if (currentUser) {
          console.log('[Supabase] 已登录:', currentUser.email);
          pullAllData();
        }
      });
      console.log('[Supabase] 客户端初始化成功');
    } catch (e) {
      console.error('[Supabase] 创建客户端失败:', e);
    }
  }

  // ========== 认证功能 ==========

  // 注册
  async function signUp(email, password, nickname) {
    if (!supabaseClient) return { success: false, error: 'Supabase 未配置' };
    try {
      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: {
          data: { nickname: nickname || '营养达人' }
        }
      });
      if (error) return { success: false, error: error.message };
      return { success: true, user: data.user };
    } catch (e) {
      return { success: false, error: e.message };
    }
  }

  // 登录
  async function signIn(email, password) {
    if (!supabaseClient) return { success: false, error: 'Supabase 未配置' };
    try {
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) return { success: false, error: error.message };
      return { success: true, user: data.user };
    } catch (e) {
      return { success: false, error: e.message };
    }
  }

  // 登出
  async function signOut() {
    if (!supabaseClient) return { success: false };
    try {
      await supabaseClient.auth.signOut();
      return { success: true };
    } catch (e) {
      return { success: false, error: e.message };
    }
  }

  // 获取当前用户
  function getUser() {
    return currentUser;
  }

  // 是否已登录
  function isLoggedIn() {
    return !!currentUser;
  }

  // 获取用户 profile
  async function getProfile() {
    if (!supabaseClient || !currentUser) return null;
    try {
      const { data, error } = await supabaseClient
        .from('profiles')
        .select('*')
        .eq('id', currentUser.id)
        .single();
      if (error) return null;
      return data;
    } catch (e) {
      return null;
    }
  }

  // 更新用户 profile
  async function updateProfile(updates) {
    if (!supabaseClient || !currentUser) return { success: false };
    try {
      const { data, error } = await supabaseClient
        .from('profiles')
        .update({ ...updates, updated_at: new Date().toISOString() })
        .eq('id', currentUser.id);
      if (error) return { success: false, error: error.message };
      return { success: true };
    } catch (e) {
      return { success: false, error: e.message };
    }
  }

  // ========== 数据同步 ==========

  // 同步餐食记录到云端
  async function syncMealRecords(records) {
    if (!supabaseClient || !currentUser || !records || records.length === 0) return;
    try {
      const mealRecords = records.filter(r => r.source_type !== 'beverage' && r.items?.some(i => i.category === 'meal'));
      if (mealRecords.length === 0) return;
      
      const toInsert = mealRecords.map(r => {
        const item = r.items?.[0] || {};
        return {
          user_id: currentUser.id,
          dish_name: r.merchant_label || item.name || '未知食物',
          category: item.category || 'meal',
          mass_g: item.estimated_weight_g || null,
          kcal: item.calories_kcal?.value || null,
          kcal_min: item.calories_kcal?.interval?.min || null,
          kcal_max: item.calories_kcal?.interval?.max || null,
          protein_g: item.protein_g?.value || null,
          fat_g: item.fat_g?.value || null,
          carbs_g: item.carbs_g?.value || null,
          sugar_g: item.sugar_g?.value || null,
          sodium_mg: item.sodium_mg?.value || null,
          meal_period: r.meal_period || 'snack',
          source_type: r.source_type || 'smart_recognize',
          confidence: item.confidence || null,
          visual_measure: r.visual_measure || null,
          created_at: r.created_at || new Date().toISOString()
        };
      });
      
      const { error } = await supabaseClient.from('meal_records').insert(toInsert);
      if (error) console.error('[Supabase] 同步餐食记录失败:', error);
      else console.log(`[Supabase] 同步了 ${toInsert.length} 条餐食记录`);
    } catch (e) {
      console.error('[Supabase] 同步餐食记录异常:', e);
    }
  }

  // 同步饮品记录到云端
  async function syncBeverageRecords(records) {
    if (!supabaseClient || !currentUser || !records || records.length === 0) return;
    try {
      const bevRecords = records.filter(r => r.source_type === 'beverage' || r.items?.some(i => i.category === 'beverage'));
      if (bevRecords.length === 0) return;
      
      const toInsert = bevRecords.map(r => {
        const item = r.items?.[0] || {};
        return {
          user_id: currentUser.id,
          drink_name: r.merchant_label || item.name || '未知饮品',
          brand_name: r.brand_name || null,
          volume_ml: item.volume_ml || 500,
          cup_size: r.cup_size || 'medium',
          sugar_level: r.sugar_level || 'full_sugar',
          ice_level: r.ice_level || 'normal_ice',
          toppings: r.toppings || [],
          kcal: item.calories_kcal?.value || null,
          kcal_min: item.calories_kcal?.interval?.min || null,
          kcal_max: item.calories_kcal?.interval?.max || null,
          protein_g: item.protein_g?.value || null,
          fat_g: item.fat_g?.value || null,
          carbs_g: item.carbs_g?.value || null,
          sugar_g: item.sugar_g?.value || null,
          consumed_ratio: r.consumed_ratio || 1.0,
          source_type: r.source_type || 'beverage_config',
          created_at: r.created_at || new Date().toISOString()
        };
      });
      
      const { error } = await supabaseClient.from('beverage_records').insert(toInsert);
      if (error) console.error('[Supabase] 同步饮品记录失败:', error);
      else console.log(`[Supabase] 同步了 ${toInsert.length} 条饮品记录`);
    } catch (e) {
      console.error('[Supabase] 同步饮品记录异常:', e);
    }
  }

  // 同步用户自定义饮品到云端
  async function syncUserBeverages(beverages) {
    if (!supabaseClient || !currentUser || !beverages || beverages.length === 0) return;
    try {
      const toInsert = beverages.map(b => ({
        user_id: currentUser.id,
        drink_name: b.display_name || b.name,
        brand_name: b.brand_name || '用户添加',
        category: b.category || 'other',
        aliases: b.aliases || [],
        base_nutrition: b.base_nutrition || {},
        sugar_deltas: b.sugar_deltas || null,
        available_configuration: b.available_configuration || null,
        confidence: b.confidence || 0.5,
        notes: b.notes || null
      }));
      
      const { error } = await supabaseClient.from('user_beverages').insert(toInsert, { onConflict: 'user_id,drink_name' });
      if (error) console.error('[Supabase] 同步用户饮品失败:', error);
      else console.log(`[Supabase] 同步了 ${toInsert.length} 个用户饮品`);
    } catch (e) {
      console.error('[Supabase] 同步用户饮品异常:', e);
    }
  }

  // 从云端拉取所有数据
  async function pullAllData() {
    if (!supabaseClient || !currentUser) return null;
    try {
      console.log('[Supabase] 从云端拉取数据...');
      
      // 并行拉取
      const [mealRes, bevRes, userBevRes, profileRes] = await Promise.all([
        supabaseClient.from('meal_records').select('*').order('created_at', { ascending: false }).limit(500),
        supabaseClient.from('beverage_records').select('*').order('created_at', { ascending: false }).limit(500),
        supabaseClient.from('user_beverages').select('*'),
        getProfile()
      ]);
      
      const result = {
        mealRecords: mealRes.data || [],
        beverageRecords: bevRes.data || [],
        userBeverages: userBevRes.data || [],
        profile: profileRes
      };
      
      console.log(`[Supabase] 拉取完成: 餐食${result.mealRecords.length}条, 饮品${result.beverageRecords.length}条, 自定义饮品${result.userBeverages.length}个`);
      notifySyncListeners('pull', result);
      return result;
    } catch (e) {
      console.error('[Supabase] 拉取数据异常:', e);
      return null;
    }
  }

  // 全量同步（本地→云端）
  async function pushAllData(localRecords, localUserBeverages) {
    if (!isLoggedIn()) return;
    await Promise.all([
      syncMealRecords(localRecords),
      syncBeverageRecords(localRecords),
      syncUserBeverages(localUserBeverages)
    ]);
    notifySyncListeners('push', null);
  }

  // ========== 存储（图片上传） ==========
  async function uploadMealImage(filePath, fileName) {
    if (!supabaseClient || !currentUser) return null;
    try {
      const { data, error } = await supabaseClient.storage
        .from(CONFIG.STORAGE_BUCKET_MEAL)
        .upload(`${currentUser.id}/${fileName}`, filePath, { contentType: 'image/jpeg' });
      if (error) return null;
      const { data: urlData } = supabaseClient.storage
        .from(CONFIG.STORAGE_BUCKET_MEAL)
        .getPublicUrl(`${currentUser.id}/${fileName}`);
      return urlData?.publicUrl || null;
    } catch (e) {
      return null;
    }
  }

  // ========== 监听器 ==========
  function onSync(callback) {
    syncListeners.push(callback);
    return () => {
      syncListeners = syncListeners.filter(l => l !== callback);
    };
  }

  function notifySyncListeners(type, data) {
    syncListeners.forEach(l => {
      try { l(type, data); } catch(e) {}
    });
  }

  // ========== 配置检查 ==========
  function isConfigured() {
    return CONFIG.SUPABASE_URL !== 'https://your-project.supabase.co' && 
           CONFIG.SUPABASE_ANON_KEY !== 'your-anon-key';
  }

  function getConfig() {
    return { ...CONFIG };
  }

  // 动态更新配置（运行时）
  function setConfig(url, anonKey) {
    CONFIG.SUPABASE_URL = url;
    CONFIG.SUPABASE_ANON_KEY = anonKey;
    isInitialized = false;
    init();
  }

  // ========== 导出 ==========
  return {
    init,
    // 认证
    signUp,
    signIn,
    signOut,
    getUser,
    isLoggedIn,
    getProfile,
    updateProfile,
    // 数据同步
    syncMealRecords,
    syncBeverageRecords,
    syncUserBeverages,
    pullAllData,
    pushAllData,
