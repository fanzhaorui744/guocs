              <button class="btn btn-secondary" onclick="PageOrder.useLocalMatch()"><i data-lucide="list"></i>按行快速拆分</button>
            </div>
            <p style="font-size:0.75rem;color:var(--color-text-muted);margin-top:8px;">解析结果仅供参考，可逐项修改确认后再保存。</p>
          </div>
        </div>
      ` : `
        <div class="card">
          <div class="card-header">
            <div class="card-title"><i data-lucide="keyboard"></i>或直接粘贴订单文字</div>
          </div>
          <div class="card-body" style="padding:0;">
            <textarea class="form-textarea" id="orderTextInputFirst" placeholder="把外卖订单详情粘贴到这里，点击下方按钮解析..." style="min-height:110px;"></textarea>
            <div style="margin-top:12px;">
              <button class="btn btn-primary" onclick="PageOrder.pasteAndParse()"><i data-lucide="sparkles"></i>解析文字订单</button>
            </div>
          </div>
        </div>
      `}

      <!-- 错误提示 -->
      ${state.error ? `
        <div style="padding:12px 16px;background:var(--color-error-light);border:1px solid rgba(192,73,76,0.2);border-radius:var(--radius-md);margin-bottom:16px;">
          <div style="display:flex;align-items:flex-start;gap:8px;">
            <i data-lucide="alert-triangle" style="width:18px;height:18px;color:var(--color-error);flex-shrink:0;margin-top:1px;"></i>
            <div>
              <div style="font-size:0.875rem;font-weight:600;color:var(--color-error);">${state.error.title}</div>
              <div style="font-size:0.8125rem;color:var(--color-text-secondary);margin-top:2px;">${state.error.detail}</div>
            </div>
          </div>
        </div>
      ` : ''}

      <!-- 解析结果 / 候选列表 -->
      ${state.candidates.length > 0 ? `
        <div class="card">
          <div class="card-header">
            <div class="card-title"><i data-lucide="list-checks"></i>解析结果（${state.candidates.length}项）</div>
            <span class="tag ${state.extractedData?.source==='smart'?'tag-success':'tag-local'}">${state.extractedData?.source==='smart'?'智能解析':'按行拆分'}</span>
          </div>
          <div class="card-body" style="padding:0;">
            ${state.extractedData ? `
              <div style="display:flex;gap:16px;flex-wrap:wrap;padding:12px 14px;background:var(--color-bg-alt);border-radius:var(--radius-md);margin-bottom:14px;">
                ${state.extractedData.merchant ? `<div><span style="font-size:0.75rem;color:var(--color-text-muted);">商家</span><div style="font-weight:700;">${state.extractedData.merchant}</div></div>` : ''}
                ${state.extractedData.order_time ? `<div><span style="font-size:0.75rem;color:var(--color-text-muted);">时间</span><div style="font-weight:700;">${state.extractedData.order_time}</div></div>` : ''}
                ${state.extractedData.total_price ? `<div><span style="font-size:0.75rem;color:var(--color-text-muted);">总价</span><div style="font-weight:700;">¥${state.extractedData.total_price}</div></div>` : ''}
                ${state.extractedData.confidence ? `<div><span style="font-size:0.75rem;color:var(--color-text-muted);">置信度</span><div style="font-weight:700;color:var(--color-primary);">${Math.round(state.extractedData.confidence)}%</div></div>` : ''}
              </div>
            ` : ''}
            <div class="candidate-list">
              ${state.candidates.map((c, i) => {
                const nut = state.nutritionCache[c.name];
                return `
                <div class="candidate-item" style="cursor:default;">
                  <div class="candidate-info">
                    <div class="candidate-name">${c.name || '未命名'}</div>
                    <div class="candidate-meta">
                      ${c.specification ? `${c.specification} · ` : ''}
                      ${c.quantity ? `×${c.quantity} ` : ''}
                      ${c.price ? `¥${c.price}` : ''}
                      ${nut && nut.calorie ? ` · <span style="color:var(--color-primary);font-weight:600;">${nut.calorie}kcal/100g</span>` : ''}
                    </div>
                    ${nut ? `<div class="candidate-meta" style="margin-top:2px;">蛋白${nut.protein_g||0}g · 脂肪${nut.fat_g||0}g · 碳水${nut.carbs_g||0}g</div>` : ''}
                  </div>
                  <span class="tag ${getCategoryTag(c.category)}">${catCn(c.category)}</span>
                  <div style="display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;">
                    ${!nut ? `<button class="btn btn-secondary btn-sm" onclick="PageOrder.queryItemNutrition(${i})"><i data-lucide="flame"></i>查热量</button>` : ''}
                    <button class="btn btn-primary btn-sm" onclick="PageOrder.confirmItem(${i})"><i data-lucide="check"></i>确认</button>
                    <button class="btn btn-secondary btn-sm" onclick="PageOrder.editItem(${i})"><i data-lucide="edit-3"></i>修改</button>
                    <button class="btn btn-ghost btn-sm" style="color:var(--color-error);" onclick="PageOrder.removeItem(${i})"><i data-lucide="trash-2"></i></button>
                  </div>
                </div>
              `}).join('')}
            </div>
            <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--color-border-light);">
              <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
                <button class="btn btn-secondary btn-sm" onclick="PageOrder.queryAllNutrition()" ${state.isQueryingNutrition?'disabled':''}>
                  ${state.isQueryingNutrition ? '<span class="loading-spinner" style="width:14px;height:14px;border-width:2px;margin:0;"></span>查询中...' : '<i data-lucide="flame"></i>一键查询全部热量'}
                </button>
              </div>
              <button class="btn btn-primary btn-block" onclick="PageOrder.confirmAll()"><i data-lucide="check-circle"></i>全部确认并保存记录</button>
              <p style="font-size:0.75rem;color:var(--color-text-muted);text-align:center;margin-top:8px;">解析结果仅供参考，请逐项确认后保存</p>
            </div>
          </div>
        </div>
      ` : ''}

      <!-- 说明 -->
      <div class="card">
        <div class="card-header">
          <div class="card-title"><i data-lucide="info"></i>使用说明</div>
        </div>
        <div class="card-body" style="font-size:0.8125rem;color:var(--color-text-secondary);line-height:1.8;">
          <p>• <strong>截图解析</strong>：上传外卖订单截图，自动读取商家、菜品、规格、数量与价格。</p>
          <p>• <strong>文字解析</strong>：粘贴订单文字，自动整理为结构化的菜品清单。</p>
          <p>• <strong>按行拆分</strong>：不使用智能解析时，可按订单每一行快速拆分为条目。</p>
          <p>• <strong>隐私</strong>：图片仅在本地压缩后用于本次解析，不做留存。</p>
          <p>• 自动解析结果可能有误，请逐项确认后再保存记录。</p>
        </div>
      </div>
      </div>
    `;
  }

  function getStepIndex() {
    const map = { input:0, parsing:1, parsed:2, manual:1 };
    return map[state.step] || 0;
  }

  function getCategoryTag(cat) {
    const map = { 主食:'tag-success', 肉类:'tag-demo', 蔬菜:'tag-success', 汤品:'tag-pending', 饮品:'tag-demo', 小吃:'tag-pending', 水果:'tag-source-low', 其他:'tag-unknown' };
    return map[catCn(cat)] || 'tag-unknown';
  }

  // 把解析数据适配为候选列表
  function adaptItems(data) {
    return (data.items || []).map(it => ({
      name: it.name || '未命名',
      specification: it.spec || it.specification || '',
      quantity: it.quantity || 1,
      price: it.price != null ? it.price : null,
      category: CAT_ORDER.includes(it.category) ? it.category : 'other'
    }));
  }

  // 图片处理
  function handleImage(file) {
    if (!file) return;
    if (file.size > 4 * 1024 * 1024) { UI.toast('图片不能超过 4MB', 'warning'); return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const maxSize = 1024;
        let w = img.width, h = img.height;
        if (w > h && w > maxSize) { h = h * maxSize / w; w = maxSize; }
        else if (h > maxSize) { w = w * maxSize / h; h = maxSize; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        state.previewImage = e.target.result;
        state.compressedBase64 = canvas.toDataURL('image/jpeg', 0.85).replace('data:image/jpeg;base64,', '');
        state.step = 'input';
        state.error = null;
        App.rerender();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function clearImage() {
    state.previewImage = null;
    state.compressedBase64 = null;
    state.step = 'input';
    App.rerender();
  }

  // 截图一步解析（读图 + 结构化）
  async function startParseImage() {
    if (!state.compressedBase64) { UI.toast('请先上传截图', 'warning'); return; }
    state.step = 'parsing';
    state.error = null;
    App.rerender();
    const result = await Recognize.orderImage(state.compressedBase64);
    if (result.success) {
      applyParsed(result.data, result.rawText || '');
      UI.toast(`解析完成，共 ${state.candidates.length} 项`, 'success');
    } else {
      state.error = { title: '截图解析失败', detail: result.error + '。可改为手动粘贴订单文字。' };
      state.step = 'manual';
      UI.toast('解析失败，已切换到手动输入', 'error');
    }
    App.rerender();
  }

  function pasteAndParse() {
    const text = document.getElementById('orderTextInputFirst')?.value?.trim();
    if (!text) { UI.toast('请先粘贴订单文字', 'warning'); return; }
    state.orderText = text;
    state.parsedText = text;
    state.step = 'manual';
    App.rerender();
    startParseText();
  }

  async function startParseText() {
    const text = document.getElementById('orderTextInput')?.value?.trim();
    if (!text) { UI.toast('请先输入订单文字', 'warning'); return; }
    state.orderText = text;
    state.parsedText = text;
    state.error = null;
    state.step = 'parsing';
    App.rerender();
    const result = await Recognize.orderText(text);
    if (result.success) {
      applyParsed(result.data, text);
      UI.toast(`解析完成，共 ${state.candidates.length} 项`, 'success');
    } else {
      state.error = { title: '解析失败', detail: result.error + '。可尝试按行快速拆分。' };
      localMatch(text);
    }
    App.rerender();
  }

  function applyParsed(data, rawText) {
    // 置信度统一为百分比
    if (data.confidence != null && data.confidence <= 1) data.confidence = Math.round(data.confidence * 100);
    state.extractedData = { ...data, source: 'smart' };
    state.candidates = adaptItems(data);
    state.parsedText = rawText || state.parsedText || state.orderText;
    state.step = 'parsed';
  }

  function useManualInput() {
    state.step = 'manual';
    state.error = null;
    App.rerender();
  }

  function useLocalMatch() {
    const text = document.getElementById('orderTextInput')?.value?.trim();
    if (!text) { UI.toast('请先输入订单文字', 'warning'); return; }
    state.orderText = text;
    localMatch(text);
    App.rerender();
  }

  function localMatch(text) {
    const lines = text.split('\n').filter(l => l.trim());
    const candidates = lines.map(line => {
      const priceMatch = line.match(/(\d+\.?\d*)\s*元/);
      const qtyMatch = line.match(/[×xX*]\s*(\d+)/);
      const isDrink = /茶|奶|咖啡|果汁|饮|可乐|水/.test(line);
      return {
        name: line.replace(/\d+\.?\d*\s*元.*/, '').replace(/[×xX*]\s*\d+.*/, '').trim().slice(0, 30) || '未命名',
        specification: '',
        quantity: qtyMatch ? parseInt(qtyMatch[1]) : 1,
        price: priceMatch ? parseFloat(priceMatch[1]) : null,
        category: isDrink ? 'drink' : 'other'
      };
    }).filter(c => c.name && c.name.length > 1);
    state.extractedData = { merchant: '', order_time: '', total_price: null, confidence: 50, source: 'local' };
    state.candidates = candidates;
    state.step = 'parsed';
    UI.toast(`拆分完成，共 ${candidates.length} 项`, 'info');
  }

  function confirmItem(i) {
    UI.toast(`已确认：${state.candidates[i].name}`, 'success');
  }

  function editItem(i) {
    const item = state.candidates[i];
    const newName = prompt('修改名称', item.name);
    if (newName !== null) { state.candidates[i].name = newName; App.rerender(); }
  }

  function removeItem(i) {
    state.candidates.splice(i, 1);
    UI.toast('已移除', 'info');
    App.rerender();
  }

  function confirmAll() {
    if (state.candidates.length === 0) { UI.toast('没有可保存的项目', 'warning'); return; }
    const now = new Date();
    const hour = now.getHours();
    const period = hour >= 6 && hour < 10 ? 'breakfast' : hour >= 11 && hour < 14 ? 'lunch' : hour >= 17 && hour < 21 ? 'dinner' : 'snack';
    const record = {
      id: 'order_' + Date.now(),
      source_type: 'order_import',
      raw_text: state.orderText,
      merchant_label: state.extractedData?.merchant || '未命名商家',
      meal_period: period,
      items: state.candidates.map(c => ({
        id: 'item_' + Math.random().toString(36).slice(2),
        name: c.name,
        category: c.category === 'drink' ? 'beverage' : 'meal',
        estimated_weight_g: null,
        consumed_ratio: 1,
        calories_kcal: { value: null, interval: { min: 0, max: 0 }, value_type: 'unknown' },
        protein_g: { value: null, interval: null, value_type: 'unknown' },
        fat_g: { value: null, interval: null, value_type: 'unknown' },
        carbs_g: { value: null, interval: null, value_type: 'unknown' },
        sugar_g: { value: null, interval: null, value_type: 'unknown' },
        sodium_mg: { value: null, interval: null, value_type: 'unknown' },
        confidence: (state.extractedData?.confidence || 50) / 100,
        source_ids: [],
        value_type: 'unknown',
        interval: null,
        warnings: ['营养信息待补充，建议通过饮品配置或餐食拍照获取']
      })),
      status: 'confirmed',
      created_at: now.toISOString(),
      updated_at: now.toISOString()
    };
    const records = AppState.getRecords();
    records.push(record);
    AppState.setRecords(records);
    UI.toast(`已保存 ${state.candidates.length} 项记录`, 'success');
    state = { step:'input', orderText:'', parsedText:'', extractedData:null, candidates:[], previewImage:null, compressedBase64:null, error:null, nutritionCache:{}, isQueryingNutrition:false };
    App.navigate('#/history');
  }

  async function queryItemNutrition(index) {
    const c = state.candidates[index];
    if (!c || !c.name) return;
    if (state.nutritionCache[c.name]) { UI.toast('该食物已查询过', 'info'); return; }
    UI.toast(`正在查询「${c.name}」的营养信息...`, 'info');
    const result = await Recognize.nutrition(c.name);
    if (result.success && result.data) {
      state.nutritionCache[c.name] = result.data;
      App.rerender();
      UI.toast(`查询成功：${c.name} ${result.data.calorie || result.data.protein_g*4+result.data.fat_g*9+result.data.carbs_g*4}kcal/100g`, 'success');
    } else {
      UI.toast(result.error || '查询失败', 'error');
    }
  }

  async function queryAllNutrition() {
    const toQuery = state.candidates.filter(c => c.name && !state.nutritionCache[c.name]);
    if (toQuery.length === 0) { UI.toast('所有食物都已查询过', 'info'); return; }
    state.isQueryingNutrition = true;
    App.rerender();
    let success = 0, fail = 0;
    for (const c of toQuery) {
      try {
        const result = await Recognize.nutrition(c.name);
        if (result.success && result.data) {
          state.nutritionCache[c.name] = result.data;
          success++;
        } else {
          fail++;
        }
      } catch(e) { fail++; }
    }
    state.isQueryingNutrition = false;
    App.rerender();
    UI.toast(`查询完成：成功${success}项，失败${fail}项`, success > 0 ? 'success' : 'error');
  }

  return { render, handleImage, clearImage, startParseImage, startParseText, pasteAndParse, useManualInput, useLocalMatch, confirmItem, editItem, removeItem, confirmAll, queryItemNutrition, queryAllNutrition };
})();

/* 餐食拍照页 - 视觉定量识别：分割→参照物标定→视角矫正→(深度)→体积→质量→热量 */

    selectedIndices: [], // 多选：选中的候选索引数组
    candidateWeights: {}, // 每项自定义重量 {index: grams}
    selectedDish: null,
    weight: 250,
    nutrition: null,
    nutritionLoading: false,
    error: null,
    isMock: false,
    lowConfidence: false,
    measureSummary: null
  };

  // 快速体验数据：附带视觉定量几何，完整演示“面积→厚度→体积→质量→热量”链路
  const MOCK_DISHES = [
    { name: '宫保鸡丁', probability: '0.88', calorie: '183', measure: { shape: 'dome', areaCm2: 78, thicknessCm: 2.4, volumeCm3: 132, density: 1.02, massG: 135, kcal: 247, kcalRange: [198, 296], depthSource: 'semantic', scaleReliable: true } },
    { name: '白米饭', probability: '0.82', calorie: '116', measure: { shape: 'prism', areaCm2: 96, thicknessCm: 2.0, volumeCm3: 192, density: 0.68, massG: 131, kcal: 152, kcalRange: [122, 182], depthSource: 'semantic', scaleReliable: true } },
    { name: '清炒时蔬', probability: '0.61', calorie: '55', measure: { shape: 'pile', areaCm2: 88, thicknessCm: 2.2, volumeCm3: 116, density: 0.5, massG: 58, kcal: 32, kcalRange: [26, 38], depthSource: 'semantic', scaleReliable: true } }
  ];

  function render() {
    return `
      <div class="page-content">
      <div class="page-header">
        <h1 class="page-title">餐食拍照定量识别</h1>
        <p class="page-subtitle">拍照 → 分割与尺度标定 → 体积估算 → 估重 → 热量与营养</p>
      </div>

      ${state.step === 'upload' ? renderUpload() : ''}
      ${state.step === 'recognizing' ? renderRecognizing() : ''}
      ${state.step === 'candidates' ? renderCandidates() : ''}

      ${state.step === 'saved' ? renderSaved() : ''}

      ${state.error ? `
        <div style="padding:12px 16px;background:var(--error-light);border:1px solid rgba(192,73,76,0.2);border-radius:var(--radius-md);margin-bottom:16px;">
          <div style="display:flex;align-items:flex-start;gap:8px;">
            <i data-lucide="alert-triangle" style="width:18px;height:18px;color:var(--error);flex-shrink:0;margin-top:1px;"></i>
            <div>
              <div style="font-size:0.875rem;font-weight:600;color:var(--error);">${state.error.title}</div>
              <div style="font-size:0.8125rem;color:var(--text-secondary);margin-top:2px;">${state.error.detail}</div>
            </div>
          </div>
        </div>
      ` : ''}

      <div class="card">
        <div class="card-header">
          <div class="card-title"><i data-lucide="layers"></i>其他记录方式</div>
        </div>
        <div class="card-body" style="display:flex;gap:10px;flex-wrap:wrap;">
          <a href="#/record/order" class="btn btn-secondary"><i data-lucide="receipt"></i>订单导入</a>
          <a href="#/record/beverage" class="btn btn-secondary"><i data-lucide="cup-soda"></i>饮品配置</a>
          <button class="btn btn-ghost" onclick="PageMeal.manualInput()"><i data-lucide="edit-3"></i>手动输入菜品名</button>
        </div>
      </div>
      </div>
    `;
  }

  function renderUpload() {
    return `
      <div class="card">
        <div class="card-header">
          <div class="card-title"><i data-lucide="camera"></i>上传餐食照片</div>
          <span class="tag tag-success">视觉定量</span>
        </div>
        <div class="card-body" style="padding:0;">
          ${state.previewImage ? `
            <div style="position:relative;margin-bottom:14px;">
              <img src="${state.previewImage}" style="max-width:100%;max-height:320px;border-radius:var(--radius-md);margin:0 auto;box-shadow:var(--shadow-md);">
              <button class="btn btn-danger btn-sm" style="position:absolute;top:10px;right:10px;" onclick="PageMeal.clearImage()"><i data-lucide="x"></i>移除</button>

            <div style="display:flex;gap:10px;flex-wrap:wrap;">
              <button class="btn btn-primary" onclick="PageMeal.startRecognize()"><i data-lucide="scan-search"></i>开始定量识别</button>
              <button class="btn btn-secondary" onclick="PageMeal.useMockData()"><i data-lucide="play-circle"></i>快速体验</button>
            </div>
            <p style="font-size:0.75rem;color:var(--text-muted);margin-top:10px;">建议俯拍，并在餐盘旁放 1cm 方格纸或一元硬币作为尺度参照，估重更准。</p>
          ` : `
            <div class="upload-zone" id="mealUploadZone" onclick="document.getElementById('mealImageInput').click()" tabindex="0" role="button" aria-label="上传餐食照片">

              <div class="upload-text">点击或拖拽上传餐食照片</div>
              <div class="upload-hint">支持 JPG/PNG，最大 4MB · 俯拍 + 参照物（1cm网格/硬币）识别更准</div>
              <input type="file" id="mealImageInput" accept="image/*" style="display:none" onchange="PageMeal.handleImage(this.files[0])">
            </div>
            <p style="font-size:0.75rem;color:var(--text-muted);margin-top:10px;text-align:center;">系统将自动分割食物、标定尺度并估算体积与重量，暂无照片也可先体验完整估算流程</p>
            <div style="text-align:center;margin-top:8px;"><button class="btn btn-secondary" onclick="PageMeal.useMockData()"><i data-lucide="play-circle"></i>快速体验定量流程</button></div>
          `}
        </div>
      </div>
    `;
  }

  function renderRecognizing() {
    const steps = ['实例分割', '尺度标定', '透视高度', '体积/质量估算'];
    return `
      <div class="card">
        <div class="state-view">
          <div class="loading-spinner" style="width:48px;height:48px;border-width:3px;"></div>
          <div class="state-title">正在进行视觉定量分析…</div>
          <div class="state-desc">${steps.map((s, i) => `<span style="display:inline-block;margin:2px 6px;padding:3px 10px;border-radius:999px;background:var(--bg-alt);font-size:0.75rem;color:var(--text-secondary);">${i + 1}. ${s}</span>`).join('')}</div>
          <div style="font-size:0.72rem;color:var(--text-muted);margin-top:10px;">多模态视觉引擎正在识别食物轮廓、1cm 网格标定与透视高度，随后计算体积与热量</div>
          <div class="state-actions">
            <button class="btn btn-secondary" onclick="PageMeal.cancelRecognize()"><i data-lucide="x"></i>取消</button>
          </div>
        </div>
      </div>
    `;
  }

  function renderCandidates() {
    const allLow = state.candidates.every(c => parseFloat(c.probability) < 0.3);
    const selCount = state.selectedIndices.length;
    const allSelected = selCount === state.candidates.length;
    // 计算选中项的总重量和总热量（适配 recognizeMeal 返回的扁平结构）
    let totalMass = 0, totalKcalMin = 0, totalKcalMax = 0;
    state.selectedIndices.forEach(idx => {
      const c = state.candidates[idx];
      const w = state.candidateWeights[idx] != null ? state.candidateWeights[idx] : (c.mass_g || 150);
      totalMass += w;
      const cal100 = c.calorie_per_100g || parseFloat(c.calorie) || 0;
      if (c.kcal_range) {
        totalKcalMin += c.kcal_range[0];
        totalKcalMax += c.kcal_range[1];
      } else {
        totalKcalMin += Math.round(cal100 * w / 100);
        totalKcalMax += Math.round(cal100 * w / 100);
      }
    });
    return `
      <div class="card">
        <div class="card-header">
          <div class="card-title"><i data-lucide="list-checks"></i>识别结果（${state.candidates.length} 项食物）</div>
          <span class="tag tag-success">视觉定量</span>
        </div>
        ${state.measureSummary ? `
          <div style="padding:10px 14px;background:var(--primary-50,#eef6f5);border-radius:var(--radius-md);margin:12px 14px 0;font-size:0.75rem;color:var(--text-secondary);display:flex;gap:14px;flex-wrap:wrap;">
            <span>📐 尺度标定：${state.measureSummary.ref_object || '1cm 标定网格'}</span>
            <span>🍱 食物数：${state.measureSummary.food_count}（逐块分割）</span>
            <span>📏 透视高度估计</span>
            <span>⚖️ 视觉总估重：约 <b>${state.measureSummary.total_mass_g} g</b></span>
            <span>🔥 估算总热量：<b>${state.measureSummary.total_kcal_range ? state.measureSummary.total_kcal_range[0]+'~'+state.measureSummary.total_kcal_range[1] : state.measureSummary.total_kcal} kcal</b></span>
          </div>` : ''}
        ${allLow || state.lowConfidence ? `
          <div style="padding:10px 14px;background:var(--warning-light);border-radius:var(--radius-md);margin:12px 14px 0;">
            <span style="font-size:0.8125rem;color:var(--warning);font-weight:500;">⚠️ 识别置信度较低，建议手动确认或重新拍摄</span>
          </div>` : ''}
        <!-- 多选工具栏 -->
        <div style="padding:10px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border-light);">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:0.8125rem;color:var(--text-secondary);">
            <input type="checkbox" ${allSelected ? 'checked' : ''} onchange="PageMeal.toggleSelectAll()" style="width:16px;height:16px;accent-color:var(--primary);">
            全选
          </label>
          <span style="font-size:0.8125rem;color:var(--primary);font-weight:700;">已选 ${selCount} 项</span>
          <span style="margin-left:auto;font-size:0.75rem;color:var(--text-muted);">可勾选要保存的食物，重量可修改</span>
        </div>
        <div class="candidate-list">
          ${state.candidates.map((c, i) => {
            const prob = c.confidence ? c.confidence / 100 : parseFloat(c.probability);
            const probColor = prob >= 0.7 ? 'var(--success)' : prob >= 0.4 ? 'var(--accent-gold)' : 'var(--accent-coral)';
            const isSelected = state.selectedIndices.includes(i);
            const w = state.candidateWeights[i] != null ? state.candidateWeights[i] : (c.mass_g || 150);
            const cal100 = c.calorie_per_100g || parseFloat(c.calorie) || 0;
            return `
              <div class="candidate-item" style="cursor:default;flex-direction:column;align-items:stretch;gap:8px;${isSelected ? '' : 'opacity:0.55;'}">
                <div style="display:flex;align-items:center;gap:10px;">
                  <input type="checkbox" ${isSelected ? 'checked' : ''} onchange="PageMeal.toggleSelect(${i})" style="width:18px;height:18px;accent-color:var(--primary);flex-shrink:0;">
                  <div class="candidate-info" style="flex:1;">
                    <div class="candidate-name">${c.name}</div>
                    <div class="candidate-meta">
                      <span style="color:${probColor};font-weight:700;">置信度 ${Math.round(prob * 100)}%</span>
                      ${cal100 ? ` · ${cal100} kcal/100g` : ''}
                    </div>
                  </div>
                  <div style="display:flex;align-items:center;gap:4px;flex-shrink:0;">
                    <input type="number" value="${w}" min="1" max="2000" onchange="PageMeal.setCandidateWeight(${i}, this.value)" style="width:64px;padding:4px 6px;border:1px solid var(--border-light);border-radius:6px;font-size:0.75rem;text-align:center;">
                    <span style="font-size:0.7rem;color:var(--text-muted);">g</span>
                  </div>
                </div>
                ${c.area_cm2 ? `
                  <div style="display:flex;gap:6px;flex-wrap:wrap;font-size:0.7rem;padding-left:28px;">
                    <span class="tag" style="background:var(--bg-alt);">占地 ${c.area_cm2}cm²</span>
                    <span class="tag" style="background:var(--bg-alt);">厚 ${c.thickness_cm}cm</span>
                    <span class="tag" style="background:var(--bg-alt);">体积 ${c.volume_ml}ml</span>
                    <span class="tag" style="background:var(--bg-alt);">密度 ${c.density}</span>
                    <span class="tag tag-success">估重 ${c.mass_g}g</span>
                    <span class="tag tag-demo-data">${c.kcal_range ? c.kcal_range[0]+'~'+c.kcal_range[1] : c.kcal} kcal</span>
                  </div>` : ''}
              </div>
            `;
          }).join('')}
        </div>
        <!-- 选中汇总 + 保存按钮 -->
        <div style="margin-top:14px;padding:14px;border-top:1px solid var(--border-light);background:var(--bg-alt);border-radius:0 0 var(--radius-lg) var(--radius-lg);">
          <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:10px;">
            <span style="font-size:0.8125rem;color:var(--text-secondary);">选中 <b style="color:var(--primary);">${selCount}</b> 项 · 总重 <b>${Math.round(totalMass)}g</b> · 总热量 <b>${totalKcalMin}~${totalKcalMax} kcal</b></span>
          </div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <button class="btn btn-primary" style="flex:1;min-width:200px;" onclick="PageMeal.saveSelected()" ${selCount === 0 ? 'disabled style="opacity:0.5;cursor:not-allowed;flex:1;min-width:200px;"' : ''}>
              <i data-lucide="save"></i>确认保存选中的 ${selCount} 项食物
            </button>
            <button class="btn btn-secondary" onclick="PageMeal.manualInput()"><i data-lucide="edit-3"></i>手动输入</button>
            <button class="btn btn-ghost" onclick="PageMeal.backToUpload()"><i data-lucide="rotate-ccw"></i>重新上传</button>
          </div>
        </div>
      </div>
    `;
  }

  function refLabel(t) {
    return ({ grid1cm: '1cm 标定网格', plate: '标准餐盘', coin: '一元硬币', card: '卡片', chopstick: '筷子', none: '经验视场（建议加参照物）', ref: '参照物' })[t] || '参照物';
  }

  function renderDetail() {
    const dish = state.selectedDish;
    const calorie100g = parseFloat(dish.calorie) || 0;
    const totalKcal = Math.round(calorie100g * state.weight / 100);
    const nut = state.nutrition;
    const m = dish.measure;

    return `
      <div class="card">
        <div class="card-header">
          <div class="card-title"><i data-lucide="utensils"></i>${dish.name}</div>
          <span class="tag tag-success">定量结果</span>
        </div>
        <div class="card-body" style="padding:0;">
          <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;padding:14px;background:var(--bg-alt);border-radius:var(--radius-md);">
            <div><span style="font-size:0.75rem;color:var(--text-muted);">每100g热量</span><div style="font-size:1.25rem;font-weight:800;">${calorie100g || '—'} kcal</div></div>
            <div><span style="font-size:0.75rem;color:var(--text-muted);">置信度</span><div style="font-size:1.25rem;font-weight:800;color:var(--primary);">${Math.round(parseFloat(dish.probability) * 100)}%</div></div>
            <div><span style="font-size:0.75rem;color:var(--text-muted);">估重</span><div style="font-size:1.25rem;font-weight:800;">${state.weight}g</div></div>
            <div><span style="font-size:0.75rem;color:var(--text-muted);">总热量</span><div style="font-size:1.75rem;font-weight:800;color:var(--primary);letter-spacing:-0.02em;">${totalKcal}<span style="font-size:0.875rem;font-weight:500;color:var(--text-muted);"> kcal</span></div></div>
          </div>

          ${m ? renderMeasureChain(m) : ''}

          <div class="form-group" style="margin-top:16px;">
            <label class="form-label">份量确认（视觉估重，可手动修正）</label>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
              <button class="config-option ${state.weight===150?'selected':''}" onclick="PageMeal.setWeight(150)">小份 150g</button>
              <button class="config-option ${state.weight===250?'selected':''}" onclick="PageMeal.setWeight(250)">中份 250g</button>
              <button class="config-option ${state.weight===350?'selected':''}" onclick="PageMeal.setWeight(350)">大份 350g</button>
              ${m ? `<button class="config-option selected" onclick="PageMeal.setWeight(${m.massG})">↺ 视觉估重 ${m.massG}g</button>` : ''}
            </div>
            <div style="display:flex;gap:8px;align-items:center;">
              <input type="number" class="form-input" id="customWeight" value="${state.weight}" style="max-width:140px;" onchange="PageMeal.setWeight(parseInt(this.value)||250)">
              <span style="font-size:0.875rem;color:var(--text-secondary);">g（自定义）</span>
            </div>
          </div>

          <div class="form-group" style="margin-top:16px;">
            <label class="form-label">营养成分（按 ${state.weight}g 估算）</label>
            ${state.nutritionLoading ? `
              <div style="padding:20px;text-align:center;">
                <div class="loading-spinner" style="width:32px;height:32px;border-width:2px;margin:0 auto 10px;"></div>
                <div style="font-size:0.8125rem;color:var(--text-secondary);">正在分析营养成分...</div>
              </div>
            ` : nut ? `
              <div class="nutrition-grid">
                <div class="nutrition-item"><div class="nutrition-label">蛋白质</div><div class="nutrition-value">${(nut.protein_g * state.weight / 100).toFixed(1)}<span class="nutrition-unit">g</span></div></div>
                <div class="nutrition-item"><div class="nutrition-label">脂肪</div><div class="nutrition-value">${(nut.fat_g * state.weight / 100).toFixed(1)}<span class="nutrition-unit">g</span></div></div>
                <div class="nutrition-item"><div class="nutrition-label">碳水</div><div class="nutrition-value">${(nut.carbs_g * state.weight / 100).toFixed(1)}<span class="nutrition-unit">g</span></div></div>
                <div class="nutrition-item"><div class="nutrition-label">糖</div><div class="nutrition-value">${nut.sugar_g ? (nut.sugar_g * state.weight / 100).toFixed(1) : '未知'}${nut.sugar_g?'<span class="nutrition-unit">g</span>':''}</div></div>
                <div class="nutrition-item"><div class="nutrition-label">钠</div><div class="nutrition-value">${nut.sodium_mg ? Math.round(nut.sodium_mg * state.weight / 100) : '未知'}${nut.sodium_mg?'<span class="nutrition-unit">mg</span>':''}</div></div>
                <div class="nutrition-item"><div class="nutrition-label">分析置信度</div><div class="nutrition-value" style="font-size:0.9375rem;">${Math.round((nut.confidence||0.5)*100)}%</div></div>
              </div>
              ${nut.note ? `<p style="font-size:0.75rem;color:var(--text-muted);margin-top:6px;">${nut.note}</p>` : ''}
            ` : `
              <div style="padding:14px;background:var(--bg-alt);border-radius:var(--radius-md);text-align:center;">
                <p style="font-size:0.8125rem;color:var(--text-secondary);margin-bottom:8px;">营养成分暂未获取</p>
                <button class="btn btn-secondary btn-sm" onclick="PageMeal.retryNutrition()"><i data-lucide="refresh-cw"></i>重新分析</button>
              </div>
            `}
          </div>

          <div style="margin-top:16px;">
            <button class="btn btn-primary btn-block" onclick="PageMeal.saveRecord()" ${state.nutritionLoading?'disabled':''}>
              <i data-lucide="save"></i>确认并保存记录
            </button>
            <p style="font-size:0.75rem;color:var(--text-muted);text-align:center;margin-top:8px;">保存后可在总览和历史记录中查看</p>
          </div>
        </div>
      </div>
    `;
  }

  // 视觉定量推导链（可解释）
  function renderMeasureChain(m) {
    const shapeName = { dome: '穹顶隆起', prism: '等厚柱体', ellipsoid: '椭球体', liquid: '液体圆柱', pile: '不规则堆叠', flat: '薄片状' }[m.shape] || '隆起体';
    return `
      <div style="margin:0 14px;border:1px solid var(--border-light);border-radius:var(--radius-md);overflow:hidden;">
        <div style="padding:10px 14px;background:var(--primary-50,#eef6f5);font-size:0.8125rem;font-weight:700;color:var(--primary);display:flex;align-items:center;gap:6px;">
          <i data-lucide="ruler"></i>视觉定量推导
          <span class="tag" style="margin-left:auto;font-size:0.68rem;background:#fff;">透视高度</span>
        </div>
        <div style="padding:12px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;font-size:0.75rem;color:var(--text-secondary);">
          <div><div style="color:var(--text-muted);">占地面积 S</div><div style="font-weight:700;color:var(--text);">${m.areaCm2} cm²</div></div>
          <div><div style="color:var(--text-muted);">平均厚度 h</div><div style="font-weight:700;color:var(--text);">${m.thicknessCm} cm</div></div>
          <div><div style="color:var(--text-muted);">形状模型</div><div style="font-weight:700;color:var(--text);">${shapeName}</div></div>
          <div><div style="color:var(--text-muted);">体积 V=S·h·k</div><div style="font-weight:700;color:var(--text);">${m.volumeCm3} cm³</div></div>
          <div><div style="color:var(--text-muted);">视密度 ρ</div><div style="font-weight:700;color:var(--text);">${m.density} g/cm³</div></div>
          <div><div style="color:var(--text-muted);">质量 m=V·ρ</div><div style="font-weight:700;color:var(--primary);">≈ ${m.massG} g</div></div>
        </div>
        <div style="padding:8px 14px;border-top:1px dashed var(--border-light);font-size:0.7rem;color:var(--text-muted);">
          热量 = 估重 ÷ 100 × 每100g热量；${m.scaleReliable ? '已用参照物标定尺度，参考误差约 ±20%' : '未检测到参照物，按经验视场估算（约 ±35%），建议加 1cm 网格或硬币'}
        </div>
      </div>
    `;
  }

  function renderSaved() {
    const s = state.savedSummary;
    const desc = s ? `已保存 ${s.count} 项：${s.names.join('、')}，共约 ${s.totalMass}g / ${s.totalKcal} kcal` : (state.selectedDish ? `${state.selectedDish.name} · ${state.weight}g` : '已加入历史记录');
    return `
      <div class="card">
        <div class="state-view">
          <div class="state-icon" style="color:var(--success);"><i data-lucide="check-circle-2" style="width:56px;height:56px;"></i></div>
          <div class="state-title">已保存到今日记录</div>
          <div class="state-desc">${desc}</div>
          <div class="state-actions">
            <a href="#/" class="btn btn-primary"><i data-lucide="home"></i>查看总览</a>
            <button class="btn btn-secondary" onclick="PageMeal.reset()"><i data-lucide="plus"></i>继续记录</button>
          </div>
        </div>
      </div>
    `;
  }

  function handleImage(file) {
    if (!file) return;
    if (file.size > 4 * 1024 * 1024) { UI.toast('图片不能超过 4MB', 'warning'); return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const maxSize = 1024;
        let w = img.width, h = img.height;
        if (w > h && w > maxSize) { h = Math.round(h * maxSize / w); w = maxSize; }
        else if (h > maxSize) { w = Math.round(w * maxSize / h); h = maxSize; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        state.previewImage = e.target.result;
        state.compressedBase64 = canvas.toDataURL('image/jpeg', 0.85).replace('data:image/jpeg;base64,', '');
        state.imgSize = { w, h };
        state.error = null;
        App.rerender();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function clearImage() {
    state.previewImage = null; state.compressedBase64 = null; state.step = 'upload'; App.rerender();
  }
  function backToUpload() {
    state.step = 'upload'; state.candidates = []; state.measureSummary = null; state.error = null; App.rerender();
  }

  // 把视觉定量结果映射为候选列表
  function mapMeasure(data) {
    return data.items.map(it => ({
      name: it.name,
      probability: String(it.confidence / 100),
      calorie: String(it.kcal_per_100g || ''),
      measure: {
        shape: it.shape, areaCm2: it.area_cm2, thicknessCm: it.thickness_cm, volumeCm3: it.volume_cm3,
        density: it.density_g_cm3, massG: it.mass_g, kcal: it.kcal, kcalRange: it.kcal_range,
        depthSource: it.depth_source, scaleReliable: it.scale_reliable
      }
    }));
  }

  async function startRecognize() {
    if (!state.compressedBase64) { UI.toast('请先上传图片', 'warning'); return; }
    state.error = null; state.step = 'recognizing'; state.isMock = false;
    App.rerender();

    // APP 端 recognizeMeal：一次 API 调用完成"类型→分割→标定→深度厚度→体积质量→营养"全链路
    const mr = await Recognize.recognizeMeal(state.compressedBase64);
    if (mr.success) {
      state.candidates = mr.items;
      state.measureSummary = {
        food_count: mr.food_count,
        total_mass_g: mr.total_mass_g,
        total_kcal: mr.total_kcal,
        total_kcal_range: mr.total_kcal_range,
        ref_object: mr.ref_object
      };
      state.lowConfidence = mr.items.every(c => c.confidence < 30);
      state.selectedIndices = mr.items.map((_, i) => i);
      state.candidateWeights = {};
      state.step = 'candidates';
      UI.toast(`识别完成：${mr.food_count} 项食物，估重约 ${mr.total_mass_g}g，约 ${mr.total_kcal} kcal`, 'success');
      App.rerender();
      return;
    }
    console.error('[recognizeMeal failed]', mr.error);
    UI.toast(`识别暂不可用（${mr.error}），已降级为类型识别`, 'warning');
    // 兜底：仅类型识别（用户手动给克重）
    const dr = await Recognize.dish(state.compressedBase64);
    if (dr.success) {
      state.candidates = dr.results;
      state.measureSummary = null;
      state.lowConfidence = dr.results.every(c => parseFloat(c.probability) < 0.3);
      state.selectedIndices = state.candidates.map((_, i) => i);
      state.candidateWeights = {};
      state.step = 'candidates';
      UI.toast('已完成类型识别，可手动确认份量', 'info');
    } else {
      state.error = { title: '识别失败', detail: '可重试、重新拍摄，或使用"快速体验"查看完整流程。' };
      state.step = 'upload';
    }
    App.rerender();
  }

  function cancelRecognize() { state.step = 'upload'; App.rerender(); }

  // ---------- 多选相关 ----------
  function toggleSelect(index) {
    const idx = state.selectedIndices.indexOf(index);
    if (idx >= 0) state.selectedIndices.splice(idx, 1);
    else state.selectedIndices.push(index);
    App.rerender();
  }
  function toggleSelectAll() {
    if (state.selectedIndices.length === state.candidates.length) {
      state.selectedIndices = [];
    } else {
      state.selectedIndices = state.candidates.map((_, i) => i);
    }
    App.rerender();
  }
  function setCandidateWeight(index, value) {
    const w = parseFloat(value);

      // 非透明开口杯，直接计算
      return calculateAndShow();
    }

    return `
      <div class="card">
        <div class="card-header">
          <div class="card-title"><i data-lucide="droplet"></i>Step 4：剩余比例辅助（可选）</div>
          <span class="tag ${canUseRatio ? 'tag-success' : 'tag-pending'}">${canUseRatio ? '条件满足' : '条件不满足'}</span>
        </div>
        <div class="card-body">
          ${canUseRatio ? `
            <div class="warning-item" style="background:var(--color-success-light);color:var(--color-success);">
              <i data-lucide="check-circle-2"></i>
              <span>条件满足：透明+未封口+液面可见+可靠初始容量（${cfg.volume_ml}mL）。可以输入剩余比例作为辅助输入。</span>
            </div>
            <div class="form-group" style="margin-top:16px;">
              <label class="form-label">实际摄入比例（目测估算）</label>
              <div class="config-options">
                ${[1,0.9,0.75,0.5,0.25].map(r => `
                  <button class="config-option ${cfg.consumed_ratio===r?'selected':''}" onclick="PageBeverage.setConsumedRatio(${r})">${r===1?'整杯':Math.round(r*100)+'%'}</button>
                `).join('')}
              </div>
              <p class="form-hint">剩余比例仅缩放已有依据的营养区间，不改变SKU、杯型、糖度、冰量、小料或serving basis。目测估算可能存在较大偏差。</p>
            </div>
          ` : `
            <div class="warning-item">
              <i data-lucide="alert-triangle"></i>
              <span>条件不满足。封口/不透明/信息不足时，不显示可误解为视觉测量的控件，按整杯计算。</span>
            </div>
          `}
          <div style="display:flex;justify-content:space-between;margin-top:16px;">
            <button class="btn btn-secondary" onclick="PageBeverage.goStep(3)">返回</button>
            <button class="btn btn-primary" onclick="PageBeverage.calculate()"><i data-lucide="calculator"></i>计算估算结果</button>
          </div>
        </div>
      </div>
    `;
  }

  function renderStep5() {
    if (!state.result) return '<p>无结果</p>';
    const r = state.result;
    return `
      ${UI.resultCard(r)}
      <div class="card">
        <div class="card-header">
          <div class="card-title"><i data-lucide="save"></i>保存记录</div>
        </div>
        <div class="card-body">
          <div class="form-group">
            <label class="form-label">餐次</label>
            <select class="form-select" id="bevMealPeriod" style="max-width:200px;">
              <option value="早餐">早餐</option>
              <option value="午餐">午餐</option>
              <option value="下午茶" selected>下午茶</option>

            <button class="btn btn-secondary" onclick="PageBeverage.reset()"><i data-lucide="rotate-ccw"></i>重新配置</button>
            <a href="#/" class="btn btn-ghost">返回总览</a>
          </div>
        </div>
      </div>
    `;
  }

  // ========== 交互方法 ==========
  function loadDemo(type) {
    const demos = {
      jasmine: '清叶茶铺\n茉莉奶绿 中杯 半糖 少冰 +珍珠',
      berry: '果研所\n满杯红柚 大杯 七分糖 正常冰',
      unknown: '某奶茶店\n招牌奶茶 大杯 全糖'
    };
    state.inputText = demos[type] || '';
    const el = document.getElementById('bevText');
    if (el) el.value = state.inputText;
    UI.toast('已加载示例文本', 'success');
  }

  function goStep2() {
    const text = document.getElementById('bevText')?.value || state.inputText;
    state.inputText = text;
    if (!text.trim()) { UI.toast('请输入或粘贴订单文字', 'warning'); return; }
    state.candidates = BeverageEngine.matchCandidates(text);
    state.selectedCandidate = null;
    state.step = 2;
    App.rerender();
  }

  function goStep(n) { state.step = n; App.rerender(); }

  function selectCandidate(i) {
    state.selectedCandidate = i;
    const c = state.candidates[i];
    state.config.brand_id = c.brand_id;
    state.config.sku_id = c.sku_id;
    state.config.confirmations.brand = true;
    state.config.confirmations.sku = true;
    App.rerender();
  }

  function manualSelect() {
    // 显示所有品牌供手动选择
    state.candidates = NPV2_DATA.BEVERAGE_CATALOG.slice(0, 12).map(s => ({
      brand_id: s.brand_id, brand_name: s.brand_name, sku_id: s.sku_id,
      display_name: s.display_name, score: 0.3,
      match_source: '手动选择（非文本匹配）',
      record_status: s.record_status, available_configuration: s.available_configuration
    }));
    state.selectedCandidate = null;
    state.step = 2;
    App.rerender();
    UI.toast('请从饮品库中手动选择', 'info');
  }

  function goStep3() {
    if (state.selectedCandidate === null) { UI.toast('请先选择一个候选', 'warning'); return; }
    state.step = 3; App.rerender();
  }

  function setBrand(id, name) {
    state.config.brand_id = id; state.config.confirmations.brand = true; App.rerender();
  }
  function setSku(id, name) {
    state.config.sku_id = id; state.config.confirmations.sku = true; App.rerender();
  }
  function setCupSize(id, ml) {
    state.config.cup_size_id = id; state.config.volume_ml = ml; state.config.confirmations.cup_size = true; App.rerender();
  }
  function setSugar(id) {
    state.config.sugar_level_id = id; state.config.confirmations.sugar_level = true; App.rerender();
  }
  function setIce(id) {
    state.config.ice_level_id = id; state.config.confirmations.ice_level = true; App.rerender();
  }
  function toggleTopping(id, label) {
    const idx = state.config.toppings.findIndex(t => t.topping_id === id);
    if (idx > -1) state.config.toppings.splice(idx, 1);
    else state.config.toppings.push({ topping_id: id, servings: 1 });
    state.config.confirmations.toppings = state.config.toppings.length > 0;
    App.rerender();
  }
  function clearToppings() {
    state.config.toppings = []; state.config.confirmations.toppings = false; App.rerender();
  }
  function setCupState(val) {
    state.config.cup_state = val;
    if (val !== 'transparent_open') { state.config.consumed_ratio = null; state.config.consumed_ratio_source = null; }
    App.rerender();
  }
  function setConsumedRatio(r) {
    state.config.consumed_ratio = r;
    state.config.consumed_ratio_source = 'user_estimate';
    App.rerender();
  }

  function goStep4() {
    const validation = BeverageEngine.validateConfig(state.config);
    if (!validation.complete) { UI.toast(`未确认：${validation.missing.join('、')}`, 'warning'); return; }
    if (state.config.cup_state === 'transparent_open') {
      state.step = 4; App.rerender();
    } else {
      calculate();
    }
  }

  function calculate() {
    const validation = BeverageEngine.validateConfig(state.config);
    // 优先使用08引擎证据门控计算
    const c = state.candidates[state.selectedCandidate];
    const engineRecord = NPV2_DATA.ENGINE_CATALOG.records.find(r =>
      r.brand_id === c?.brand_id && r.sku_id === c?.sku_id
    );
    if (engineRecord && state.config.brand_id && state.config.sku_id) {
      const engine = new EvidenceBeverageEngine(NPV2_DATA.ENGINE_CATALOG);
      const request = {
        brand_id: state.config.brand_id,
        sku_id: state.config.sku_id,
        cup_size_id: state.config.cup_size_id || 'medium',
        sugar_level_id: state.config.sugar_level_id || 'full_sugar',
        ice_level_id: state.config.ice_level_id || 'normal_ice',
        toppings: (state.config.toppings || []).map(t => ({ topping_id: t.id || t, servings: t.servings || 1 })),
        consumed_ratio: state.config.consumed_ratio || 1,
        consumed_ratio_source: state.config.consumed_ratio ? 'user_confirmed' : 'full_serving',
        confirmations: { sugar_level: true, ice_level: true, toppings: true }
      };
      state.result = engine.estimate(request);
      state.result.engine_type = 'evidence_gated';
    } else {
      state.result = BeverageEngine.estimate(state.config);
      state.result.engine_type = 'local_rule';
    }
    state.step = 5;
    App.rerender();
  }

  function calculateAndShow() {
    return calculate();
  }

  function saveRecord() {
    if (!state.result) return;
    const r = state.result;
    const period = document.getElementById('bevMealPeriod')?.value || '下午茶';
    const note = document.getElementById('bevNote')?.value || '';
    const c = state.candidates[state.selectedCandidate];
    const record = {
      id: 'bev_' + Date.now(),
      source_type: 'beverage',
      raw_text: state.inputText,
      original_asset_ref: null,
      merchant_label: c?.brand_name || '饮品记录',
      meal_period: period,
      items: [{
        id: 'bev_item_' + Date.now(),
        name: `${c?.brand_name || ''} ${c?.display_name || ''}`.trim(),
        category: 'beverage',
        estimated_weight_g: null,
        consumed_ratio: state.config.consumed_ratio,
        calories_kcal: r.nutrients.kcal,
        protein_g: r.nutrients.protein_g,
        fat_g: r.nutrients.fat_g,
        carbs_g: r.nutrients.carbs_g,
        sugar_g: r.nutrients.sugar_g,
        confidence: r.confidence,
        source_ids: (r.sources || []).map(s => s.source_id),
        value_type: r.value_type,
        interval: r.nutrients.kcal.interval,
        warnings: r.warnings,
        beverage_config: state.config,
        beverage_result: r,
        note: note
      }],
      status: r.display_mode === 'unknown' ? 'pending_confirmation' : 'confirmed',
      created_at: new Date().toISOString(),
      updated_at: new Date().toISOString()
    };
    AppState.addRecord(record);
    UI.toast('饮品记录已保存', 'success');
    setTimeout(() => App.navigate('#/'), 800);
  }

  function reset() {
    state = {
      step: 1, inputText: '', imagePreview: null, candidates: [], selectedCandidate: null,
      config: {
        brand_id: null, sku_id: null, cup_size_id: null, volume_ml: null,
        sugar_level_id: null, ice_level_id: null, toppings: [],
        cup_state: 'unknown', consumed_ratio: null, consumed_ratio_source: null,
        confirmations: { brand: false, sku: false, cup_size: false, sugar_level: false, ice_level: false, toppings: false }
      },
      result: null
    };
    App.rerender();
  }

  function bindEvents() {
    const zone = document.getElementById('bevUpload');
    const input = document.getElementById('bevUpload_input');
    if (zone && input) {
      zone.addEventListener('click', () => input.click());
      input.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          state.imagePreview = ev.target.result;
          // 压缩图片
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxDim = 1024;
            let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
              else { w = Math.round(w * maxDim / h); h = maxDim; }
            }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            state.compressedBase64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
            App.rerender();
          };
          img.src = ev.target.result;
          UI.toast('图片已加载，点击"识别图片文字"自动提取饮品信息', 'success');
        };
        reader.readAsDataURL(file);
      });
    }
  }

  function clearImage() {
    state.imagePreview = null;
    state.compressedBase64 = null;
    App.rerender();
  }

  async function recognizeImage() {
    if (!state.compressedBase64) { UI.toast('请先上传图片', 'warning'); return; }
    state.isRecognizing = true;
    App.rerender();
    const result = await Recognize.orderImage(state.compressedBase64);
    state.isRecognizing = false;
    if (result.success && result.data && result.data.items && result.data.items.length > 0) {
      // 从识别结果中提取饮品相关文字
      const lines = [];
      if (result.data.merchant) lines.push(result.data.merchant);
      for (const item of result.data.items) {
        let line = item.name || '';
        if (item.spec) line += ' ' + item.spec;
        if (item.quantity && item.quantity > 1) line += ' x' + item.quantity;
        if (line) lines.push(line);
      }
      const text = lines.join('\n');
      state.inputText = text;
      App.rerender();
      // 自动填充到文本框并生成候选
      setTimeout(() => {
        const textarea = document.getElementById('bevText');
        if (textarea) textarea.value = text;
        goStep2();
      }, 100);
      UI.toast(`识别成功，提取到 ${result.data.items.length} 项`, 'success');
    } else {
      UI.toast(result.error || '识别失败，请手动粘贴文字', 'error');
    }
  }

  async function queryAndAddBeverage() {
    // 从输入文本中提取饮品名称（取第一行非商家名的文本）
    const lines = state.inputText.split('\n').map(l => l.trim()).filter(l => l);
    if (lines.length === 0) { UI.toast('请先输入饮品名称', 'warning'); return; }
    // 尝试提取饮品名（去掉品牌名、规格等）
    let drinkName = lines[0];
    if (lines.length > 1) {
      // 如果第一行像品牌名（短且不含饮品关键词），取第二行
      const drinkKeywords = /(茶|奶|咖啡|可乐|雪碧|果汁|奶茶|拿铁|美式|乌龙|绿茶|红茶|柠檬|芒果|草莓|葡萄|西瓜|橙|桃|梨|苹果|椰|芋|珍珠|布丁|红豆|冰沙|奶昔|气泡|苏打|矿泉|柠檬水|养乐多|酸奶|豆浆|牛奶|可可|抹茶|燕麦|焦糖|玛奇朵|芝士|奶盖|咸蛋黄|提拉米苏|黑糖|鲜奶|紫米|香蕉|木瓜|蓝莓|荔枝|白桃|石榴|菠萝|水蜜桃)/;
      if (!drinkKeywords.test(lines[0]) && drinkKeywords.test(lines[1])) {
        drinkName = lines[1];
      }
    }
    // 去掉规格词
    drinkName = drinkName.replace(/(中杯|大杯|小杯|半糖|全糖|七分糖|三分糖|无糖|少冰|正常冰|去冰|热饮|加|\+).*$/, '').trim();
    if (!drinkName) { UI.toast('无法提取饮品名称，请手动输入', 'warning'); return; }

    UI.toast(`正在查询「${drinkName}」的营养信息...`, 'info');
    const result = await Recognize.nutrition(drinkName);
    if (result.success && result.data) {
      const nut = result.data;
      // API 返回的是每100g的营养值，按杯型比例放大
      // 中杯500ml ≈ 500g = 5 × 100g，大杯650ml ≈ 650g = 6.5 × 100g
      const mediumFactor = 5;
      const largeFactor = 6.5;
      const cal100 = nut.calorie || (nut.protein_g*4 + nut.fat_g*9 + nut.carbs_g*4);
      const calMedium = Math.round(cal100 * mediumFactor);
      const calLarge = Math.round(cal100 * largeFactor);
      const proteinMedium = Math.round((nut.protein_g||0) * mediumFactor);
      const proteinLarge = Math.round((nut.protein_g||0) * largeFactor);
      const fatMedium = Math.round((nut.fat_g||0) * mediumFactor);
      const fatLarge = Math.round((nut.fat_g||0) * largeFactor);
      const carbsMedium = Math.round((nut.carbs_g||0) * mediumFactor);
      const carbsLarge = Math.round((nut.carbs_g||0) * largeFactor);
      const sugarMedium = Math.round((nut.sugar_g||0) * mediumFactor);
      const sugarLarge = Math.round((nut.sugar_g||0) * largeFactor);
      const sodiumMedium = nut.sodium_mg ? Math.round(nut.sodium_mg * mediumFactor) : null;
      const sodiumLarge = nut.sodium_mg ? Math.round(nut.sodium_mg * largeFactor) : null;
      
      // 糖度差值按比例计算（全糖→半糖约减50%糖，热量减约25%）
      const sugarDeltaHalf = Math.max(10, Math.round(calMedium * 0.25));
      const sugarDeltaLess = Math.max(5, Math.round(sugarDeltaHalf * 0.5));
      const sugarDeltaQuarter = Math.max(15, Math.round(sugarDeltaHalf * 1.5));
      const sugarDeltaNone = Math.max(20, Math.round(sugarDeltaHalf * 2));
      const sugarGramHalf = Math.max(2, Math.round(sugarMedium * 0.5));
      
      // 创建新的 SKU
      const newSku = {
        brand_id: 'user_added',
        brand_name: '用户添加',
        sku_id: 'user_' + Date.now(),
        display_name: drinkName,
        aliases: [drinkName],
        category: 'other',
        record_status: 'api_estimated',
        source_ids: ['api_query'],
        source_insufficient: false,
        available_configuration: {
          cup_sizes: [{id:'medium',label:'中杯',ml:500},{id:'large',label:'大杯',ml:650}],
          sugar_levels: [{id:'full_sugar',label:'全糖'},{id:'less_sugar',label:'七分糖'},{id:'half_sugar',label:'半糖'},{id:'quarter_sugar',label:'三分糖'},{id:'no_sugar',label:'无糖'}],
          ice_levels: [{id:'normal_ice',label:'正常冰'},{id:'less_ice',label:'少冰'},{id:'no_ice',label:'去冰'},{id:'hot',label:'热饮'}],
          toppings: []
        },
        base_nutrition: {
          medium: { full_sugar: { 
            kcal:{value:null,interval:{min:Math.max(0,Math.round(calMedium*0.85)),max:Math.round(calMedium*1.15)}}, 
            protein_g:{value:proteinMedium,interval:{min:Math.max(0,Math.round(proteinMedium*0.85)),max:Math.round(proteinMedium*1.15)}}, 
            fat_g:{value:fatMedium,interval:{min:Math.max(0,Math.round(fatMedium*0.85)),max:Math.round(fatMedium*1.15)}}, 
            carbs_g:{value:carbsMedium,interval:{min:Math.max(0,Math.round(carbsMedium*0.85)),max:Math.round(carbsMedium*1.15)}}, 
            sugar_g:{value:sugarMedium,interval:{min:Math.max(0,Math.round(sugarMedium*0.85)),max:Math.round(sugarMedium*1.15)}}, 
            sodium_mg:{value:sodiumMedium,interval:{min:0,max:sodiumMedium?Math.round(sodiumMedium*1.3):50}} 
          } },
          large: { full_sugar: { 
            kcal:{value:null,interval:{min:Math.max(0,Math.round(calLarge*0.85)),max:Math.round(calLarge*1.15)}}, 
            protein_g:{value:proteinLarge,interval:{min:Math.max(0,Math.round(proteinLarge*0.85)),max:Math.round(proteinLarge*1.15)}}, 
            fat_g:{value:fatLarge,interval:{min:Math.max(0,Math.round(fatLarge*0.85)),max:Math.round(fatLarge*1.15)}}, 
            carbs_g:{value:carbsLarge,interval:{min:Math.max(0,Math.round(carbsLarge*0.85)),max:Math.round(carbsLarge*1.15)}}, 
            sugar_g:{value:sugarLarge,interval:{min:Math.max(0,Math.round(sugarLarge*0.85)),max:Math.round(sugarLarge*1.15)}}, 
            sodium_mg:{value:sodiumLarge,interval:{min:0,max:sodiumLarge?Math.round(sodiumLarge*1.3):80}} 
          } }
        },
        sugar_deltas: { 
          full_to_less:{kcal:-sugarDeltaLess,sugar_g:-Math.max(1,Math.round(sugarGramHalf*0.5))}, 
          full_to_half:{kcal:-sugarDeltaHalf,sugar_g:-sugarGramHalf}, 
          full_to_quarter:{kcal:-sugarDeltaQuarter,sugar_g:-Math.max(1,Math.round(sugarGramHalf*1.5))}, 
          full_to_none:{kcal:-sugarDeltaNone,sugar_g:-Math.max(1,Math.round(sugarGramHalf*2))} 
        },
        confidence: Math.max(0.5, nut.confidence || 0.5),
        notes: '通过API查询添加的饮品营养数据，按500ml/650ml比例换算，仅供参考。'
      };
      // 添加到知识库
      NPV2_DATA.BEVERAGE_CATALOG.push(newSku);
      // 保存到 localStorage
      try {
        const userAdded = JSON.parse(localStorage.getItem('npv2_user_beverages') || '[]');
        userAdded.push(newSku);
        localStorage.setItem('npv2_user_beverages', JSON.stringify(userAdded));
      } catch(e) {}
      // 重新生成候选
      state.candidates = BeverageEngine.matchCandidates(state.inputText);
      state.selectedCandidate = state.candidates.length > 0 ? 0 : null;
      App.rerender();
      UI.toast(`已添加「${drinkName}」到知识库，匹配到 ${state.candidates.length} 个候选`, 'success');
    } else {
      UI.toast(result.error || '查询失败，请手动选择', 'error');
    }
  }

  return { render, loadDemo, goStep2, goStep, selectCandidate, manualSelect, goStep3, setBrand, setSku, setCupSize, setSugar, setIce, toggleTopping, clearToppings, setCupState, setConsumedRatio, goStep4, calculate, saveRecord, reset, bindEvents, recognizeImage, clearImage, queryAndAddBeverage };
})();

/* 记录与趋势页 */
const PageHistory = (() => {
  let filter = 'all'; // all|7d|30d
  let periodFilter = 'all'; // all|breakfast|lunch|dinner|snack
  let view = 'list'; // list|trend

  function render() {
    const records = AppState.getRecords().sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    let filtered = filterRecords(records, filter);
    if (periodFilter !== 'all') filtered = filtered.filter(r => r.meal_period === periodFilter);

    return `
      <div class="page-header">
        <h1 class="page-title">记录与趋势</h1>
        <p class="page-subtitle">日/周/月筛选 · 修改/删除/补录 · 来源查看 · 本地存储</p>
      </div>

      <div class="filter-bar">
        <div style="display:flex;gap:4px;background:var(--color-bg-alt);padding:4px;border-radius:8px;">
          <button class="btn btn-sm ${filter==='all'?'btn-primary':'btn-ghost'}" onclick="PageHistory.setFilter('all')">全部</button>
          <button class="btn btn-sm ${filter==='7d'?'btn-primary':'btn-ghost'}" onclick="PageHistory.setFilter('7d')">近7天</button>
          <button class="btn btn-sm ${filter==='30d'?'btn-primary':'btn-ghost'}" onclick="PageHistory.setFilter('30d')">近30天</button>
        </div>
        <div style="display:flex;gap:4px;background:var(--color-bg-alt);padding:4px;border-radius:8px;flex-wrap:wrap;">
          <button class="btn btn-sm ${periodFilter==='all'?'btn-primary':'btn-ghost'}" onclick="PageHistory.setPeriod('all')">全部时段</button>
          <button class="btn btn-sm ${periodFilter==='breakfast'?'btn-primary':'btn-ghost'}" onclick="PageHistory.setPeriod('breakfast')">🌅早餐</button>
          <button class="btn btn-sm ${periodFilter==='lunch'?'btn-primary':'btn-ghost'}" onclick="PageHistory.setPeriod('lunch')">☀️午餐</button>
          <button class="btn btn-sm ${periodFilter==='dinner'?'btn-primary':'btn-ghost'}" onclick="PageHistory.setPeriod('dinner')">🌙晚餐</button>
          <button class="btn btn-sm ${periodFilter==='snack'?'btn-primary':'btn-ghost'}" onclick="PageHistory.setPeriod('snack')">☕加餐</button>
        </div>
        <div style="display:flex;gap:4px;background:var(--color-bg-alt);padding:4px;border-radius:8px;">
          <button class="btn btn-sm ${view==='list'?'btn-primary':'btn-ghost'}" onclick="PageHistory.setView('list')"><i data-lucide="list"></i>列表</button>
          <button class="btn btn-sm ${view==='trend'?'btn-primary':'btn-ghost'}" onclick="PageHistory.setView('trend')"><i data-lucide="trending-up"></i>趋势</button>
        </div>
        <div style="margin-left:auto;display:flex;gap:8px;">
          <button class="btn btn-secondary btn-sm" onclick="PageHistory.exportData()"><i data-lucide="download"></i>导出JSON</button>
          <a href="#/record/beverage" class="btn btn-primary btn-sm"><i data-lucide="plus"></i>补录</a>
        </div>
      </div>

      ${view === 'trend' ? renderTrend(filtered) : renderList(filtered)}

      ${filtered.length === 0 ? UI.emptyState('inbox', '暂无记录，点击右上角"补录"开始记录') : ''}
    `;
  }

  function filterRecords(records, f) {
    if (f === 'all') return records;
    const days = f === '7d' ? 7 : 30;
    const cutoff = Date.now() - days * 86400000;
    return records.filter(r => new Date(r.created_at).getTime() >= cutoff);
  }

  function renderList(records) {
    return records.map(r => {
      const kcal = (r.items || []).reduce((sum, it) => {
        if (it.calories_kcal?.interval) return sum + (it.calories_kcal.interval.min + it.calories_kcal.interval.max) / 2;
        if (it.calories_kcal?.value) return sum + it.calories_kcal.value;
        return sum;
      }, 0);
      const date = new Date(r.created_at);
      const dateStr = date.toLocaleDateString('zh-CN', {month:'short',day:'numeric'}) + ' ' + date.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
      return `<div class="record-item">
        <div class="record-icon"><i data-lucide="${r.source_type==='beverage'?'cup-soda':r.source_type==='meal_photo'?'camera':'receipt'}"></i></div>
        <div class="record-content">
          <div class="record-title">${r.merchant_label || '未命名记录'}
            ${r.status==='pending_confirmation'?' <span class="tag tag-pending">待确认</span>':''}
            ${r.source_type==='beverage'?' <span class="tag tag-demo">饮品</span>':' <span class="tag tag-demo">餐食</span>'}
          </div>
          <div class="record-meta">${r.meal_period || ''} · ${(r.items||[]).length}项 · ${dateStr}</div>
          <div class="record-nutrition">约 ${Math.round(kcal)} kcal（估算中值）</div>
          ${(r.items||[]).some(it=>it.warnings&&it.warnings.length) ? `<div style="font-size:0.75rem;color:var(--color-warning);margin-top:4px;"><i data-lucide="alert-triangle" style="width:12px;height:12px;"></i> 含不确定性警告</div>` : ''}
        </div>
        <div class="record-actions">
          <button class="btn btn-ghost btn-sm" onclick="PageHistory.viewDetail('${r.id}')" aria-label="查看详情"><i data-lucide="eye"></i></button>
          <button class="btn btn-ghost btn-sm" onclick="PageHistory.editRecord('${r.id}')" aria-label="编辑"><i data-lucide="edit-3"></i></button>
          <button class="btn btn-ghost btn-sm" style="color:var(--color-error);" onclick="PageHistory.deleteRecord('${r.id}')" aria-label="删除"><i data-lucide="trash-2"></i></button>
        </div>
      </div>`;
    }).join('');
  }

  function renderTrend(records) {
    // 按天聚合
    const byDay = {};
    for (const r of records) {
      const day = r.created_at.slice(0, 10);
      if (!byDay[day]) byDay[day] = { kcal: 0, protein: 0, sugar: 0, count: 0 };
      for (const it of (r.items || [])) {
        if (it.calories_kcal?.interval) byDay[day].kcal += (it.calories_kcal.interval.min + it.calories_kcal.interval.max) / 2;
        if (it.protein_g?.interval) byDay[day].protein += (it.protein_g.interval.min + it.protein_g.interval.max) / 2;
        if (it.sugar_g?.interval) byDay[day].sugar += (it.sugar_g.interval.min + it.sugar_g.interval.max) / 2;
      }
      byDay[day].count++;
    }
    const days = Object.keys(byDay).sort();
    const maxKcal = Math.max(...days.map(d => byDay[d].kcal), 1);

    if (days.length === 0) return UI.emptyState('bar-chart-3', '暂无趋势数据');

    return `
      <div class="card">
        <div class="card-header">
          <div class="card-title"><i data-lucide="bar-chart-3"></i>每日热量趋势（估算中值）</div>
        </div>
        <div class="card-body">
          <div style="display:flex;align-items:flex-end;gap:8px;height:180px;padding:10px 0;">
            ${days.map(d => {
              const h = Math.max(4, (byDay[d].kcal / maxKcal) * 160);
              return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;">
                <div style="font-size:0.6875rem;color:var(--color-text-muted);">${Math.round(byDay[d].kcal)}</div>
                <div style="width:100%;max-width:32px;height:${h}px;background:var(--color-primary);border-radius:4px 4px 0 0;opacity:0.85;"></div>
                <div style="font-size:0.6875rem;color:var(--color-text-muted);">${d.slice(5)}</div>
              </div>`;
            }).join('')}
          </div>
          <p style="font-size:0.75rem;color:var(--color-text-muted);margin-top:8px;">柱状图高度为估算中值，非精确测量。数据仅存于本机浏览器。</p>
        </div>
      </div>
      <div class="grid-3">
        <div class="card"><div class="card-title" style="font-size:0.875rem;">平均热量</div><div style="font-size:1.5rem;font-weight:700;">${Math.round(days.reduce((s,d)=>s+byDay[d].kcal,0)/days.length)} <span style="font-size:0.875rem;font-weight:400;color:var(--color-text-muted);">kcal/天</span></div></div>
        <div class="card"><div class="card-title" style="font-size:0.875rem;">平均蛋白质</div><div style="font-size:1.5rem;font-weight:700;">${Math.round(days.reduce((s,d)=>s+byDay[d].protein,0)/days.length)} <span style="font-size:0.875rem;font-weight:400;color:var(--color-text-muted);">g/天</span></div></div>
        <div class="card"><div class="card-title" style="font-size:0.875rem;">平均糖摄入</div><div style="font-size:1.5rem;font-weight:700;">${Math.round(days.reduce((s,d)=>s+byDay[d].sugar,0)/days.length)} <span style="font-size:0.875rem;font-weight:400;color:var(--color-text-muted);">g/天</span></div></div>
      </div>
    `;
  }

  function viewDetail(id) {
    const r = AppState.getRecords().find(x => x.id === id);
    if (!r) return;
    const itemsHTML = (r.items || []).map(it => `
      <div style="border:1px solid var(--color-border);border-radius:8px;padding:10px;margin-bottom:8px;">
        <div style="font-weight:500;margin-bottom:6px;">${it.name}
          ${it.confidence?`<span class="tag ${it.confidence>=0.7?'tag-success':it.confidence>=0.5?'tag-pending':'tag-source-low'}" style="margin-left:6px;">置信度${Math.round(it.confidence*100)}%</span>`:''}
        </div>
        ${UI.nutritionGrid({
          kcal: it.calories_kcal, protein_g: it.protein_g, fat_g: it.fat_g,
          carbs_g: it.carbs_g, sugar_g: it.sugar_g, sodium_mg: it.sodium_mg || {value:null,interval:null,value_type:'unknown'}
        })}
        ${it.warnings&&it.warnings.length?`<div style="font-size:0.75rem;color:var(--color-warning);margin-top:6px;">⚠ ${it.warnings.join('；')}</div>`:''}
        ${it.beverage_result?`<details style="margin-top:6px;"><summary class="detail-toggle">查看饮品计算详情</summary><div class="detail-content" style="font-size:0.75rem;color:var(--color-text-secondary);">
          目录版本：${it.beverage_result.catalog_version} · 生效：${it.beverage_result.effective_from}<br>
          serving basis：${it.beverage_result.serving_basis?.description || '未知'}<br>
          来源：${(it.beverage_result.sources||[]).map(s=>s.publisher).join('；') || '来源不足'}
        </div></details>`:''}
      </div>
    `).join('');
    UI.modal('记录详情', `
      <div style="margin-bottom:12px;font-size:0.875rem;color:var(--color-text-secondary);">
        ${r.merchant_label} · ${r.meal_period} · ${new Date(r.created_at).toLocaleString('zh-CN')}
      </div>
      ${r.raw_text?`<div style="background:var(--color-bg);padding:8px 12px;border-radius:6px;font-size:0.8125rem;margin-bottom:12px;"><strong>原始文本：</strong><br>${r.raw_text}</div>`:''}
      ${itemsHTML || '<p>无明细项</p>'}
    `, `<button class="btn btn-secondary" onclick="document.querySelector('.modal-overlay').remove()">关闭</button>`);
  }

  function editRecord(id) {
    UI.toast('编辑功能：可修改餐次、备注和实际摄入比例', 'info');
    viewDetail(id);
  }

  function deleteRecord(id) {
    UI.confirmDialog('删除记录', '确定要删除这条记录吗？此操作不可恢复。', () => {
      AppState.deleteRecord(id);
      UI.toast('记录已删除', 'success');
      App.rerender();
    }, '删除', true);
  }

  function exportData() {
    const records = AppState.getRecords();
    const profile = AppState.getProfile();
    const data = { export_time: new Date().toISOString(), profile, records, note: '数据导出，不含真实身份信息' };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `nutrition_records_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    UI.toast('已导出JSON文件', 'success');
  }

  function setFilter(f) { filter = f; App.rerender(); }
  function setPeriod(p) { periodFilter = p; App.rerender(); }
  function setView(v) { view = v; App.rerender(); }

  return { render, setFilter, setPeriod, setView, viewDetail, editRecord, deleteRecord, exportData };
})();

      fat_g: parseInt(document.getElementById('targetFat').value) || 60,

  }

  function grantConsent() {
    UI.modal('授权营养师查看', `

      </ul>

      <div class="form-group">
        <label class="form-label">授权期限</label>
        <select class="form-select" id="consentDays">
          <option value="7">7天</option>
          <option value="30" selected>30天</option>
          <option value="90">90天</option>
        </select>
      </div>
    `, `
      <button class="btn btn-secondary" onclick="document.querySelector('.modal-overlay').remove()">取消</button>
      <button class="btn btn-primary" onclick="PageGoals.confirmGrant()">确认授权</button>
    `);
  }

  function confirmGrant() {
    const days = parseInt(document.getElementById('consentDays')?.value) || 30;
    const p = AppState.getProfile();
    p.consent_status = 'granted';
    p.consent_expires_at = new Date(Date.now() + days * 86400000).toISOString().slice(0, 10);
    AppState.saveProfile(p);
    document.querySelector('.modal-overlay')?.remove();
    UI.toast(`已授权营养师查看，期限${days}天`, 'success');
    App.rerender();
  }

  function revokeConsent() {
    UI.confirmDialog('撤回授权', '确定撤回营养师查看授权吗？撤回后营养师将无法查看您的数据，已有审计记录保留。', () => {
      const p = AppState.getProfile();
      p.consent_status = 'revoked';
      p.consent_expires_at = null;
      AppState.saveProfile(p);
      UI.toast('已撤回授权', 'success');
      App.rerender();
    }, '撤回', true);
  }

  function exportAll() {
    const data = {
      export_time: new Date().toISOString(),
      profile: AppState.getProfile(),
      records: AppState.getRecords()
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `yingyangzhilian_data_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    UI.toast('已导出所有数据', 'success');
  }

  function clearAll() {
    UI.confirmDialog('清空所有本地数据', '此操作将删除所有记录、画像和设置，且不可恢复。建议先导出备份。确定继续吗？', () => {
      localStorage.clear();
      AppState.init();
      UI.toast('已清空所有本地数据', 'success');
      App.rerender();
    }, '清空所有数据', true);
  }

  function saveApiProxy() {
    const input = document.getElementById('apiProxyInput');
    if (!input) return;
    let val = input.value.trim();
    if (val && !val.startsWith('http')) val = 'https://' + val;
    if (val.endsWith('/')) val = val.slice(0, -1);
    localStorage.setItem('npv2_api_proxy', val);
    UI.toast(val ? 'API 中转地址已保存' : 'API 中转地址已清除', 'success');
  }
  function clearApiProxy() {
    localStorage.removeItem('npv2_api_proxy');
    const input = document.getElementById('apiProxyInput');
    if (input) input.value = '';
    UI.toast('已清除 API 中转地址', 'info');
  }

  return { render, updateProfile, togglePref, saveProfile, grantConsent, confirmGrant, revokeConsent, exportAll, clearAll, saveApiProxy, clearApiProxy };
})();

    { title: '减脂期外卖怎么选？亲测有效', views: 2150, likes: 156, comments: 41, time: '5小时前' },
