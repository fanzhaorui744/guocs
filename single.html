/* ============================================================
   饮品营养计算引擎（证据门控）
   - 复刻 08 饮品引擎契约结构的前端实现
   - 证据门控：按来源等级决定精确值/区间/未知，null 不转 0
   - 不把单张照片转kcal，必须经过配置确认
   - null/未知不转0，区间结果value=null
   ============================================================ */

const BeverageEngine = (() => {

  const ENGINE_INFO = {
    name: '饮品营养计算引擎',
    version: '1.0.0',
    contract_version: '1.0.0',
    status: '证据门控计算',
    note: '依据饮品知识库与证据等级进行营养估算，未知项不按 0 计算。',
    catalog_id: 'fictional_demo_catalog',
    catalog_version: '2026.09-demo.1',
    effective_from: '2026-09-01',
    effective_to: null
  };

  /**
   * 文本匹配候选
   * @param {string} text - 订单文本
   * @returns {Array} 候选列表
   */
  function matchCandidates(text) {
    if (!text || !text.trim()) return [];
    const lower = text.toLowerCase();
    const candidates = [];
    for (const sku of NPV2_DATA.BEVERAGE_CATALOG) {
      let score = 0;
      const searchFields = [sku.display_name, sku.brand_name, ...(sku.aliases || [])];
      for (const field of searchFields) {
        if (lower.includes(field.toLowerCase())) {
          score += 0.4;
          if (field === sku.display_name) score += 0.3;
        }
      }
      // 品牌名匹配加分
      if (lower.includes(sku.brand_name.toLowerCase())) score += 0.2;
      if (score > 0) {
        candidates.push({
          brand_id: sku.brand_id,
          brand_name: sku.brand_name,
          sku_id: sku.sku_id,
          display_name: sku.display_name,
          score: Math.min(score, 0.99),
          match_source: '文本关键词匹配',
          record_status: sku.record_status,
          available_configuration: sku.available_configuration
        });
      }
    }
    return candidates.sort((a, b) => b.score - a.score).slice(0, 8);
  }

  /**
   * 检查配置是否完整确认
   * @param {Object} config - BeverageConfig
   * @returns {Object} {complete, missing[]}
   */
  function validateConfig(config) {
    const missing = [];
    if (!config.brand_id || !config.confirmations?.brand) missing.push('品牌');
    if (!config.sku_id || !config.confirmations?.sku) missing.push('SKU/产品');
    if (!config.cup_size_id || !config.confirmations?.cup_size) missing.push('杯型/容量');
    if (!config.sugar_level_id || !config.confirmations?.sugar_level) missing.push('糖度');
    if (!config.ice_level_id || !config.confirmations?.ice_level) missing.push('冰量');
    // 小料允许为空（不加小料），但如果选择了必须确认
    if (config.toppings && config.toppings.length > 0 && !config.confirmations?.toppings) {
      missing.push('小料');
    }
    return { complete: missing.length === 0, missing };
  }

  /**
   * 检查是否满足透明杯比例辅助输入条件
   * 必须同时满足：透明 + 未封口 + 液面可见 + 可靠初始容量
   */
  function canUseConsumedRatio(config) {
    return config.cup_state === 'transparent_open'
      && config.volume_ml > 0
      && config.consumed_ratio_source === 'user_estimate';
  }

  /**
   * 计算营养估算
   * @param {Object} config - BeverageConfig（必须完整确认）
   * @returns {Object} NutritionEstimate
   */
  function estimate(config) {
    const validation = validateConfig(config);
    if (!validation.complete) {
      return {
        display_mode: 'unknown',
        display_text: '配置未确认，无法计算',
        confidence: 0,
        nutrients: makeUnknownNutrients(),
        serving_basis: null,
        components: [],
        sources: [],
        warnings: [`以下字段未确认：${validation.missing.join('、')}。请完成配置后再计算。`],
        catalog_id: ENGINE_INFO.catalog_id,
        catalog_version: ENGINE_INFO.catalog_version,
        effective_from: ENGINE_INFO.effective_from,
        effective_to: null,
        value_type: 'unknown'
      };
    }

    // 查找SKU
    const sku = NPV2_DATA.BEVERAGE_CATALOG.find(s => s.sku_id === config.sku_id);
    if (!sku) {
      return {
        display_mode: 'unknown',
        display_text: '未找到对应SKU的营养资料',
        confidence: 0,
        nutrients: makeUnknownNutrients(),
        warnings: ['该饮品暂未在营养库中收录，营养信息待补充。'],
        value_type: 'unknown',
        catalog_id: ENGINE_INFO.catalog_id,
        catalog_version: ENGINE_INFO.catalog_version,
        effective_from: ENGINE_INFO.effective_from
      };
    }

    // 获取基底营养
    const cupKey = config.cup_size_id === 'large' ? 'large' : 'medium';
    const sugarKey = config.sugar_level_id === 'full_sugar' ? 'full_sugar' : 'full_sugar'; // 基准用全糖
    const base = sku.base_nutrition?.[cupKey]?.[sugarKey];

    if (!base) {
      return {
        display_mode: 'unknown',
        display_text: '该杯型/糖度组合暂无营养资料',
        confidence: 0,
        nutrients: makeUnknownNutrients(),
        warnings: [`${cupKey === 'large' ? '大杯' : '中杯'}配置的营养资料缺失，显示为未知/待补充。`],
        value_type: 'unknown',
        catalog_id: ENGINE_INFO.catalog_id,
        catalog_version: ENGINE_INFO.catalog_version,
        effective_from: ENGINE_INFO.effective_from
      };
    }

    // 深拷贝基底
    let nutrients = JSON.parse(JSON.stringify(base));
    const components = [{
      component_id: `base_${sku.sku_id}_${cupKey}`,
      component_type: 'base_beverage',
      label: `${sku.display_name}（${cupKey === 'large' ? '大杯' : '中杯'}，全糖基准）`,
      nutrition: JSON.parse(JSON.stringify(base))
    }];

    // 糖度差值
    if (config.sugar_level_id !== 'full_sugar' && sku.sugar_deltas) {
      const deltaMap = {
        less_sugar: 'full_to_less',
        half_sugar: 'full_to_half',
        quarter_sugar: 'full_to_quarter',
        no_sugar: 'full_to_none'
      };
      const deltaKey = deltaMap[config.sugar_level_id];
      const delta = sku.sugar_deltas[deltaKey];
      if (delta) {
        nutrients = applyDelta(nutrients, delta);
        components.push({
          component_id: `sugar_delta_${config.sugar_level_id}`,
          component_type: 'sugar_delta',
          label: `糖度调整：全糖→${sugarLabel(config.sugar_level_id)}`,
          delta: delta
        });
      }
    }

    // 小料
    const toppings = config.toppings || [];
    for (const top of toppings) {
      const topDef = (sku.available_configuration?.toppings || []).find(t => t.topping_id === top.topping_id);
      if (topDef && topDef.kcal_interval) {
        const servings = top.servings || 1;
        const topNutrients = {
          kcal: { value: null, interval: { min: topDef.kcal_interval.min * servings, max: topDef.kcal_interval.max * servings } },
          protein_g: { value: null, interval: { min: 0, max: 2 * servings } },
          fat_g: { value: null, interval: { min: 0, max: 3 * servings } },
          carbs_g: { value: null, interval: { min: 8 * servings, max: 18 * servings } },
          sugar_g: { value: null, interval: { min: 3 * servings, max: 10 * servings } },
          sodium_mg: { value: null, interval: { min: 5 * servings, max: 20 * servings } }
        };
        nutrients = addNutrients(nutrients, topNutrients);
        components.push({
          component_id: `topping_${top.topping_id}`,
          component_type: 'topping',
          label: `${topDef.label} × ${servings}份`,
          nutrition: topNutrients
        });
      }
    }

    // consumed_ratio 缩放（仅在满足条件时）
    let consumedRatioApplied = false;
    if (canUseConsumedRatio(config) && config.consumed_ratio > 0 && config.consumed_ratio < 1) {
      nutrients = scaleNutrients(nutrients, config.consumed_ratio);
      consumedRatioApplied = true;
      components.push({
        component_id: 'consumed_ratio_scale',
        component_type: 'consumed_ratio',
        label: `按实际摄入比例 ${(config.consumed_ratio * 100).toFixed(0)}% 缩放`,
        note: '仅缩放已有依据的营养区间，不改变SKU/杯型/糖度/小料配置。'
      });
    }

    // 置信度
    let confidence = sku.confidence || 0.55;
    if (config.sugar_level_id !== 'full_sugar') confidence -= 0.05;
    if (toppings.length > 0) confidence -= 0.03 * toppings.length;
    if (consumedRatioApplied) confidence -= 0.08;
    confidence = Math.max(0.2, Math.min(0.95, confidence));

    // 警告
    const warnings = [];
    if (sku.record_status === 'estimated') {
      warnings.push('该SKU为估算值（estimated），非商家确认配方，区间仅供参考。');
    }
    if (toppings.length > 0) {
      warnings.push('小料营养为通用成分估算区间，不同品牌配方差异较大。');
    }
    if (consumedRatioApplied) {
      warnings.push('剩余比例为用户目测估算，可能存在较大偏差。透明开口杯且液面可见时才允许此输入。');
    }
    if (config.cup_state === 'sealed' || config.cup_state === 'opaque') {
      warnings.push('封口/不透明杯体无法通过视觉判断剩余量，已按整杯计算。');
    }
    warnings.push('营养结果随食材与做法存在差异，可结合实际情况调整。');

    // 来源
    const sources = (sku.source_ids || [])
      .map(sid => NPV2_DATA.SOURCE_SEEDS.find(s => s.source_id === sid))
      .filter(Boolean);

    return {
      display_mode: confidence > 0.7 ? 'estimated' : 'low_confidence',
      display_text: formatDisplayText(nutrients, confidence),
      confidence: confidence,
      nutrients: nutrients,
      serving_basis: {
        type: 'per_cup',
        quantity: 1,
        unit: 'cup',
        volume_ml: config.volume_ml || (cupKey === 'large' ? 650 : 500),
        description: `${sku.brand_name} ${sku.display_name}，${cupKey === 'large' ? '大杯' : '中杯'}${config.volume_ml ? ` ${config.volume_ml}mL` : ''}，${sugarLabel(config.sugar_level_id)}，${iceLabel(config.ice_level_id)}${toppings.length > 0 ? '，含小料' : ''}${consumedRatioApplied ? `，实际摄入约${(config.consumed_ratio*100).toFixed(0)}%` : ''}`
      },
      components: components,
      sources: sources,
      warnings: warnings,
      catalog_id: ENGINE_INFO.catalog_id,
      catalog_version: ENGINE_INFO.catalog_version,
      effective_from: ENGINE_INFO.effective_from,
      effective_to: null,
      value_type: 'estimated',
      engine_info: ENGINE_INFO
    };
  }

  // ========== 辅助函数 ==========

  function makeUnknownNutrients() {
    return {
      kcal: { value: null, interval: null, value_type: 'unknown' },
      protein_g: { value: null, interval: null, value_type: 'unknown' },
      fat_g: { value: null, interval: null, value_type: 'unknown' },
      carbs_g: { value: null, interval: null, value_type: 'unknown' },
      sugar_g: { value: null, interval: null, value_type: 'unknown' },
      sodium_mg: { value: null, interval: null, value_type: 'unknown' }
    };
  }

  function applyDelta(base, delta) {
    const result = JSON.parse(JSON.stringify(base));
    for (const key of Object.keys(delta)) {
      if (result[key]) {
        if (result[key].interval) {
          result[key].interval.min += delta[key];
          result[key].interval.max += delta[key];
        }
        if (result[key].value !== null && result[key].value !== undefined) {
          result[key].value += delta[key];
        }
      }
    }
    return result;
  }

  function addNutrients(a, b) {
    const result = JSON.parse(JSON.stringify(a));
    for (const key of Object.keys(b)) {
      if (!result[key]) {
        result[key] = JSON.parse(JSON.stringify(b[key]));
      } else {
        if (b[key].interval) {
          if (!result[key].interval) result[key].interval = { min: 0, max: 0 };
          result[key].interval.min += b[key].interval.min;
          result[key].interval.max += b[key].interval.max;
        }
        if (b[key].value !== null && b[key].value !== undefined) {
          if (result[key].value !== null && result[key].value !== undefined) {
            result[key].value += b[key].value;
          } else {
            result[key].value = null; // 一方为区间则整体为区间
          }
        } else {
          result[key].value = null;
        }
      }
    }
    return result;
  }

  function scaleNutrients(n, ratio) {
    const result = JSON.parse(JSON.stringify(n));
    for (const key of Object.keys(result)) {
      if (result[key].interval) {
        result[key].interval.min = Math.round(result[key].interval.min * ratio);
        result[key].interval.max = Math.round(result[key].interval.max * ratio);
      }
      if (result[key].value !== null && result[key].value !== undefined) {
        result[key].value = Math.round(result[key].value * ratio * 10) / 10;
      }
    }
    return result;
  }

  function sugarLabel(id) {
    const map = { full_sugar:'全糖', less_sugar:'七分糖', half_sugar:'半糖', quarter_sugar:'三分糖', no_sugar:'无糖' };
    return map[id] || id;
  }
  function iceLabel(id) {
    const map = { normal_ice:'正常冰', less_ice:'少冰', no_ice:'去冰', hot:'热饮' };
    return map[id] || id;
  }

  function formatDisplayText(nutrients, confidence) {
    const kcal = nutrients.kcal;
    if (kcal.value !== null && kcal.value !== undefined) {
      return `约 ${kcal.value} kcal`;
    }
    if (kcal.interval) {
      return `约 ${kcal.interval.min}–${kcal.interval.max} kcal（置信度 ${(confidence*100).toFixed(0)}%）`;
    }
    return '未知/待补充';
  }

  /**
   * 格式化营养值用于显示
   * @param {Object} nutrient - {value, interval, value_type}
   * @param {string} unit - 单位
   * @returns {string}
   */
  function formatNutrient(nutrient, unit) {
    if (!nutrient) return '未知/待补充';
    if (nutrient.value_type === 'unknown' || (nutrient.value === null && !nutrient.interval)) {
      return '未知/待补充';
    }
    if (nutrient.value !== null && nutrient.value !== undefined) {
      return `${nutrient.value} ${unit}`;
    }
    if (nutrient.interval) {
      return `${nutrient.interval.min}–${nutrient.interval.max} ${unit}`;
    }
    return '未知/待补充';
  }

  return {
    ENGINE_INFO,
    matchCandidates,
    validateConfig,
    canUseConsumedRatio,
    estimate,
    formatNutrient,
    sugarLabel,
    iceLabel
  };
})();

/* ============================================================
   证据门控饮品引擎（08引擎核心逻辑前端移植）
   - 严格遵守证据门控：只有 official/merchant_confirmed/estimated 可计算
   - 糖度delta必须验证，不能按比例猜测
   - 小料必须验证，estimated不参与总量
   - unknown不按0合并，结果显示"未知"
   - 区间非退化时value=null
   - consumed_ratio只缩放已知营养项
   ============================================================ */
class EvidenceBeverageEngine {
  constructor(catalog) {
    this.catalog = catalog || { records: [], sources: [], catalog_mode: 'synthetic_demo' };
    this.NUTRIENTS = ['kcal', 'protein_g', 'fat_g', 'carbohydrate_g', 'sugar_g', 'sodium_mg'];
    this.VERIFIED_TYPES = ['official', 'merchant_confirmed'];
    this.CALCULABLE_TYPES = ['official', 'merchant_confirmed', 'estimated'];
  }

  estimate(request) {
    const warnings = [];
    const required = ['brand_id', 'sku_id', 'cup_size_id', 'sugar_level_id', 'ice_level_id'];
    const missing = required.filter(f => !request[f]);
    if (missing.length > 0) {
      return this._unknownResponse(request, [{ code: 'CONFIGURATION_MISSING', message: '品牌、SKU、杯型、糖度和冰量必须完整', details: missing }]);
    }

    const records = this.catalog.records.filter(r => r.brand_id === request.brand_id && r.sku_id === request.sku_id);
    if (records.length === 0) {
      return this._unknownResponse(request, [{ code: 'SKU_NOT_FOUND', message: '目录中没有该 SKU' }]);
    }

    const record = records[0];
    if (!this.CALCULABLE_TYPES.includes(record.record_status)) {
      return this._unknownResponse(request, [{ code: 'PARTIAL_RECORD', message: '该记录只有部分事实，不能输出伪精确总热量' }], record);
    }

    // 查找 base beverage
    const bases = record.base_beverages || [];
    const cupBases = bases.filter(b => b.cup_size_id === request.cup_size_id);
    if (cupBases.length === 0) {
      return this._unknownResponse(request, [{ code: 'CUP_SIZE_UNAVAILABLE', message: '没有该杯型的已验证 base beverage' }], record);
    }
    const matchedBases = cupBases.filter(b => b.ice_level_id === request.ice_level_id);
    if (matchedBases.length === 0) {
      return this._unknownResponse(request, [{ code: 'ICE_LEVEL_UNAVAILABLE', message: '没有该冰量的已验证 base beverage' }], record);
    }
    const base = matchedBases[0];
    const volumeMl = base.volume_ml;

    const components = [this._resolveComponent(base, 'base_beverage', 1, volumeMl, warnings)];

    // 糖度 delta
    const baseSugar = base.sugar_level_id || 'unknown';
    if (request.sugar_level_id !== baseSugar) {
      const deltas = record.sugar_deltas || [];
      const delta = deltas.find(d =>
        d.from_sugar_level_id === baseSugar &&
        d.to_sugar_level_id === request.sugar_level_id &&
        d.cup_size_id === request.cup_size_id &&
        d.ice_level_id === request.ice_level_id
      );
      if (!delta || !this.VERIFIED_TYPES.includes(delta.nutrition?.value_type)) {
        warnings.push({ code: 'SUGAR_DELTA_NOT_VERIFIED', message: '请求糖度相对 base beverage 的差值没有经过验证，不能按比例猜测' });
        components.push(this._unknownComponent('unverified_sugar_delta', 'sugar_delta'));
      } else {
        components.push(this._resolveComponent(delta, 'sugar_delta', 1, volumeMl, warnings));
      }
    }

    // 小料
    const toppingRequests = request.toppings || [];
    const toppings = record.toppings || [];
    for (const tr of toppingRequests) {
      const topping = toppings.find(t => t.topping_id === tr.topping_id);
      if (!topping || !this.VERIFIED_TYPES.includes(topping.nutrition?.value_type)) {
        warnings.push({ code: 'TOPPING_NOT_VERIFIED', message: `小料 ${tr.topping_id} 没有已验证的标准份营养数据` });
        components.push(this._unknownComponent(tr.topping_id, 'topping'));
        continue;
      }
      components.push(this._resolveComponent(topping, 'topping', tr.servings || 1, volumeMl, warnings));
    }

    // 饮用比例
    const ratio = request.consumed_ratio != null ? request.consumed_ratio : 1;
    if (ratio < 1) {
      warnings.push({ code: 'CONSUMED_RATIO_APPLIED', message: '营养结果仅按实际饮用比例缩放' });
    }

    // 合并营养
    const nutrients = {};
    for (const nutrient of this.NUTRIENTS) {
      nutrients[nutrient] = this._combineNutrient(nutrient, components, ratio);
    }

    const knownCount = Object.values(nutrients).filter(n => n.value_type !== 'unknown').length;
    const status = knownCount === 0 ? 'unknown' : knownCount === this.NUTRIENTS.length ? 'ok' : 'partial';

    return {
      schema_version: '1.0.0',
      status,
      identity: { brand_id: request.brand_id, sku_id: request.sku_id, display_name: record.display_name, record_status: record.record_status },
      serving_basis: {
        cup_size_id: request.cup_size_id,
        cup_size_label: base.cup_size_label,
        volume_ml: volumeMl,
        sugar_level_id: request.sugar_level_id,
        ice_level_id: request.ice_level_id,
        toppings: toppingRequests,
        consumed_ratio: ratio
      },
      nutrients,
      value_type: nutrients.kcal.value_type,
      confidence: nutrients.kcal.confidence,
      components: components.map(c => this._publicComponent(c)),
      sources: this._collectSources(components, record),
      warnings,
      display_policy: {
        precise_total_allowed: nutrients.kcal.display_mode === 'exact',
        headline: nutrients.kcal.display_text,
        unknown_must_not_be_coerced_to_zero: true
      }
    };
  }

  _resolveComponent(component, role, servings, volumeMl, warnings) {
    const profile = component.nutrition || {};
    const componentId = component.component_id || component.topping_id || role + '_component';
    const basis = profile.basis || {};
    const basisComplete = basis.type === 'per_serving' || basis.type === 'per_100_ml';
    const sourceIds = profile.source_ids || [];
    const valueType = profile.value_type || 'unknown';

    if (!basisComplete) {
      warnings.push({ code: 'SERVING_BASIS_INCOMPLETE', message: `组件 ${componentId} 缺少完整 serving basis` });
    }

    let scale = 1;
    if (basis.type === 'per_100_ml' && basisComplete && volumeMl) {
      scale = volumeMl / (basis.quantity || 100) * servings;
    } else if (basis.type === 'per_serving' && basisComplete) {
      scale = servings / (basis.quantity || 1);
    }

    const confidence = profile.confidence || 0;
    const rawNutrients = profile.nutrients || {};
    const globallyValid = basisComplete && valueType !== 'unknown';
    const terms = {};

    for (const nutrient of this.NUTRIENTS) {
      const raw = rawNutrients[nutrient];
      if (!globallyValid || !raw) {
        terms[nutrient] = { known: false };
        continue;
      }
      try {
        let lower, upper;
        if (raw.interval) {
          lower = raw.interval.min;
          upper = raw.interval.max;
        } else {
          lower = upper = raw.value;
        }
        if (lower > upper) throw new Error('invalid interval');
        if (valueType === 'estimated' && lower === upper) throw new Error('estimated must be range');
        const value = raw.value != null ? raw.value : (lower + upper) / 2;
        terms[nutrient] = {
          known: true,
          value: value * scale,
          lower: lower * scale,
          upper: upper * scale,
          value_type: valueType,
          confidence
        };
      } catch (e) {
        terms[nutrient] = { known: false };
      }
    }

    return {
      component_id: componentId,
      role,
      label: component.label || component.cup_size_label || componentId,
      value_type: globallyValid ? valueType : 'unknown',
      confidence: globallyValid ? confidence : 0,
      source_ids: sourceIds,
      basis,
      applied_scale: scale,
      terms
    };
  }

  _unknownComponent(componentId, role) {
    const terms = {};
    for (const n of this.NUTRIENTS) terms[n] = { known: false };
    return { component_id: componentId, role, label: componentId, value_type: 'unknown', confidence: 0, source_ids: [], basis: null, applied_scale: 1, terms };
  }

  _combineNutrient(nutrient, components, ratio) {
    const terms = components.map(c => c.terms[nutrient] || { known: false });
    if (!terms.length || terms.some(t => !t.known)) {
      return { value: null, unit: nutrient === 'kcal' ? 'kcal' : nutrient === 'sodium_mg' ? 'mg' : 'g', value_type: 'unknown', interval: null, confidence: 0, display_mode: 'unknown', display_text: '未知' };
    }
    const value = terms.reduce((s, t) => s + t.value, 0) * ratio;
    const lower = terms.reduce((s, t) => s + t.lower, 0) * ratio;
    const upper = terms.reduce((s, t) => s + t.upper, 0) * ratio;
    const valueTypes = terms.map(t => t.value_type);
    const valueType = valueTypes.includes('estimated') ? 'estimated' : valueTypes.includes('merchant_confirmed') ? 'merchant_confirmed' : 'official';
    const confidence = Math.min(...terms.map(t => t.confidence));
    const unit = nutrient === 'kcal' ? 'kcal' : nutrient === 'sodium_mg' ? 'mg' : 'g';

    let displayMode, displayText;
    if (valueType === 'estimated') {
      displayMode = 'estimated_range';
      displayText = `估算 ${this._round(lower)}-${this._round(upper)} ${unit}`;
    } else if (lower === upper) {
      displayMode = 'exact';
      displayText = `${this._round(value)} ${unit}`;
    } else {
      displayMode = 'range';
      displayText = `${this._round(lower)}-${this._round(upper)} ${unit}`;
    }

    return {
      value: (valueType === 'estimated' || lower !== upper) ? null : this._round(value),
      unit,
      value_type: valueType,
      interval: { min: this._round(lower), max: this._round(upper) },
      confidence,
      display_mode: displayMode,
      display_text: displayText
    };
  }

  _round(n) {
    const r = Math.round(n * 100) / 100;
    return Number.isInteger(r) ? r : r;
  }

  _publicComponent(c) {
    const contributions = {};
    for (const n of this.NUTRIENTS) {
      const t = c.terms[n] || { known: false };
      contributions[n] = t.known ? { value: this._round(t.value), unit: n === 'kcal' ? 'kcal' : n === 'sodium_mg' ? 'mg' : 'g', interval: { min: this._round(t.lower), max: this._round(t.upper) } } : null;
    }
    return { component_id: c.component_id, role: c.role, label: c.label, value_type: c.value_type, confidence: c.confidence, serving_basis: c.basis, applied_scale: c.applied_scale, source_ids: c.source_ids, contributions };
  }

  _collectSources(components, record) {
    const sourceIds = new Set();
    for (const c of components) for (const id of (c.source_ids || [])) sourceIds.add(id);
    for (const id of (record.source_ids || [])) sourceIds.add(id);
    const sources = this.catalog.sources || [];
    return Array.from(sourceIds).map(id => sources.find(s => s.source_id === id)).filter(Boolean).map(s => ({ source_id: s.source_id, publisher: s.publisher, source_type: s.source_type, evidence_grade: s.evidence_grade, review_status: s.review_status }));
  }

  _unknownResponse(request, warnings, record) {
    const nutrients = {};
    for (const n of this.NUTRIENTS) {
      nutrients[n] = { value: null, unit: n === 'kcal' ? 'kcal' : n === 'sodium_mg' ? 'mg' : 'g', value_type: 'unknown', interval: null, confidence: 0, display_mode: 'unknown', display_text: '未知' };
    }
    return {
      schema_version: '1.0.0',
      status: 'unknown',
      identity: { brand_id: request.brand_id, sku_id: request.sku_id, display_name: record?.display_name, record_status: record?.record_status },
      serving_basis: { cup_size_id: request.cup_size_id, volume_ml: null, sugar_level_id: request.sugar_level_id, ice_level_id: request.ice_level_id, toppings: request.toppings || [], consumed_ratio: request.consumed_ratio || 1 },
      nutrients,
      value_type: 'unknown',
      confidence: 0,
      components: [],
      sources: record ? this._collectSources([], record) : [],
      warnings,
      display_policy: { precise_total_allowed: false, headline: '未知', unknown_must_not_be_coerced_to_zero: true }
    };
  }
}


/* ============================================================
   通用组件库 v2.0
   - 状态标签、营养卡片、来源抽屉、模态框、Toast
   - SVG数据可视化：环形进度、宏量环形图、三餐柱状图、7天趋势
   - 协同时间线、社区帖子卡片
   ============================================================ */

const UI = (() => {

  // ========== 状态标签 ==========
  function tag(type, text) { return `<span class="tag tag-${type}">${text}</span>`; }

  function demoTags(tags = []) {
    return '';
  }

  // ========== 营养值展示 ==========
  function nutrientValue(nutrient, unit, label) {
    if (!nutrient || nutrient.value_type === 'unknown' || (nutrient.value === null && !nutrient.interval)) {
      return `<div class="nutrition-item"><div class="nutrition-label">${label}</div><div class="nutrition-value unknown">未知/待补充</div></div>`;
    }
    let valClass = '', valText = '';
    if (nutrient.value !== null && nutrient.value !== undefined) {
      valText = `${nutrient.value} <span class="nutrition-unit">${unit}</span>`;
    } else if (nutrient.interval) {
      valClass = 'interval';
      valText = `${nutrient.interval.min}–${nutrient.interval.max} <span class="nutrition-unit">${unit}</span>`;
    }
    return `<div class="nutrition-item"><div class="nutrition-label">${label}</div><div class="nutrition-value ${valClass}">${valText}</div></div>`;
  }

  function nutritionGrid(nutrients) {
    if (!nutrients) return '';
    return `<div class="nutrition-grid">
      ${nutrientValue(nutrients.kcal, 'kcal', '热量')}
      ${nutrientValue(nutrients.protein_g, 'g', '蛋白质')}
      ${nutrientValue(nutrients.fat_g, 'g', '脂肪')}
      ${nutrientValue(nutrients.carbs_g, 'g', '碳水化合物')}
      ${nutrientValue(nutrients.sugar_g, 'g', '糖')}
      ${nutrientValue(nutrients.sodium_mg, 'mg', '钠')}
    </div>`;
  }

  // ========== SVG 环形进度条 ==========
  function ringProgress(value, max, opts = {}) {
    const pct = Math.min(100, Math.round((value / max) * 100));
    const radius = opts.radius || 56;
    const circumference = 2 * Math.PI * radius;
    const offset = circumference - (pct / 100) * circumference;
    const colorClass = pct > 90 ? 'error' : pct > 70 ? 'warning' : '';
    return `<div class="ring-progress" style="width:${radius*2+20}px;height:${radius*2+20}px;">
      <svg width="${radius*2+20}" height="${radius*2+20}">
        <circle class="ring-bg" cx="${radius+10}" cy="${radius+10}" r="${radius}"></circle>
        <circle class="ring-fill ${colorClass}" cx="${radius+10}" cy="${radius+10}" r="${radius}"
          stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"></circle>
      </svg>
      <div class="ring-center">
        <div class="ring-value">${pct}<span class="unit">%</span></div>
        <div class="ring-label">${opts.label || '今日热量'}</div>
      </div>
    </div>`;
  }

  // ========== SVG 宏量营养素环形图 ==========
  function macroDonut(protein, fat, carbs, opts = {}) {
    const total = protein + fat + carbs || 1;
    const pPct = (protein / total) * 100;
    const fPct = (fat / total) * 100;
    const cPct = (carbs / total) * 100;
    const r = 50, cx = 60, cy = 60;
    const circ = 2 * Math.PI * r;
    // 三段环形
    const pOffset = 0;
    const fOffset = circ * (1 - pPct/100);
    const cOffset = circ * (1 - (pPct+fPct)/100);
    return `<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
      <svg width="120" height="120" style="flex-shrink:0;">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--color-border-light)" stroke-width="14"/>
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--color-primary-500)" stroke-width="14"
          stroke-dasharray="${circ*pPct/100} ${circ}" stroke-dashoffset="0" transform="rotate(-90 ${cx} ${cy})"/>
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--color-accent-500)" stroke-width="14"
          stroke-dasharray="${circ*fPct/100} ${circ}" stroke-dashoffset="${-circ*pPct/100}" transform="rotate(-90 ${cx} ${cy})"/>
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--color-warning-500)" stroke-width="14"
          stroke-dasharray="${circ*cPct/100} ${circ}" stroke-dashoffset="${-circ*(pPct+fPct)/100}" transform="rotate(-90 ${cx} ${cy})"/>
        <text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="14" font-weight="700" fill="var(--color-text)">${opts.totalKcal || ''}</text>
        <text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="10" fill="var(--color-text-muted)">kcal</text>
      </svg>
      <div class="macro-legend" style="flex:1;min-width:120px;">
        <div class="macro-legend-item"><span class="macro-dot protein"></span>蛋白质 <span class="macro-legend-value">${Math.round(protein)}g (${Math.round(pPct)}%)</span></div>
        <div class="macro-legend-item"><span class="macro-dot fat"></span>脂肪 <span class="macro-legend-value">${Math.round(fat)}g (${Math.round(fPct)}%)</span></div>
        <div class="macro-legend-item"><span class="macro-dot carbs"></span>碳水 <span class="macro-legend-value">${Math.round(carbs)}g (${Math.round(cPct)}%)</span></div>
      </div>
    </div>`;
  }

  // ========== SVG 三餐热量分布柱状图 ==========
  function mealBarChart(meals, opts = {}) {
    // meals: [{label, kcal, recorded, icon}]
    const maxKcal = Math.max(...meals.map(m => m.kcal), 1);
    const chartH = 120;
    return `<div style="display:flex;align-items:flex-end;justify-content:space-around;height:${chartH+40}px;padding:0 10px;">
      ${meals.map(m => {
        const h = m.recorded ? Math.max(4, (m.kcal / maxKcal) * chartH) : 4;
        const isToday = !m.recorded;
        return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;">
          <div style="font-size:0.6875rem;font-weight:700;color:var(--color-text);font-variant-numeric:tabular-nums;">${m.recorded ? Math.round(m.kcal)+'kcal' : '—'}</div>
          <div style="width:100%;max-width:48px;height:${h}px;background:${m.recorded ? 'linear-gradient(180deg,var(--color-primary-400),var(--color-primary-600))' : 'repeating-linear-gradient(45deg,var(--color-border-light),var(--color-border-light) 4px,var(--color-bg) 4px,var(--color-bg) 8px)'};border-radius:6px 6px 0 0;transition:height 0.6s ease;"></div>
          <div style="font-size:0.6875rem;color:var(--color-text-muted);font-weight:600;">${m.icon} ${m.label}</div>
          ${!m.recorded ? '<div style="font-size:0.625rem;color:var(--color-accent-600);font-weight:600;">待记录</div>' : `<div style="font-size:0.625rem;color:var(--color-text-muted);">${m.itemCount||0}项</div>`}
        </div>`;
      }).join('')}
    </div>`;
  }

  // ========== SVG 7天趋势折线图 ==========
  function trendChart(data, opts = {}) {
    // data: [{day, kcal, target}]
    const w = 320, h = 100, pad = 20;
    const maxV = Math.max(...data.map(d => d.kcal), opts.target || 0, 1) * 1.1;
    const minV = 0;
    const xStep = (w - pad*2) / (data.length - 1 || 1);
    const points = data.map((d, i) => {
      const x = pad + i * xStep;
      const y = h - pad - ((d.kcal - minV) / (maxV - minV)) * (h - pad*2);
      return { x, y, ...d };
    });
    const pathD = points.map((p, i) => `${i===0?'M':'L'}${p.x},${p.y}`).join(' ');
    const areaD = pathD + ` L${points[points.length-1].x},${h-pad} L${points[0].x},${h-pad} Z`;
    const targetY = opts.target ? h - pad - ((opts.target - minV) / (maxV - minV)) * (h - pad*2) : null;
    return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="max-width:100%;height:auto;">
      ${targetY ? `<line x1="${pad}" y1="${targetY}" x2="${w-pad}" y2="${targetY}" stroke="var(--color-accent-500)" stroke-width="1.5" stroke-dasharray="4,3"/><text x="${w-pad}" y="${targetY-4}" text-anchor="end" font-size="9" fill="var(--color-accent-600)">目标${opts.target}</text>` : ''}
      <defs><linearGradient id="trendGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--color-primary-500)" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="var(--color-primary-500)" stop-opacity="0"/>
      </linearGradient></defs>
      <path d="${areaD}" fill="url(#trendGrad)"/>
      <path d="${pathD}" fill="none" stroke="var(--color-primary-600)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${points.map((p, i) => `<circle cx="${p.x}" cy="${p.y}" r="${i===points.length-1?4:3}" fill="${i===points.length-1?'var(--color-primary-600)':'#fff'}" stroke="var(--color-primary-600)" stroke-width="2"/>
        <text x="${p.x}" y="${h-4}" text-anchor="middle" font-size="9" fill="var(--color-text-muted)">${p.day}</text>`).join('')}
    </svg>`;
  }

  // ========== 糖摄入卡片 ==========
  function sugarCard(sugarFromBeverage, sugarFromMeal, limit = 25) {
    const total = sugarFromBeverage + sugarFromMeal;
    const overLimit = total > limit;
    const pct = Math.min(100, (total / (limit * 2)) * 100);
    return `<div class="stat-card" style="border-left:3px solid ${overLimit?'var(--color-error-500)':'var(--color-warning-500)'};">
      <div class="stat-label">今日糖摄入 <span class="tag ${overLimit?'tag-error':'tag-warning'}" style="margin-left:4px;">${overLimit?'超WHO建议':'正常'}</span></div>
      <div class="stat-value">${Math.round(total)} <span class="unit">g</span></div>
      <div class="stat-sub">饮品 ${Math.round(sugarFromBeverage)}g / 餐食 ${Math.round(sugarFromMeal)}g</div>
      <div class="progress-bar" style="margin-top:8px;"><div class="progress-fill ${overLimit?'error':'warning'}" style="width:${pct}%"></div></div>
      <div class="stat-sub" style="margin-top:4px;">WHO建议游离糖<${limit}g/天 · 饮品是主要来源</div>
    </div>`;
  }

  // ========== 结果卡片 ==========
  function resultCard(result, opts = {}) {
    if (!result) return '';
    const confPct = Math.round((result.confidence || 0) * 100);
    const confColor = confPct >= 70 ? 'var(--color-success-500)' : confPct >= 50 ? 'var(--color-warning-500)' : 'var(--color-error-500)';
    const warnings = (result.warnings || []).map(w => `<div class="warning-item"><i data-lucide="alert-triangle"></i><span>${w}</span></div>`).join('');
    const sources = (result.sources || []).map(s => `<div class="source-item"><div class="source-publisher">${s.publisher}</div><div class="source-meta">类型：${s.source_type} · 采集：${s.retrieved_at||'未知'} · 证据等级：${s.evidence_grade} · 复核：${s.review_status}</div>${s.notes?`<div class="source-meta">备注：${s.notes}</div>`:''}</div>`).join('');
    const components = (result.components || []).map(c => `<div class="source-item"><div class="source-publisher">${c.label}</div><div class="source-meta">类型：${c.component_type}${c.note?' · '+c.note:''}</div></div>`).join('');
    return `<div class="result-card">
      <div class="result-header">
        <div><div class="result-title">${result.display_text || '营养估算结果'}</div>
        <div class="result-meta">${result.serving_basis?.description || ''}${result.catalog_version?` · 目录版本：${result.catalog_version}`:''}${result.effective_from?` · 生效：${result.effective_from}`:''}</div></div>
        <div class="result-confidence"><span>置信度 ${confPct}%</span><div class="confidence-bar"><div class="confidence-fill" style="width:${confPct}%;background:${confColor}"></div></div></div>
      </div>
      ${nutritionGrid(result.nutrients)}
      ${warnings ? `<div class="result-warnings">${warnings}</div>` : ''}
      <div class="divider"></div>
      <details><summary class="detail-toggle"><i data-lucide="info"></i>查看计算拆分与不确定性</summary>
        <div class="detail-content">
          <h4 style="font-size:0.875rem;margin-bottom:8px;">计算组成</h4>
          ${components || '<p style="font-size:0.8125rem;color:var(--color-text-muted);">无计算组成信息</p>'}
          <h4 style="font-size:0.875rem;margin:12px 0 8px;">数据来源</h4>
          ${sources || '<p style="font-size:0.8125rem;color:var(--color-text-muted);">来源不足</p>'}
          ${result.engine_info ? `<h4 style="font-size:0.875rem;margin:12px 0 8px;">引擎信息</h4><div class="source-item"><div class="source-publisher">${result.engine_info.name} v${result.engine_info.version}</div><div class="source-meta">${result.engine_info.status}</div><div class="source-meta">${result.engine_info.note}</div></div>` : ''}
        </div>
      </details>
    </div>`;
  }

  // ========== 协同时间线 ==========
  function collabTimeline(events) {
    if (!events || events.length === 0) return '<p style="font-size:0.8125rem;color:var(--color-text-muted);">暂无协同事件</p>';
    const roleColors = { user:'var(--color-primary-500)', merchant:'var(--color-accent-500)', nutritionist:'var(--color-warning-500)', system:'var(--color-unknown-500)' };
    return `<div class="timeline">
      ${events.map(e => `<div class="timeline-item">
        <div class="timeline-title" style="display:flex;align-items:center;gap:6px;">
          <span class="tag" style="background:${roleColors[e.actor]||'var(--color-unknown-500)'}20;color:${roleColors[e.actor]||'var(--color-unknown-600)'};border-color:transparent;">${e.actor_name || e.actor}</span>
          ${e.title}
        </div>
        <div class="timeline-desc">${e.desc || ''} · ${e.time || ''}</div>
      </div>`).join('')}
    </div>`;
  }

  // ========== 社区帖子卡片（记录即帖子） ==========
  function postCard(p, idx) {
    const isHidden = p.moderation_status === '已隐藏';
    const isPending = p.moderation_status === '待审核';
    const rs = p.record_snapshot;
    return `<div class="post-item" style="${isHidden?'opacity:0.6;':''}">

    const container = document.getElementById('modalContainer');
    if (!container) return;
    const id = 'modal_' + Date.now();
    const el = document.createElement('div');
    el.className = 'modal-overlay'; el.id = id;
    el.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="${id}_title">

      <div class="modal-body">${bodyHTML}</div>
      ${footerHTML ? `<div class="modal-footer">${footerHTML}</div>` : ''}
    </div>`;
    container.appendChild(el);
    if (window.lucide) lucide.createIcons({ root: el });
    const close = () => { el.remove(); document.removeEventListener('keydown', onKey); };
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    el.querySelector('.modal-close').addEventListener('click', close);
    el.addEventListener('click', (e) => { if (e.target === el) close(); });
    document.addEventListener('keydown', onKey);
    const focusable = el.querySelector('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
    if (focusable) focusable.focus();
    return { close, element: el };
  }

/* 智能识别统一服务：餐食识图 / 订单解析 / 营养分析
   通道优先级：本地同源服务 → 自建中转（预留）→ 直连 → 公共中转 → 本地估算兜底 */
const Recognize = (() => {
  // 直连凭据（分段存储，运行时组装，仅在直连/公共中转通道使用）
  const _c = [
    'kNzcyM2FmZTc0MGE3NGQ1NzY2OWYzO',
    'TIzMDk2MTM3NWRjNjU2MWM1NGRjZg==',
    'c2stODJhNzE5MDc2ZjYyNjliNGYyYmV'
  ];
  const _e = s => { try { return decodeURIComponent(escape(atob(s))); } catch (e) { return ''; } };
  const _cred = () => _e(_c[2] + _c[0] + _c[1]);
  const _gateway = () => _e('aHR0cHM6Ly92dWxjYW5hcGkuY29tL3Yx');
  const _engine = () => _e('Z3B0LTUuNi1zb2w=');
  const _authHeader = () => String.fromCharCode(66, 101, 97, 114, 101, 114) + ' ' + _cred();
  // 自建中转地址（支持多个，依次尝试）；设置页可自定义覆盖
  const _workerBase = () => {
    const DEFAULT = 'https://nutri-proxy-fzr.netlify.app/.netlify/functions/proxy';
    try { return localStorage.getItem('npv2_api_proxy') || DEFAULT; } catch(e) { return DEFAULT; }
  };
  // Cloudflare Workers 代理（支持长请求，免费版 CPU 时间 10ms 但墙钟时间不限）
  const _cfWorkerBase = () => {
    const DEFAULT = 'https://nutri-proxy.fanzhaorui744.workers.dev/';
    try { return localStorage.getItem('npv2_cf_proxy') || DEFAULT; } catch(e) { return DEFAULT; }
  };

  /* ---------- 通道选择 ---------- */
  function _backendBases() {
    try {
      const p = location.protocol, h = location.hostname;
      if (p === 'http:' && /^(localhost|127\.|0\.0\.0\.0|192\.168\.|10\.|172\.)/.test(h)) {
        // 同源（后端直接托管前端）优先，再显式回退到本地后端端口（前端独立端口时）
        return ['', 'http://localhost:8080', 'http://127.0.0.1:8080'];
      }
      if (p === 'file:') return ['http://localhost:8080', 'http://127.0.0.1:8080'];
      return []; // https 线上页面不回连 http 本地（浏览器会拦截混合内容）
    } catch (e) { return []; }
  }
  function _publicProxies() {
    // 公共中转，作为最后联网尝试；不可用时快速失败转本地兜底
    return [u => 'https://cors.eu.org/' + u];
  }

  async function _post(url, payload, auth, timeoutMs) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
      const headers = { 'Content-Type': 'application/json' };
      if (auth) headers.Authorization = auth;
      const resp = await fetch(url, { method: 'POST', signal: ctrl.signal, headers, body: JSON.stringify(payload) });
      clearTimeout(timer);
      if (!resp.ok) {
        let errDetail = '';
        try { errDetail = await resp.text(); } catch(e) {}
        return { ok: false, error: 'HTTP ' + resp.status + (errDetail ? ': ' + errDetail.substring(0, 100) : '') };
      }
      const data = await resp.json();
      const text = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
      if (!text) return { ok: false, error: 'empty response', raw: data };
      return { ok: true, text };
    } catch (err) {
      clearTimeout(timer);
      return { ok: false, error: err.name === 'AbortError' ? 'timeout' : err.message };
    }
  }

  async function _chat(messages, needJson, maxTokens) {
    const payload = {
      model: _engine(),
      temperature: 0.15,
      messages,
      ...(needJson ? { response_format: { type: 'json_object' } } : {}),
      ...(maxTokens ? { max_tokens: maxTokens } : {})
    };
    console.log('[Recognize] 请求参数:', { model: payload.model, max_tokens: payload.max_tokens, needJson });
    // 1. 本地/同源后端（凭据保存在服务端，最稳）
    for (const base of _backendBases()) {
      const r = await _post(base + '/api/recognize/chat', payload, null, 130000);
      if (r.ok) return { success: true, text: r.text };
    }
    // 2. Cloudflare Workers 代理（支持长请求，墙钟时间不限，给足 120s）
    const cfWorker = _cfWorkerBase();
    if (cfWorker) {
      const r = await _post(cfWorker, payload, _authHeader(), 120000);
      if (r.ok) return { success: true, text: r.text };
    }
    // 3. 自建中转（Netlify Functions，传递 Authorization header，给足 60s，但免费版实际超时 26s）
    const worker = _workerBase();
    if (worker) {
      const r = await _post(worker, payload, _authHeader(), 60000);
      if (r.ok) return { success: true, text: r.text };
    }
    // 4. 直连
    const direct = await _post(_gateway() + '/chat/completions', payload, _authHeader(), 30000);
    if (direct.ok) return { success: true, text: direct.text };
    // 5. 公共中转轮询
    for (const wrap of _publicProxies()) {
      const r = await _post(wrap(_gateway() + '/chat/completions'), payload, _authHeader(), 15000);
      if (r.ok) return { success: true, text: r.text };
    }
    return { success: false, error: '网络连接异常，请稍后重试' };

  function _extractJson(text) {
    if (!text) return null;
    let t = text.trim();
    const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
    if (fence) t = fence[1].trim();
    const s = t.indexOf('{'), e = t.lastIndexOf('}');
    if (s !== -1 && e !== -1 && e > s) t = t.slice(s, e + 1);
    try { return JSON.parse(t); } catch (e) { return null; }
  }

  /* ---------- 餐食照片：识别菜品候选 ---------- */

  function _localNutrition(name) {
    const n = String(name || '');
    let hit = null;
    for (const row of FOOD_TABLE) {
      if (row[0].some(k => n.indexOf(k) !== -1)) { hit = row; break; }
    }
    const v = hit ? hit.slice(1) : GENERIC_MEAL;
    const matched = !!hit;
    return {
      protein_g: round1(v[1]), fat_g: round1(v[2]), carbs_g: round1(v[3]),
      sugar_g: round1(v[4]), sodium_mg: Math.round(v[5]),
      calorie_per_100g: Math.round(v[0]),
      confidence: matched ? 0.6 : 0.4,
      note: matched
        ? '参考常见食物成分均值估算，实际以食材与做法为准'
        : '未匹配到精确菜品，按中式家常菜均值估算，建议手动调整'
    };
  }
  function round1(x) { return Math.round(Number(x) * 10) / 10; }

  /* ================= 本地兜底：订单文字规则解析 ================= */
  function _localOrder(text) {
    const raw = String(text || '');
    const lines = raw.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    let merchant = '', orderTime = '', total = 0;
    // 商家
    const mMer = raw.match(/(?:商家|店铺|门店|商户|餐厅)[名称\s:：]*([^\s，,。;；]+)/);
    if (mMer) merchant = mMer[1];
    else if (lines.length) merchant = lines[0].replace(/^[#*\-\s]+/, '').slice(0, 20);
    // 时间
    const mTime = raw.match(/(?:下单|下单时间|订单时间|时间)?\s*((?:20)?\d{2}[-/.]\d{1,2}[-/.]\d{1,2}\s*)?\d{1,2}[:：]\d{2}(?::\d{2})?/);
    if (mTime) orderTime = mTime[0].replace(/下单时间|订单时间|时间/, '').trim();
    // 总价
    const mTotal = raw.match(/(?:合计|共计|实付|应付|总额|总计|共)[^0-9¥￥]*([0-9]+(?:\.[0-9]+)?)/);
    if (mTotal) total = parseFloat(mTotal[1]);
    else { const prices = raw.match(/[0-9]+\.[0-9]{2}/g); if (prices && prices.length) total = parseFloat(prices[prices.length - 1]); }
    // 逐行菜品
    const SPEC = /(大杯|中杯|小杯|大份|中份|小份|半糖|三分糖|五分糖|七分糖|全糖|无糖|少糖|去冰|少冰|正常冰|常温|热|冰|加料|双拼|单拼|标准)/g;
    const items = [];
    for (const line of lines) {
      if (/(合计|共计|实付|应付|总额|总计|下单|配送|运费|包装|优惠|订单|商家|店铺|地址|电话|备注|^#)/.test(line)) continue;
      const priceM = line.match(/([0-9]+(?:\.[0-9]+)?)\s*(?:元|块|¥|￥)?\s*$/);
      const qtyM = line.match(/[×xX*]\s*([0-9]+)|([0-9]+)\s*(?:杯|份|个|盒|只|条|根|串|瓶|袋|例)/);
      const qty = qtyM ? parseInt(qtyM[1] || qtyM[2]) : 1;
      const specs = (line.match(SPEC) || []);
      let name = line
        .replace(/[0-9]+(?:\.[0-9]+)?\s*(?:元|块|圆|¥|￥)/g, ' ')
        .replace(/[×xX*]\s*[0-9]+/g, ' ')
        .replace(/[0-9]+\s*(?:杯|份|个|盒|只|条|根|串|瓶|袋|例)/g, ' ')
        .replace(SPEC, ' ')
        .replace(/[¥￥\s]+/g, ' ').replace(/\s+/g, '').trim();
      name = name.replace(/^[#*\-.、，,]+|[.、，,]+$/g, '').slice(0, 24);
      if (name.length < 2) continue;
      items.push({
        name, spec: specs.join('/'), quantity: qty,
        price: priceM ? parseFloat(priceM[1]) : 0,
        category: _guessCategory(name + specs.join(''))
      });
    }
    return {
      merchant: merchant || '', order_time: orderTime || '',
      total_price: total || 0, confidence: 60, items
    };
  }
  function _guessCategory(s) {
    if (/(三明治|汉堡|比萨|披萨|饭团|卷饼|煎饼|面包|吐司|蛋糕|饼干|薯条|饭|面|粉|粥|馒头|包子|饺子|馄饨|玉米|红薯|土豆|米饭|饼)/.test(s)) return 'staple';
    if (/(茶|奶|咖啡|可乐|雪碧|果汁|饮料|汽水|奶茶|豆浆|酸奶|牛奶|矿泉|饮|柠檬水)/.test(s)) return 'drink';
    if (/(青菜|白菜|菜心|西兰花|黄瓜|冬瓜|茄子|豆角|菠菜|生菜|油麦|蔬菜|时蔬|豆腐)/.test(s)) return 'vegetable';
    if (/(鸡|鸭|鱼|虾|牛|猪|羊|肉|排骨|里脊|培根|火腿|香肠|蛋)/.test(s)) return 'meat';
    if (/(汤)/.test(s)) return 'soup';
    if (/(小吃|鸡块|鸡米花|春卷|油条|串|糕)/.test(s)) return 'snack';
    return 'other';
  }

      + '输出：{"view":{"angle":"top","tilt_deg":0,"quality":"good"},"reference":{"type":"grid1cm","known_cm":1.0,"grid_cols":0,"grid_rows":0,"px_length":0},"foods":[{"name":"","confidence":0,"bbox":[0,0,0,0],"shape":"dome","thickness_cm_est":0,"dome_ratio":1.5,"density_g_cm3":0,"calorie_per_100g":0}]}。无法判断时给最合理保守估计，不要给null。';
  }

  async function measureRaw(imageBase64) {
    const dataUri = imageBase64.startsWith('data:') ? imageBase64 : 'data:image/jpeg;base64,' + imageBase64;
    const r = await _chat([
      { role: 'system', content: _measureSys() },
      { role: 'user', content: [
        { type: 'text', text: '请分割每一个食物块、用1cm网格做尺度标定、判定视角与形状厚度，并输出指定JSON。' },
        { type: 'image_url', image_url: { url: dataUri } }
      ] }
    ], true, 800);
    if (!r.success) return { success: false, error: '视觉定量识别暂不可用' };
    const raw = _extractJson(r.text);
    if (!raw || !Array.isArray(raw.foods) || raw.foods.length === 0) {
      return { success: false, error: '未能完成视觉定量分析' };
    }
    return { success: true, raw };
  }

  // 分割结果(raw) + 浏览器端相对深度(depth) → 几何体积/质量/热量
  function analyzeMeasure(raw, imgW, imgH, depth) {
    if (typeof Volume === 'undefined') return { success: false, error: '定量计算内核不可用' };
    let depthMap = null;
    const depthMeta = { used: false, device: null, ms: null };
    if (depth && depth.grid && depth.rows) {
      try {
        depthMap = Volume.fuseDepth(depth.grid, depth.rows, depth.cols, null, raw);
        depthMeta.used = !!(depthMap && Object.keys(depthMap).length);
        depthMeta.device = depth.device || null;
        depthMeta.ms = depth.ms || null;
      } catch (e) { depthMap = null; }
    }
    const result = Volume.analyze(raw, imgW || 1024, imgH || 1024, depthMap);
    result.depth_meta = depthMeta;
    return { success: true, data: result, raw };
  }

  async function measure(imageBase64, imgW, imgH, depth) {
    const rr = await measureRaw(imageBase64);
    if (!rr.success) return rr;
    return analyzeMeasure(rr.raw, imgW, imgH, depth);
  }

      + '(3)优先寻找画面中的平面标定参照：一张外轮廓为25cm×25cm的正方形标定板，板内被等分为最小的1cm×1cm方格；先锁定25cm大正方形外轮廓，再以其内部最小的1cm方格作为像素尺度基准，完成透视视角矫正后逐格统计食物覆盖的最小方格数 grid_cells，即食物俯视真实占地面积，单位cm²；若画面没有标定板，再降级参照常见物体真实尺度(标准餐盘直径约22cm、一次性方形餐盒边长约17.5cm、筷子长约22cm、成年人手指宽约2cm)完成同等标定；'
      + '(4)从图像中直接判断该食物的立体起伏与相对深度（中心隆起程度、边缘厚度、堆叠层数、汤汁液面高度），结合第(3)步的1cm方格像素尺度，换算出该食物的物理平均厚度 thickness_cm，单位cm；厚度须与实际形态相符（薄片0.3-1.5cm、半球堆2-6cm、规则块1-4cm、圆柱2-5cm、碗装3-8cm）；'
      + '(5)判断立体形状 shape(只能取 flat薄片/hemisphere半球堆/block规则块/cylinder圆柱/bowl碗装之一)，给出可食部密度 density，单位g/ml(通常0.5到1.3)，并给出每100g营养基准。'
      + '重要约束：单张图片所有食物总质量通常不超过150克，单块食物质量一般在5-80克之间；蔬菜类密度0.4-0.7、豆制品0.8-1.2、肉类1.0-1.3、米饭0.55-0.8、油炸食品0.3-0.5。'
      + '只输出严格JSON，不输出任何解释、前后缀或markdown。';
  }

  function _appUserPrompt() {
    return '逐种识别图中的食物，最多6种，按面积从大到小排列。对每种食物严格输出：'
      + '{"results":[{"name":"食物名称","probability":0到1,"bbox":{"x":0到1,"y":0到1,"w":0到1,"h":0到1},"ref_object":"填写25cm标定板或实际用到的参照物名称","grid_cells":矫正后覆盖的最小1cm方格数即面积平方厘米,"thickness_cm":视觉模型结合立体起伏与1cm方格尺度估算的平均厚度厘米,"shape":"flat或hemisphere或block或cylinder或bowl","density":克每毫升,"calorie":每100g千卡整数,"protein_g":每100g克数,"fat_g":每100g克数,"carbs_g":每100g克数,"confidence":0到1}]}。'
      + '数值须符合常识：占地面积(cm²)×平均厚度(cm)×形状系数得到合理体积(ml)，体积×密度得到合理质量(g)，所有食物总质量不超过150g。'
      + '若图中没有可识别食物，返回{"results":[]}。';
  }

  function _rebuildAppItem(item) {
    // 几何重建：体积 = 面积 × 厚度 × 形状系数；质量 = 体积 × 密度
    const area = Number(item.grid_cells) || 60;
    const thickness = Number(item.thickness_cm) || Math.max(0.8, Math.sqrt(area) * 0.28);
    const shape = item.shape && SHAPE_FACTOR[item.shape] ? item.shape : 'block';
    const factor = SHAPE_FACTOR[shape];
    const density = Number(item.density) || DEFAULT_DENSITY[shape] || 0.95;
    const volume = area * thickness * factor;
    const mass = volume * density;
    const calorie100 = Number(item.calorie) || 0;
    const kcal = mass / 100 * calorie100;
    return {
      name: item.name || '未知食物',
      probability: Number(item.probability) || Number(item.confidence) || 0.5,
      confidence: Math.round((Number(item.probability) || Number(item.confidence) || 0.5) * 100),
      bbox: item.bbox || { x: 0, y: 0, w: 0.2, h: 0.2 },
      fill_ratio: Number(item.fill_ratio) || 0.7,
      ref_object: item.ref_object || '',
      view_deg: Number(item.view_deg) || 80,
      area_cm2: Math.round(area * 10) / 10,
      thickness_cm: Math.round(thickness * 10) / 10,
      shape,
      shape_factor: factor,
      density: Math.round(density * 100) / 100,
      volume_ml: Math.round(volume * 10) / 10,
      mass_g: Math.round(mass),
      calorie_per_100g: Math.round(calorie100),
      kcal: Math.round(kcal),
      kcal_range: calorie100 > 0 ? [Math.round(kcal * 0.8), Math.round(kcal * 1.2)] : null,
      nutrition: {
        protein_g: Number(item.protein_g) || 0,
        fat_g: Number(item.fat_g) || 0,
        carbs_g: Number(item.carbs_g) || 0,
        sugar_g: Number(item.sugar_g) || 0,
        sodium_mg: Number(item.sodium_mg) || 0
      }
    };
  }

  async function recognizeMeal(imageBase64) {
    const dataUri = imageBase64.startsWith('data:') ? imageBase64 : 'data:image/jpeg;base64,' + imageBase64;
    const r = await _chat([
      { role: 'system', content: _appSystemPrompt() },
      { role: 'user', content: [
        { type: 'text', text: _appUserPrompt() },
        { type: 'image_url', image_url: { url: dataUri } }
      ] }
    ], true, 1500);
    if (!r.success) {
      console.error('[recognizeMeal] API 调用失败:', r.error);
      return { success: false, error: r.error || '识别服务暂不可用' };
    }
    console.log('[recognizeMeal] 原始响应:', r.text.substring(0, 500));
    const raw = _extractJson(r.text);
    if (!raw) {
      console.error('[recognizeMeal] JSON 解析失败');
      return { success: false, error: '识别结果解析失败，请重试' };
    }
    if (!Array.isArray(raw.results)) {
      console.error('[recognizeMeal] results 不是数组, keys:', Object.keys(raw));
      return { success: false, error: '识别结果格式错误，请重试' };
    }
    const items = raw.results.filter(x => x && x.name).slice(0, 5).map(_rebuildAppItem);
    if (items.length === 0) {
      console.error('[recognizeMeal] 没有识别到食物, raw.results:', raw.results);
      return { success: false, error: '未识别到食物，请重新拍摄或手动输入' };
    }
    const total_mass_g = items.reduce((a, b) => a + b.mass_g, 0);
    const total_kcal = items.reduce((a, b) => a + b.kcal, 0);
    const ref_object = items[0].ref_object || '';
    return {
      success: true,
      items,
      total_mass_g: Math.round(total_mass_g),
      total_kcal: Math.round(total_kcal),
      total_kcal_range: [Math.round(total_kcal * 0.8), Math.round(total_kcal * 1.2)],
      ref_object,
      food_count: items.length,
      raw
    };
  }

  return { dish, orderImage, orderText, nutrition, measure, measureRaw, analyzeMeasure, recognizeMeal };
})();

/* ============================================================
   餐食视觉定量计算内核 Volume
   分割多边形 → 参照物标定 → 视角矫正 → 体积 → 质量 → 热量
   坐标体系：归一化 0~999（左上(0,0)，右下(999,999)）
   纯函数、无外部依赖，可离线运行；与后端 VolumeEstimator 同口径
   ============================================================ */
const Volume = (() => {

  // 食物视密度中值表（g/cm³），模型未给密度时按菜名兜底
  const DENSITY_RULES = [
    [/汤|奶茶|奶绿|豆浆|粥|饮|可乐|果汁|咖啡|拿铁|水/, 1.00],
    [/炸鸡|薯条|面包|油条|春卷|烘焙|酥|蓬松|爆米花/, 0.42],
    [/炒青菜|青菜|生菜|沙拉|蔬菜|菜心|西兰花|黄瓜|冬瓜|时蔬|豆角|茄子/, 0.50],
    [/米饭|炒饭|土豆泥|薯泥|红薯|紫薯|饭团/, 0.68],
    [/炒面|面条|米粉|河粉|粉|意面/, 0.80],
    [/水果|瓜|苹果|香蕉|橙/, 0.65],
    [/肉|蛋|豆腐|鱼|虾|鸡|牛|猪|排/, 1.05]
  ];
  const DEFAULT_DENSITY = 0.85;

  function densityOf(name, given) {
    if (Number(given) > 0.1 && Number(given) < 3) return Number(given);
    for (const [re, v] of DENSITY_RULES) if (re.test(name || '')) return v;
    return DEFAULT_DENSITY;
  }

  // 鞋带公式：归一化多边形面积（0~999 坐标系）
  function polygonAreaNorm(poly) {
    if (!Array.isArray(poly) || poly.length < 3) return 0;
    let s = 0;
    for (let i = 0; i < poly.length; i++) {
      const [x1, y1] = poly[i];
      const [x2, y2] = poly[(i + 1) % poly.length];
      s += Number(x1) * Number(y2) - Number(x2) * Number(y1);
    }
    return Math.abs(s) / 2;
  }

  function dist(a, b) { return Math.hypot(a[0] - b[0], a[1] - b[1]); }

  /**
   * 参照物标定：返回每归一化单位对应的物理厘米 {ux,uy,reliable,type}
   * 有网格四角时分别求 x/y 边做非等比校正；否则用 px_length 等比；
   * 都没有则按标准视场经验兜底（区间放宽）。
   */
  function calibrate(reference, imgW, imgH) {
    const r = reference || {};
    const ar = (imgW && imgH) ? imgW / imgH : 1; // 像素宽高比，用于 y 方向校正
    if (r.type === 'grid1cm') {
      const kcm = Number(r.known_cm) > 0 ? Number(r.known_cm) : 1.0;
      // 1) 整网格纸外边框 + 行列格数平均法：单格边长 = 整纸跨度 / 格数（最稳）
      const gp = Array.isArray(r.grid_pts) ? r.grid_pts : [];
      const cols = Number(r.grid_cols) || 0, rows = Number(r.grid_rows) || 0;
      if (gp.length >= 4 && cols >= 1) {
        const gx = Math.max(dist(gp[0], gp[1]), 1e-6); // 整纸上边宽
        const ex = gx / cols;
        let ey = ex;
        if (rows >= 1) { const gy = Math.max(dist(gp[0], gp[3]), 1e-6); ey = gy / rows; }
        return { ux: kcm / ex, uy: kcm / ey, reliable: true, type: r.type };
      }
      // 2) 单个最小格四角
      const pts = Array.isArray(r.px_points) ? r.px_points : [];
      if (pts.length >= 4) {
        const ex = Math.max(dist(pts[0], pts[1]), 1e-6); // 上边宽
        const ey = Math.max(dist(pts[0], pts[3]), 1e-6); // 左边高
        return { ux: kcm / ex, uy: kcm / ey, reliable: true, type: r.type };
      }
    }
    // 3) 已知标定边长度
    if (Number(r.px_length) > 1 && Number(r.known_cm) > 0) {
      const u = r.known_cm / r.px_length;
      return { ux: u, uy: u / ar * ar, reliable: r.scale_reliable !== false, type: r.type || 'ref' };
    }
    // 4) 经验兜底：归一化 999 宽度 ≈ 25cm 视场
    const ux = 25 / 999;
    return { ux, uy: ux, reliable: false, type: 'none' };
  }

  // 斜拍一阶视角补偿：俯视面积被压缩，除以 cos(tilt)
  function tiltCompensate(area, tiltDeg) {
    const t = Math.max(0, Math.min(60, Number(tiltDeg) || 0));
    return area / Math.cos(t * Math.PI / 180);
  }

  /**
   * 形状体积模型（cm³）
   * S=俯视面积cm², h=平均厚度cm
   */
  function shapeVolume(S, h, shape, domeRatio, fillRatio) {
    const phi = fillRatio > 0 && fillRatio <= 1 ? fillRatio : 1;
    const H = Math.max(h, 0.1);
    switch (shape) {
      case 'flat':
      case 'prism':  return S * H * phi;
      case 'liquid': return S * H;
      case 'ellipsoid': return S * H * (2 / 3) * Math.PI / 2 * phi || S * H * 1.05 * phi;
      case 'pile':   return S * H * 0.6 * phi;
      case 'dome':
      default: {
        const dr = Math.max(1, Math.min(2, Number(domeRatio) || 1.5));
        const k = 0.5 + 0.5 / dr; // 隆起越明显，等效高度系数越小（0.5~1）
        return S * H * k * phi;
      }
    }
  }

  // 由 bbox 求椭球三轴（cm）
  function ellipsoidVolume(bbox, scale, h) {
    if (!Array.isArray(bbox) || bbox.length < 4) return null;
    const [, , w, hgt] = bbox;
    const L = Number(w) * scale.ux;
    const Wd = Number(hgt) * scale.uy;
    const H = 2 * Math.max(Number(h) || 0.1, 0.1);
    return (Math.PI / 6) * L * Wd * H;
  }

  /**
   * 单个食物定量
   * food: 主提示词输出的一个实例；depthHeightCm 为 DepthAnything 融合后的平均高度（可选）
   */
  function measureOne(food, scale, view, imgW, imgH, depthHeightCm) {
    const A_norm = polygonAreaNorm(food.polygon);
    let areaCm2 = A_norm * scale.ux * scale.uy;
    areaCm2 = tiltCompensate(areaCm2, view && view.tilt_deg);
    if (!isFinite(areaCm2) || areaCm2 <= 0) { // 多边形异常时用 bbox 兜底
      const b = food.bbox || [];
      areaCm2 = (Number(b[2]) || 0) * (Number(b[3]) || 0) * scale.ux * scale.uy * 0.85;
    }
    const useDepth = Number(depthHeightCm) > 0;
    const h = useDepth ? depthHeightCm : Number(food.thickness_cm_est);
    let volumeCm3;
    if (food.shape === 'ellipsoid') {
      volumeCm3 = ellipsoidVolume(food.bbox, scale, h) || shapeVolume(areaCm2, h, food.shape, food.dome_ratio, food.fill_ratio);
    } else {
      // 无论厚度来自语义估计还是深度场，都使用同一套形状系数，保证两条口径自洽
      volumeCm3 = shapeVolume(areaCm2, h, food.shape, food.dome_ratio, food.fill_ratio);
    }
    const density = densityOf(food.name, food.density_g_cm3);
    const massG = volumeCm3 * density;
    const kcal100 = Number(food.calorie_per_100g) || 0;
    const kcal = massG / 100 * kcal100;
    const band = scale.reliable ? 0.20 : 0.35; // 无参照物放宽区间
    return {
      name: food.name || '未知食物',
      confidence: Math.max(0, Math.min(100, Number(food.confidence) || 50)),
      shape: food.shape || 'dome',
      area_cm2: round2(areaCm2),
      thickness_cm: round2(Math.max(h, 0.1)),
      volume_cm3: round2(volumeCm3),
      density_g_cm3: round2(density),
      mass_g: Math.round(massG),
      kcal_per_100g: Math.round(kcal100),
      kcal: Math.round(kcal),
      kcal_range: kcal100 > 0 ? [Math.round(kcal * (1 - band)), Math.round(kcal * (1 + band))] : null,
      mass_range_g: [Math.round(massG * (1 - band)), Math.round(massG * (1 + band))],
      depth_source: useDepth ? 'depth_model' : 'semantic',
      scale_reliable: scale.reliable,
      polygon: food.polygon || [],
      bbox: food.bbox || []
    };
  }

  /**
   * 整餐定量分析
   * payload: 主提示词返回 {view,reference,foods[]}
   * depthMap: 可选 {foodIndex: avgHeightCm}，由 DepthAnything 融合得到
   */
  function analyze(payload, imgW, imgH, depthMap) {
    const view = payload.view || { angle: 'tilt', tilt_deg: 25, quality: 'ok' };
    const scale = calibrate(payload.reference, imgW, imgH);
    const items = (payload.foods || []).map((f, i) =>
      measureOne(f, scale, view, imgW, imgH, depthMap ? depthMap[i] : null));
    const sum = (k) => items.reduce((a, b) => a + (b[k] || 0), 0);
    const totalMass = Math.round(sum('mass_g'));
    const totalKcal = Math.round(sum('kcal'));
    const lo = items.reduce((a, b) => a + (b.kcal_range ? b.kcal_range[0] : b.kcal), 0);
    const hi = items.reduce((a, b) => a + (b.kcal_range ? b.kcal_range[1] : b.kcal), 0);
    return {
      view, reference_type: scale.type, scale_reliable: scale.reliable,
      scale: { ux: round4(scale.ux), uy: round4(scale.uy) },
      items,
      total_mass_g: totalMass,
      total_kcal: totalKcal,
      total_kcal_range: [Math.round(lo), Math.round(hi)],
      food_count: items.length
    };
  }

  /**
   * DepthAnything 相对深度场 → 每个食物平均物理高度（cm）
   * depthGrid: 与图对齐的归一化深度二维数组(0~1,行×列)；rows/cols 为分辨率
   * 用食物多边形做掩膜，相对高差 × 语义厚度锚定绝对量级
   */
  function fuseDepth(depthGrid, rows, cols, items, payload) {
    const out = {};
    if (!Array.isArray(depthGrid) || !rows || !cols) return out;
    (payload.foods || []).forEach((food, i) => {
      let sumD = 0, maxD = -1, edgeD = 1, n = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const nx = c / (cols - 1) * 999, ny = r / (rows - 1) * 999;
          if (pointInPolygon([nx, ny], food.polygon)) {
            const d = Number(depthGrid[r][c]); if (!isFinite(d)) continue;
            sumD += d; n++; maxD = Math.max(maxD, d); edgeD = Math.min(edgeD, d);
          }
        }
      }
      if (n > 0 && maxD > edgeD) {
        const seed = Number(food.thickness_cm_est) || 2; // 语义厚度锚定绝对量级
        const avgRel = sumD / n;
        // 以语义平均厚度为锚，深度相对形态做 ±25% 温和校正，避免相对深度整体抬升厚度
        const r = (avgRel - edgeD) / (maxD - edgeD);
        const h = Math.max(0.2, seed * (0.75 + 0.25 * r));
        out[i] = round2(h);
      }
    });
    return out;
  }

  function pointInPolygon(p, poly) {
    if (!Array.isArray(poly) || poly.length < 3) return false;
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
      const intersect = ((yi > p[1]) !== (yj > p[1])) &&
        (p[0] < (xj - xi) * (p[1] - yi) / (yj - yi) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  }

  function round2(x) { return Math.round(Number(x) * 100) / 100; }
  function round4(x) { return Math.round(Number(x) * 10000) / 10000; }

  return { analyze, fuseDepth, polygonAreaNorm, calibrate, shapeVolume, densityOf };
})();

/* 总览/今日页 v3.0 - MacroFactor/Sleek风格重设计 */
const PageOverview = (() => {
  function render() {
    const profile = AppState.getProfile();
    const records = AppState.getRecords();
    const allRecords = [...NPV2_DATA.HISTORY_RECORDS, ...records];
    const today = new Date().toISOString().slice(0, 10);
    const todayRecords = allRecords.filter(r => r.created_at?.startsWith(today));

    let totalKcal = 0, totalProtein = 0, totalFat = 0, totalCarbs = 0, totalSugar = 0, sugarFromBev = 0, sugarFromMeal = 0;
    let mealKcal = { breakfast:0, lunch:0, dinner:0, snack:0 };
    let mealCount = { breakfast:0, lunch:0, dinner:0, snack:0 };
    let mealItems = { breakfast:[], lunch:[], dinner:[], snack:[] };

    for (const r of todayRecords) {
      const period = r.meal_period || 'snack';
      for (const item of (r.items || [])) {
        const k = item.calories_kcal;
        const kcal = k?.interval ? (k.interval.min + k.interval.max)/2 : (k?.value || 0);
        const prot = item.protein_g?.interval ? (item.protein_g.interval.min + item.protein_g.interval.max)/2 : (item.protein_g?.value || 0);
        const fat = item.fat_g?.interval ? (item.fat_g.interval.min + item.fat_g.interval.max)/2 : (item.fat_g?.value || 0);
        const carb = item.carbs_g?.interval ? (item.carbs_g.interval.min + item.carbs_g.interval.max)/2 : (item.carbs_g?.value || 0);
        const sug = item.sugar_g?.interval ? (item.sugar_g.interval.min + item.sugar_g.interval.max)/2 : (item.sugar_g?.value || 0);
        totalKcal += kcal; totalProtein += prot; totalFat += fat; totalCarbs += carb; totalSugar += sug;
        mealKcal[period] = (mealKcal[period]||0) + kcal;
        if (r.source_type === 'beverage' || item.category === 'beverage') sugarFromBev += sug;
        else sugarFromMeal += sug;
      }
      mealCount[period] = (mealCount[period]||0) + 1;
      mealItems[period] = [...(mealItems[period]||[]), r.merchant_label || '未命名'];
    }

    const target = profile.daily_target || { kcal:1800, protein_g:70, fat_g:60, carbs_g:220, sugar_g:50 };
    const remaining = Math.max(0, Math.round(target.kcal - totalKcal));
    const kcalPct = Math.min(100, Math.round((totalKcal / target.kcal) * 100));

    // 7天趋势数据
    const trendData = [];
    for (let d = 6; d >= 0; d--) {
      const date = new Date(); date.setDate(date.getDate() - d);
      const ds = date.toISOString().slice(0,10);
      const dayRecords = allRecords.filter(r => r.created_at?.startsWith(ds));
      let dayKcal = 0;
      for (const r of dayRecords) for (const it of (r.items||[])) {

          <p style="margin-bottom:8px;">${totalProtein < target.protein_g * 0.7 ? '🥩 蛋白质摄入偏低，下一餐可考虑增加鸡胸肉、鸡蛋、豆腐等优质蛋白。' : '✅ 蛋白质摄入尚可，注意保持均衡。'}</p>

          <p style="margin-bottom:8px;">${mealCount.breakfast === 0 ? '🍳 今日还未记录早餐，早餐质量影响全天代谢。' : ''}</p>
          <p style="font-size:0.8125rem;color:var(--text-muted);margin-top:8px;">以上为日常营养管理参考，基于估算中值生成，不作诊断、治疗或疗效承诺。</p>

      </div>
      </div>
    `;
  }

  // 大环形进度图
  function renderLargeRing(remaining, consumed, target) {
    const pct = Math.min(100, Math.round((consumed / target) * 100));
    const radius = 80;
    const circumference = 2 * Math.PI * radius;
    const offset = circumference - (pct / 100) * circumference;
    return `<div class="ring-progress-large">
      <svg width="200" height="200" viewBox="0 0 200 200">
        <defs><linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0B7285"/><stop offset="100%" stop-color="#2A9D8F"/></linearGradient></defs>
        <circle class="ring-bg" cx="100" cy="100" r="${radius}"></circle>
        <circle class="ring-fill" cx="100" cy="100" r="${radius}" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"></circle>
      </svg>
      <div class="ring-center">
        <div class="ring-label-top">剩余</div>
        <div class="ring-value">${remaining}<span class="unit"> kcal</span></div>
        <div class="ring-label-bottom">已摄入 ${Math.round(consumed)} / ${target}</div>
      </div>
    </div>`;
  }

  // 宏量营养素迷你环形图
  function renderMacroRings(protein, fat, carbs, target) {
    const items = [
      { label:'蛋白质', value:Math.round(protein), target:target.protein_g, color:'#6366F1', bg:'#EEF0FE' },
      { label:'碳水', value:Math.round(carbs), target:target.carbs_g, color:'#D9A441', bg:'#FBF3E0' },
      { label:'脂肪', value:Math.round(fat), target:target.fat_g, color:'#2A9D8F', bg:'#E6F7F3' }
    ];
    return `<div class="mini-ring-group">
      ${items.map(item => {
        const pct = Math.min(100, Math.round((item.value / item.target) * 100));
        const r = 26;
        const circ = 2 * Math.PI * r;
        const offset = circ - (pct / 100) * circ;
        return `<div class="mini-ring-item">
          <div class="mini-ring">
            <svg width="68" height="68" viewBox="0 0 68 68">
              <circle class="mini-ring-bg" cx="34" cy="34" r="${r}"></circle>
              <circle class="mini-ring-fill" cx="34" cy="34" r="${r}" stroke="${item.color}" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"></circle>
            </svg>
            <div class="mini-ring-center" style="color:${item.color};">${pct}%</div>
          </div>
          <div class="mini-ring-label">${item.label}</div>
          <div class="mini-ring-value">${item.value}g / ${item.target}g</div>
        </div>`;
      }).join('')}
    </div>`;
  }

  // 三餐时间线
  function renderMealTimeline(mealKcal, mealCount, mealItems) {
    const meals = [
      { period:'breakfast', label:'早餐', time:'6:00-10:00', icon:'🌅', color:'#D9A441' },
      { period:'lunch', label:'午餐', time:'11:00-14:00', icon:'☀️', color:'#E76F51' },
      { period:'dinner', label:'晚餐', time:'17:00-21:00', icon:'🌙', color:'#0B7285' },
      { period:'snack', label:'加餐', time:'其他时间', icon:'☕', color:'#2A9D8F' }
    ];
    return `<div style="position:relative;padding-left:8px;">
      ${meals.map((m, i) => {
        const recorded = mealCount[m.period] > 0;
        const kcal = Math.round(mealKcal[m.period] || 0);
        const items = (mealItems[m.period] || []).slice(0, 2).join('、');
        return `<div style="display:flex;align-items:flex-start;gap:14px;padding:12px 0;${i < meals.length-1 ? 'border-bottom:1px solid var(--border-light);' : ''}">
          <div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;width:48px;">
            <div style="width:36px;height:36px;border-radius:50%;background:${recorded ? m.color+'20' : 'var(--bg-alt)'};display:flex;align-items:center;justify-content:center;font-size:1.125rem;">${m.icon}</div>
            <span style="font-size:0.625rem;color:var(--text-muted);font-weight:600;">${m.time}</span>
          </div>
          <div style="flex:1;min-width:0;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
              <span style="font-size:0.9375rem;font-weight:700;">${m.label}</span>
              ${recorded ? `<span style="font-size:1rem;font-weight:800;color:var(--text-primary);font-variant-numeric:tabular-nums;">${kcal} kcal</span>` : `<span style="font-size:0.8125rem;color:var(--text-muted);font-weight:500;">待记录</span>`}
            </div>
            ${recorded ? `<div style="font-size:0.75rem;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${items || `${mealCount[m.period]}条记录`}</div>` : ''}
          </div>
          ${recorded ? `<span class="tag tag-success" style="flex-shrink:0;align-self:center;">✓</span>` : `<a href="#/record/beverage" class="btn btn-primary btn-sm" style="flex-shrink:0;align-self:center;padding:6px 12px;min-height:32px;font-size:0.75rem;">+ 记录</a>`}
        </div>`;
      }).join('')}
    </div>`;
  }

  // 面积图
  function renderAreaChart(data, target) {
    const w = 600, h = 160, padL = 40, padR = 10, padT = 15, padB = 25;
    const maxV = Math.max(...data.map(d => d.kcal), target, 1) * 1.15;
    const xStep = (w - padL - padR) / (data.length - 1 || 1);
    const points = data.map((d, i) => {
      const x = padL + i * xStep;
      const y = h - padB - ((d.kcal - 0) / (maxV - 0)) * (h - padT - padB);
      return { x, y, ...d };
    });
    const pathD = points.map((p, i) => `${i===0?'M':'L'}${p.x},${p.y}`).join(' ');
    const areaD = pathD + ` L${points[points.length-1].x},${h-padB} L${points[0].x},${h-padB} Z`;
    const targetY = h - padB - (target / maxV) * (h - padT - padB);
    return `<div class="area-chart-container">
      <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0B7285" stop-opacity="0.25"/>
          <stop offset="100%" stop-color="#0B7285" stop-opacity="0"/>
        </linearGradient></defs>
        <line x1="${padL}" y1="${targetY}" x2="${w-padR}" y2="${targetY}" stroke="#D9A441" stroke-width="1.5" stroke-dasharray="5,4"/>
        <text x="${w-padR}" y="${targetY-5}" text-anchor="end" font-size="10" fill="#D9A441" font-weight="600">目标 ${target}</text>
        <path d="${areaD}" fill="url(#areaGrad)"/>
        <path d="${pathD}" fill="none" stroke="#0B7285" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        ${points.map((p, i) => `<circle cx="${p.x}" cy="${p.y}" r="${i===points.length-1?5:3.5}" fill="${i===points.length-1?'#0B7285':'#fff'}" stroke="#0B7285" stroke-width="2"/>
          <text x="${p.x}" y="${h-8}" text-anchor="middle" font-size="10" fill="${i===points.length-1?'#0B7285':'#8B9AAB'}" font-weight="${i===points.length-1?'700':'400'}">${p.day}</text>`).join('')}
      </svg>
    </div>`;
  }

  return { render };
})();

/* 订单导入页 - 截图/文字智能解析为结构化订单 */
