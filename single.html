    { title: '一周外卖减脂餐打卡', views: 3420, likes: 234, comments: 67, time: '2天前' }
  ];

  const userPreferences = [
    { label: '高蛋白', value: 35, color: '#0B7285' },
    { label: '低脂', value: 28, color: '#2A9D8F' },
    { label: '低糖', value: 22, color: '#E9C46A' },
    { label: '均衡', value: 15, color: '#F4A261' }
  ];

  function renderLineChart() {
    const w = 560, h = 200, pad = 40;
    const max = Math.max(...dailyOrders.map(d => d.orders)) * 1.15;
    const points = dailyOrders.map((d, i) => {
      const x = pad + (i * (w - pad * 2) / (dailyOrders.length - 1));
      const y = h - pad - (d.orders / max * (h - pad * 2));
      return { x, y, ...d };
    });
    const path = points.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
    const area = path + ` L${points[points.length-1].x},${h-pad} L${points[0].x},${h-pad} Z`;
    let dots = points.map(p => `<circle cx="${p.x}" cy="${p.y}" r="4" fill="#0B7285" stroke="#fff" stroke-width="2"><title>${p.date}: ${p.orders}单</title></circle>`).join('');
    let labels = points.map(p => `<text x="${p.x}" y="${h-15}" text-anchor="middle" font-size="11" fill="#6B7C8D">${p.date}</text>`).join('');
    let yLabels = '';
    for (let i = 0; i <= 4; i++) {
      const val = Math.round(max * i / 4);
      const y = h - pad - (val / max * (h - pad * 2));
      yLabels += `<text x="${pad-8}" y="${y+4}" text-anchor="end" font-size="10" fill="#9AA8B5">${val}</text>`;
      yLabels += `<line x1="${pad}" y1="${y}" x2="${w-pad}" y2="${y}" stroke="#E8EDF2" stroke-width="1"/>`;
    }
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;">
      <defs><linearGradient id="orderGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0B7285" stop-opacity="0.25"/><stop offset="100%" stop-color="#0B7285" stop-opacity="0.02"/>
      </linearGradient></defs>
      ${yLabels}${labels}<path d="${area}" fill="url(#orderGrad)"/>
      <path d="${path}" fill="none" stroke="#0B7285" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}
    </svg>`;
  }

  function renderHBarChart() {
    const max = Math.max(...dishClicks.map(d => d.clicks));
    return dishClicks.map((d, i) => {
      const pct = (d.clicks / max * 100).toFixed(0);
      const color = i === 0 ? '#0B7285' : i === 1 ? '#2A9D8F' : '#5BA89F';
      return `<div style="margin-bottom:14px;">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
          <span style="font-size:13px;color:#2C3E50;font-weight:500;">${d.name}</span>
          <span style="font-size:12px;color:#6B7C8D;">${d.clicks}次 <span style="color:#2A9D8F;">${d.trend}</span></span>
        </div>
        <div style="height:8px;background:#EEF2F6;border-radius:4px;overflow:hidden;">
          <div style="width:${pct}%;height:100%;background:linear-gradient(90deg,${color},${color}dd);border-radius:4px;transition:width .6s;"></div>
        </div>
      </div>`;
    }).join('');
  }

  function renderPieChart() {
    const total = userPreferences.reduce((s, d) => s + d.value, 0);
    const cx = 90, cy = 90, r = 70, ir = 42;
    let startAngle = -Math.PI / 2;
    let paths = '';
    let legend = '';
    userPreferences.forEach(d => {
      const angle = (d.value / total) * Math.PI * 2;
      const endAngle = startAngle + angle;
      const x1 = cx + r * Math.cos(startAngle), y1 = cy + r * Math.sin(startAngle);
      const x2 = cx + r * Math.cos(endAngle), y2 = cy + r * Math.sin(endAngle);
      const xi1 = cx + ir * Math.cos(endAngle), yi1 = cy + ir * Math.sin(endAngle);
      const xi2 = cx + ir * Math.cos(startAngle), yi2 = cy + ir * Math.sin(startAngle);
      const large = angle > Math.PI ? 1 : 0;
      paths += `<path d="M${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} L${xi1},${yi1} A${ir},${ir} 0 ${large} 0 ${xi2},${yi2} Z" fill="${d.color}"/>`;
      legend += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
        <span style="width:12px;height:12px;border-radius:3px;background:${d.color};display:inline-block;"></span>
        <span style="font-size:13px;color:#2C3E50;flex:1;">${d.label}</span>
        <span style="font-size:13px;color:#6B7C8D;font-weight:600;">${d.value}%</span>
      </div>`;
      startAngle = endAngle;
    });
    return `<div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap;">
      <svg viewBox="0 0 180 180" style="width:160px;height:160px;flex-shrink:0;">${paths}
        <text x="${cx}" y="${cy-6}" text-anchor="middle" font-size="11" fill="#9AA8B5">用户偏好</text>
        <text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="18" font-weight="700" fill="#0B7285">${total}%</text>
      </svg>
      <div style="flex:1;min-width:120px;">${legend}</div>
    </div>`;
  }

  function render() {
    return `
    <div class="page-header">
      <h1><i data-lucide="bar-chart-3"></i> 数据分析</h1>
      <p style="color:#6B7C8D;margin-top:4px;">经营数据全景 · 实时更新</p>
    </div>

    <div class="card-grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:20px;">
      <div class="stat-card"><div class="stat-label">今日订单量</div><div class="stat-value">198</div><div class="stat-trend up">+12.5% 环比</div></div>
      <div class="stat-card"><div class="stat-label">菜品识别次数</div><div class="stat-value">1,247</div><div class="stat-trend up">+8.3% 环比</div></div>
      <div class="stat-card"><div class="stat-label">社区帖子浏览</div><div class="stat-value">8,562</div><div class="stat-trend up">+23.1% 环比</div></div>
      <div class="stat-card"><div class="stat-label">用户收藏数</div><div class="stat-value">342</div><div class="stat-trend down">-2.1% 环比</div></div>
    </div>

    <div style="display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:20px;" class="responsive-2col">
      <div class="card">
        <div class="card-header"><h3>近7天订单趋势</h3><span class="tag tag-success">实时</span></div>
        <div class="card-body">${renderLineChart()}</div>
      </div>
      <div class="card">
        <div class="card-header"><h3>用户营养偏好分布</h3></div>
        <div class="card-body">${renderPieChart()}</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;" class="responsive-2col">
      <div class="card">
        <div class="card-header"><h3>菜品点击率排行 Top5</h3></div>
        <div class="card-body">${renderHBarChart()}</div>
      </div>
      <div class="card">
        <div class="card-header"><h3>社区帖子互动排行</h3></div>
        <div class="card-body" style="overflow-x:auto;">
          <table class="data-table">
            <thead><tr><th>标题</th><th>浏览</th><th>点赞</th><th>评论</th><th>时间</th></tr></thead>
            <tbody>${communityPosts.map(p => `<tr>
              <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${p.title}">${p.title}</td>
              <td>${p.views}</td><td>${p.likes}</td><td>${p.comments}</td><td style="color:#9AA8B5;font-size:12px;">${p.time}</td>
            </tr>`).join('')}</tbody>
          </table>
        </div>
      </div>
    </div>`;
  }

  function bindEvents() {}
  return { render, bindEvents };
})();

  function renderIntakeChart(u) {
    const days = u.weekIntake;

    const max = Math.max(...days.map(d => d.cal)) * 1.15;
    const pts = days.map((d, i) => {
      const x = pad + i * (w - pad * 2) / (days.length - 1);
      const y = h - pad - (d.cal / max) * (h - pad * 2);
      return { x, y, ...d };
    });
    const path = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
    const targetY = h - pad - (u.targetCal / max) * (h - pad * 2);
    let dots = pts.map(p => `<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="#0B7285"><title>${p.day}: ${p.cal}kcal</title></circle>`).join('');
    let labels = pts.map(p => `<text x="${p.x}" y="${h-12}" text-anchor="middle" font-size="10" fill="#9AA8B5">${p.day}</text>`).join('');
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;">
      <line x1="${pad}" y1="${targetY}" x2="${w-pad}" y2="${targetY}" stroke="#E9C46A" stroke-width="1.5" stroke-dasharray="5,3"/>

  function renderStats() {

    const max = Math.max(...fansData) * 1.1;
    const pts = fansData.map((v, i) => ({ x: pad + i * (w - pad * 2) / (fansData.length - 1), y: h - pad - (v / max) * (h - pad * 2), v }));

})();

/* 协同社区 v3.0 —— 推荐/关注/挑战双feed · 三角色互动 · 打卡挑战 · 达人榜 · 消息中心 */
const PageCommunity = (() => {
  let posts = [];
  let searchQuery = '';
  let topicFilter = 'all';
  let sortBy = 'latest';
  let feedTab = 'recommend'; // recommend | follow | challenge
  let roleFilter = 'all';    // all | user | merchant | nutritionist
  let likedSet = {};
  let commentLikeSet = {};
  let replyTo = null; // { idx, name }
  let collectedSet = {};
  let collected = { meals: [], knowledge: [] };
  let streak = 3;

  function me() {
    const u = (typeof Auth !== 'undefined') ? Auth.current() : null;
    if (u) return { name: u.nickname, role: u.role, id: u.id };
    return { name: '我', role: AppState.getRole(), id: 'me' };
  }

  function init() {
    if (posts.length === 0) {
      const saved = localStorage.getItem('npv2_community_posts');
      posts = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(NPV2_DATA.COMMUNITY_POSTS));
      posts.forEach(p => { if (!p.author_id) p.author_id = 'a_' + (p.author_name || 'x'); });
    }
    try { likedSet = JSON.parse(localStorage.getItem('npv2_liked')) || {}; } catch { likedSet = {}; }
    try { commentLikeSet = JSON.parse(localStorage.getItem('npv2_comment_liked')) || {}; } catch { commentLikeSet = {}; }
    try { collectedSet = JSON.parse(localStorage.getItem('npv2_collected_set')) || {}; } catch { collectedSet = {}; }
    const c = localStorage.getItem('npv2_collected');
    if (c) collected = JSON.parse(c);
    streak = parseInt(localStorage.getItem('npv2_streak')) || 3;
    // 依据本地点赞集合恢复显示数
    posts.forEach(p => {
      if (likedSet[p.id] && !p._adj) { p.likes = (p.likes || 0) + 1; p._adj = true; }
      (p.comments || []).forEach((c, ci) => { if (commentLikeSet[p.id + '_' + ci] && !c._ladj) { c.likes = (c.likes || 0) + 1; c._ladj = true; } });
    });
  }

  function save() {
    posts.forEach(p => { delete p._adj; (p.comments || []).forEach(c => delete c._ladj); });
    localStorage.setItem('npv2_community_posts', JSON.stringify(posts));
    posts.forEach(p => {
      if (likedSet[p.id]) p._adj = true;
      (p.comments || []).forEach((c, ci) => { if (commentLikeSet[p.id + '_' + ci]) c._ladj = true; });
    });
    localStorage.setItem('npv2_liked', JSON.stringify(likedSet));
    localStorage.setItem('npv2_comment_liked', JSON.stringify(commentLikeSet));
    localStorage.setItem('npv2_collected_set', JSON.stringify(collectedSet));
    localStorage.setItem('npv2_collected', JSON.stringify(collected));
    localStorage.setItem('npv2_streak', String(streak));
  }

  function followingIds() {
    const u = (typeof Auth !== 'undefined') ? Auth.current() : null;
    return (u && u.following) || [];
  }

  function leaderboard() {
    const map = {};
    posts.forEach(p => {
      const k = p.author_id;
      if (!map[k]) map[k] = { id: k, name: p.author_name, role: p.author_role, score: 0, posts: 0, qual: '' };
      map[k].score += (p.likes || 0) + (p.comments ? p.comments.length * 3 : 0) + (p.collected || 0);
      map[k].posts += 1;
      (p.comments || []).forEach(c => { if (c.role === 'nutritionist' && c.author === p.author_name) map[k].qual = c.qualification || ''; });
    });
    return Object.values(map).sort((a, b) => b.score - a.score).slice(0, 5);
  }

  function render() {
    init();
    let filtered = [...posts];
    // feed tab
    if (feedTab === 'follow') {
      const ids = followingIds();
      filtered = filtered.filter(p => ids.includes(p.author_id));
    } else if (feedTab === 'challenge') {
      filtered = filtered.filter(p => (p.topic_tags || []).some(t => /打卡|挑战|控糖|减脂/.test(t)));
    }
    if (roleFilter !== 'all') filtered = filtered.filter(p => p.author_role === roleFilter);
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      filtered = filtered.filter(p => p.title.toLowerCase().includes(q) || p.body.toLowerCase().includes(q) || (p.record_snapshot?.name || '').toLowerCase().includes(q));
    }
    if (topicFilter !== 'all') filtered = filtered.filter(p => (p.topic_tags || []).includes(topicFilter));
    if (sortBy === 'latest') filtered.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    else if (sortBy === 'hot') filtered.sort((a, b) => (b.likes + b.collected) - (a.likes + a.collected));
    else if (sortBy === 'nutrition') filtered = filtered.filter(p => p.record_snapshot).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

    const allTopics = NPV2_DATA.HOT_TOPICS;
    const board = leaderboard();

    return `
      <div class="page-content">
      <div class="page-header">
        <h1 class="page-title">协同社区</h1>
        <p class="page-subtitle">记录即分享 · 用户 / 商家 / 营养师同帖协同 · 营养信息可追溯</p>
      </div>

      ${renderChallenge()}
      ${renderAskBanner()}

      <!-- feed 切换 -->
      <div class="feed-tabs">
        <button class="feed-tab ${feedTab==='recommend'?'active':''}" onclick="PageCommunity.setTab('recommend')">推荐</button>

            ${board.map((a, i) => `
              <div class="rank-row">
                <span class="rank-no ${i===0?'top1':i===1?'top2':i===2?'top3':''}">${i+1}</span>
                <div style="flex:1;min-width:0;">
                  <div style="font-size:.8125rem;font-weight:700;">${a.name} <span class="post-role-badge">${a.role==='user'?'用户':a.role==='merchant'?'商家':'营养师'}</span></div>
                  <div style="font-size:.6875rem;color:var(--text-muted);">${a.posts}篇 · 热度${a.score}</div>
                </div>
                <button class="btn ${followingIds().includes(a.id)?'btn-ghost':'btn-secondary'} btn-sm" onclick="PageCommunity.followAuthor('${a.id}',this)">${followingIds().includes(a.id)?'已关注':'+ 关注'}</button>
              </div>`).join('')}
          </div>

          <div class="card" style="padding:16px;">
            <div class="card-title" style="font-size:.9375rem;margin-bottom:10px;"><i data-lucide="medal"></i>我的成就</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;">
              <span class="medal">🔥 连续${streak}天</span>
              <span class="medal">📷 首次记录</span>
              <span class="medal">🥗 控糖达人</span>
              <span class="medal">🤝 协同之星</span>
            </div>
          </div>

          <div class="card" style="padding:16px;">
            <div class="card-title" style="font-size:.9375rem;margin-bottom:10px;"><i data-lucide="flame"></i>热门话题</div>
            ${allTopics.slice(0,5).map((t,i) => `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer;" onclick="PageCommunity.filterTopic('${t}')">
              <span style="width:20px;height:20px;border-radius:50%;background:${i<3?'var(--accent-coral)':'var(--bg-alt)'};color:${i<3?'#fff':'var(--text-muted)'};display:flex;align-items:center;justify-content:center;font-size:.6875rem;font-weight:700;flex-shrink:0;">${i+1}</span>
              <span style="font-size:.8125rem;color:var(--text-secondary);">#${t}</span>
            </div>`).join('')}
          </div>

          <div class="card" style="padding:16px;background:#FFF9F0;border-color:#F0D9A8;">
            <div class="card-title" style="font-size:.9375rem;margin-bottom:8px;color:#9a6b00;"><i data-lucide="shield-check"></i>社区公约</div>
            <ul style="font-size:.75rem;color:#9a6b00;line-height:1.8;list-style:disc;padding-left:16px;">
              <li>友善交流，营养结论标注依据与不确定性</li>
              <li>不做疗效承诺、不夸大测量精度</li>
              <li>商家与营养师须认证后以对应身份发言</li>
            </ul>
          </div>

          <div class="card" style="padding:16px;">
            <div class="card-title" style="font-size:.9375rem;margin-bottom:10px;"><i data-lucide="bookmark"></i>我的收藏</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button class="config-option" onclick="PageCommunity.showCollected('meals')">🍽️ 餐单 (${collected.meals.length})</button>
              <button class="config-option" onclick="PageCommunity.showCollected('knowledge')">📚 知识 (${collected.knowledge.length})</button>

      <style>
        @media (max-width:900px){.community-layout{grid-template-columns:1fr !important;}.community-sidebar{display:none !important;}}
        .topic-scroll::-webkit-scrollbar{display:none;}
      </style>
      </div>
    `;
  }

  function renderChallenge() {
    const goal = 7;
    const pct = Math.min(100, Math.round(streak / goal * 100));
    return `
      <div class="challenge-card">
        <div class="challenge-head">
          <div class="challenge-badge"><i data-lucide="flame" style="width:20px;height:20px;"></i></div>
          <div style="flex:1;">
            <div style="font-weight:800;font-size:.9375rem;color:#7a5200;">本周挑战 · 7 天控糖打卡</div>
            <div style="font-size:.75rem;color:#9a6b00;">记录每日三餐含糖量，连续打卡赢限定勋章</div>
          </div>
          <span class="streak-flame"><i data-lucide="flame" style="width:15px;height:15px;"></i>${streak} 天</span>
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:.72rem;color:#9a6b00;">已完成 ${streak}/${goal} 天</span>
          <button class="btn btn-primary btn-sm" onclick="PageCommunity.checkin()"><i data-lucide="check"></i>今日打卡</button>
        </div>
      </div>`;
  }

  function renderAskBanner() {
    return `
      <div class="ask-nutri-banner">
        <div style="width:40px;height:40px;border-radius:50%;background:#6366F1;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i data-lucide="stethoscope"></i></div>
        <div style="flex:1;">
          <div style="font-weight:700;font-size:.875rem;color:#3730A3;">拿不准这一餐怎么吃？</div>
          <div style="font-size:.75rem;color:#5b5bb5;">向认证营养师提问，通常 2 小时内收到专业回复</div>
        </div>
        <button class="btn btn-primary btn-sm" onclick="PageCommunity.askNutritionist()">我要提问</button>
      </div>`;
  }

  // ---------- 交互 ----------
  function search(q) { searchQuery = q; App.rerender(); }
  function filterTopic(t) { topicFilter = t; App.rerender(); }
  function setSort(s) { sortBy = s; App.rerender(); }
  function setTab(t) { feedTab = t; App.rerender(); }
  function setRoleFilter(r) { roleFilter = r; App.rerender(); }

  function like(idx) {
    const p = posts[idx]; if (!p) return;
    if (likedSet[p.id]) { p.likes = Math.max(0, (p.likes || 1) - 1); delete likedSet[p.id]; }
    else { p.likes = (p.likes || 0) + 1; likedSet[p.id] = true; }
    save(); App.rerender();
  }

  function toggleCollect(idx) {
    const p = posts[idx]; if (!p) return;
    if (collectedSet[p.id]) { p.collected = Math.max(0, (p.collected || 1) - 1); delete collectedSet[p.id]; UI.toast('已取消收藏', 'info'); }
    else {
      p.collected = (p.collected || 0) + 1; collectedSet[p.id] = true;
      if (p.record_snapshot) collected.meals.push(p.id); else collected.knowledge.push(p.id);
      UI.toast('已收藏', 'success');
    }
    save(); App.rerender();
  }

  function toggleComments(idx) {
    const el = document.getElementById(`comments_${idx}`);
    if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
  }

  function addComment(idx) {
    const input = document.getElementById(`commentInput_${idx}`);
    const text = input?.value?.trim();
    if (!text) { UI.toast('请输入评论内容', 'warning'); return; }
    const m = me();
    posts[idx].comments = posts[idx].comments || [];
    const c = { author: m.name, role: m.role, text, time: '刚刚', likes: 0 };
    if (replyTo && replyTo.idx === idx && replyTo.name) c.reply_to = replyTo.name;
    posts[idx].comments.push(c);
    replyTo = null;
    save(); App.rerender(); UI.toast('评论已发布', 'success');
  }

  function likeComment(idx, ci) {
    const p = posts[idx]; if (!p || !p.comments || !p.comments[ci]) return;
    const key = p.id + '_' + ci, c = p.comments[ci];
    if (commentLikeSet[key]) { c.likes = Math.max(0, (c.likes || 0) - 1); delete commentLikeSet[key]; }
    else { c.likes = (c.likes || 0) + 1; commentLikeSet[key] = true; }
    save(); App.rerender();
  }

  function startReply(idx, ci, name) {
    replyTo = { idx, name };
    const input = document.getElementById(`commentInput_${idx}`);
    if (input) { input.placeholder = '回复 @' + name + '：'; input.focus(); }
    const hint = document.getElementById(`replyHint_${idx}`);
    if (hint) { hint.style.display = 'block'; hint.textContent = '正在回复 @' + name + '，发送后自动取消'; }
  }

  // 作者个人主页（资料卡 + 数据统计 + TA的内容）
  function profileOf(authorId) {
    const mine = posts.filter(p => p.author_id === authorId);
    const role = mine[0]?.author_role || 'user';
    const name = mine[0]?.author_name || '营养用户';
    const totalLikes = mine.reduce((a, p) => a + (p.likes || 0), 0);
    const totalCollect = mine.reduce((a, p) => a + (p.collected || 0), 0);
    const following = followingIds().includes(authorId);
    const roleName = role === 'user' ? '用户' : role === 'merchant' ? '认证商家' : '认证营养师';
    const roleColor = role === 'merchant' ? '#D9A441' : role === 'nutritionist' ? '#6366F1' : '#2A9D8F';
    const bio = role === 'merchant' ? '专注健康轻食，持续更新菜品营养数据'
      : role === 'nutritionist' ? '注册营养师，提供循证营养建议与纠错'
      : '认真记录每一餐，科学管理每日摄入';
    const fans = role === 'nutritionist' ? 1280 : role === 'merchant' ? 860 : 236;
    return { mine, role, name, totalLikes, totalCollect, following, roleName, roleColor, bio, fans };
  }

  function openProfile(authorId) {
    const pf = profileOf(authorId);
    UI.modal(`个人主页 · ${pf.name}`, `
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px;">
        <div style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,${pf.roleColor},${pf.roleColor}cc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:800;flex-shrink:0;">${pf.name[0] || 'U'}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:1.05rem;font-weight:800;">${pf.name} <span class="post-role-badge" style="background:${pf.roleColor}18;color:${pf.roleColor};">${pf.roleName}</span></div>
          <div style="font-size:.78rem;color:var(--text-muted);margin-top:3px;">${pf.bio}</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:14px;">
        <button class="btn ${pf.following ? 'btn-ghost' : 'btn-primary'} btn-sm" id="profileFollowBtn" onclick="PageCommunity.followFromProfile('${authorId}')">${pf.following ? '已关注' : '+ 关注'}</button>
        <button class="btn btn-secondary btn-sm" onclick="PageCommunity.messageTo('${pf.name.replace(/'/g, '')}')">私信</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin-bottom:6px;">
        <div style="background:var(--bg-alt);padding:10px 4px;border-radius:10px;"><div style="font-size:1.1rem;font-weight:800;">${pf.mine.length}</div><div style="font-size:.7rem;color:var(--text-muted);">内容</div></div>
        <div style="background:var(--bg-alt);padding:10px 4px;border-radius:10px;"><div style="font-size:1.1rem;font-weight:800;">${pf.totalLikes}</div><div style="font-size:.7rem;color:var(--text-muted);">获赞</div></div>
        <div style="background:var(--bg-alt);padding:10px 4px;border-radius:10px;"><div style="font-size:1.1rem;font-weight:800;">${pf.fans}</div><div style="font-size:.7rem;color:var(--text-muted);">粉丝</div></div>
        <div style="background:var(--bg-alt);padding:10px 4px;border-radius:10px;"><div style="font-size:1.1rem;font-weight:800;">${pf.totalCollect}</div><div style="font-size:.7rem;color:var(--text-muted);">收藏</div></div>
      </div>
      <div class="divider"></div>
      <h4 style="font-size:.9rem;margin:10px 0;">TA 的内容（${pf.mine.length}）</h4>
      ${pf.mine.length ? pf.mine.map(mp => { const gi = posts.indexOf(mp); return `
        <div style="padding:10px;border:1px solid var(--border-light);border-radius:10px;margin-bottom:8px;cursor:pointer;" onclick="document.querySelector('.modal-overlay')?.remove();setTimeout(()=>PageCommunity.viewPost(${gi}),80);">
          <div style="font-size:.85rem;font-weight:700;">${mp.title}</div>
          <div style="font-size:.75rem;color:var(--text-muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${mp.body}</div>
          <div style="font-size:.7rem;color:var(--text-muted);margin-top:4px;">👍 ${mp.likes || 0} · 💬 ${(mp.comments || []).length} · ⭐ ${mp.collected || 0}</div>
        </div>`; }).join('') : '<p style="font-size:.8rem;color:var(--text-muted);">暂无公开内容</p>'}
    `, `<button class="btn btn-secondary" onclick="document.querySelector('.modal-overlay').remove()">关闭</button>`);
  }

  function followFromProfile(authorId) {
    if (typeof Auth !== 'undefined' && !Auth.current()) { UI.toast('请先登录后再关注', 'warning'); location.hash = '#/auth'; return; }
    const now = Auth.toggleFollow(authorId);
    const btn = document.getElementById('profileFollowBtn');
    if (btn) { btn.textContent = now ? '已关注' : '+ 关注'; btn.className = `btn ${now ? 'btn-ghost' : 'btn-primary'} btn-sm`; }
    UI.toast(now ? '已关注' : '已取消关注', 'info');
  }
  function messageTo(name) { UI.toast('已向 ' + name + ' 发起私信', 'info'); }

  function followAuthor(authorId, btn) {
    if (typeof Auth === 'undefined' || !Auth.current()) { UI.toast('请先登录后再关注', 'warning'); location.hash = '#/auth'; return; }
    const now = Auth.toggleFollow(authorId);
    if (btn) { btn.textContent = now ? '已关注' : '+ 关注'; btn.className = `btn ${now ? 'btn-ghost' : 'btn-secondary'} btn-sm`; }
    UI.toast(now ? '已关注' : '已取消关注', 'info');
  }

  function forward(idx) {
    const p = posts[idx]; if (!p) return;
    const txt = `${p.title} | 来自营养智链协同社区`;
    if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(() => {});
    UI.toast('内容链接已复制，可分享给好友', 'success');
  }

  function checkin() {
    if (streak >= 7) { UI.toast('本周挑战已完成，太棒了！', 'success'); return; }
    streak += 1; localStorage.setItem('npv2_streak', String(streak));
    UI.toast(streak >= 7 ? '打卡成功，获得「7天控糖」勋章！' : `打卡成功，已连续 ${streak} 天`, 'success');
    App.rerender();
  }

  function askNutritionist() { newPost('向营养师提问'); }

  function report(idx) {
    UI.modal('举报内容', `
      <p style="margin-bottom:12px;font-size:.875rem;">请选择举报原因：</p>
      <div class="form-group"><select class="form-select" id="reportReason">
        <option value="medical">疗效承诺 / 医疗化表述</option>
        <option value="precision">夸大测量精度 / 误导信息</option>
        <option value="brand">未授权品牌宣传</option>
        <option value="false">不实信息</option>
        <option value="abuse">不友善 / 人身攻击</option>
        <option value="other">其他</option>
      </select></div>
      <div class="form-group"><label class="form-label">补充说明（可选）</label><textarea class="form-textarea" id="reportDetail"></textarea></div>
    `, `<button class="btn btn-secondary" onclick="document.querySelector('.modal-overlay').remove()">取消</button><button class="btn btn-danger" onclick="PageCommunity.confirmReport(${idx})">提交</button>`);
  }
  function confirmReport(idx) {
    const reason = document.getElementById('reportReason')?.value;
    posts[idx].reports = posts[idx].reports || [];
    posts[idx].reports.push({ reason, count: 1, time: new Date().toISOString() });
    posts[idx].moderation_status = '被举报';
    save(); document.querySelector('.modal-overlay')?.remove();
    UI.toast('举报已提交，平台将尽快审核', 'success'); App.rerender();
  }

  function viewPost(idx) {
    const p = posts[idx]; if (!p) return;
    const collabEvents = [
      { actor: 'user', actor_name: p.author_name, title: '分享内容', desc: p.title, time: p.created_at?.slice(0, 16).replace('T', ' ') },
      ...(p.comments || []).map(c => ({ actor: c.role, actor_name: c.author, title: `${c.role === 'merchant' ? '商家回复' : c.role === 'nutritionist' ? '营养师回复' : '用户评论'}`, desc: c.text, time: c.time }))
    ];
    const following = followingIds().includes(p.author_id);
    UI.modal(`内容详情 · ${p.title}`, `
      <div style="margin-bottom:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
        <span class="tag ${p.author_role==='merchant'?'tag-demo-data':p.author_role==='nutritionist'?'tag-pending':'tag-demo'}">${p.author_role==='user'?'用户':p.author_role==='merchant'?'商家':'营养师'}</span>
        <span class="tag tag-${p.moderation_status==='已发布'?'success':p.moderation_status==='待审核'?'pending':'error'}">${p.moderation_status}</span>
        <button class="btn btn-secondary btn-sm" style="margin-left:auto;" onclick="PageCommunity.openProfile('${p.author_id}')">TA的主页</button>
        <button class="btn ${following?'btn-ghost':'btn-secondary'} btn-sm" onclick="PageCommunity.followAuthor('${p.author_id}',this)">${following?'已关注':'+ 关注作者'}</button>
        <button class="btn btn-secondary btn-sm" onclick="PageCommunity.forward(${idx})">转发</button>
      </div>
      <p style="font-size:.9375rem;color:var(--text-secondary);margin-bottom:14px;line-height:1.7;">${p.body}</p>
      ${p.record_snapshot ? `
        <div style="background:var(--bg-alt);padding:14px;border-radius:10px;margin-bottom:14px;">
          <div style="font-size:.75rem;font-weight:700;color:var(--text-secondary);margin-bottom:6px;">📋 营养快照</div>
          <div style="font-size:.875rem;font-weight:600;margin-bottom:6px;">${p.record_snapshot.name}</div>
          <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:.8125rem;color:var(--text-secondary);">
            <span>🔥 ${p.record_snapshot.kcal_interval?p.record_snapshot.kcal_interval.min+'-'+p.record_snapshot.kcal_interval.max+'kcal':'未知'}</span>
            <span>🥩 蛋白${p.record_snapshot.protein_g?p.record_snapshot.protein_g.min+'-'+p.record_snapshot.protein_g.max+'g':'未知'}</span>
            <span>🍬 糖${p.record_snapshot.sugar_g?p.record_snapshot.sugar_g.min+'-'+p.record_snapshot.sugar_g.max+'g':'未知'}</span>
          </div>
        </div>` : ''}
      <div class="divider"></div>
      <h4 style="font-size:.9375rem;margin-bottom:10px;">协同时间线</h4>
      ${UI.collabTimeline(collabEvents)}
      <div class="divider"></div>

    const title = document.getElementById('newPostTitle')?.value?.trim();

/* 登录/注册页 —— Supabase 认证 */
const PageAuth = (() => {
  let state = {
    mode: 'login', // login | signup
    email: '',
    password: '',
    nickname: '',
    loading: false,
    error: null,
    success: null
  };

  function render() {

      <div class="page-content" style="max-width:420px;margin:0 auto;padding-top:40px;">

          <div style="width:72px;height:72px;border-radius:20px;background:var(--primary-gradient);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:var(--shadow-primary);">

          <p style="font-size:0.875rem;color:var(--text-secondary);">外卖个性化营养管理平台</p>
        </div>

        ${!isConfigured ? `
          <div class="card" style="border-left:4px solid var(--color-warning);">
            <div class="card-body">
              <div style="display:flex;align-items:flex-start;gap:10px;">
                <i data-lucide="alert-triangle" style="width:20px;height:20px;color:var(--color-warning);flex-shrink:0;margin-top:2px;"></i>
                <div>
                  <h3 style="font-size:0.9375rem;font-weight:700;margin-bottom:6px;">Supabase 未配置</h3>
                  <p style="font-size:0.8125rem;color:var(--text-secondary);line-height:1.6;margin-bottom:12px;">
                    当前使用本地模式，数据保存在浏览器中。如需多设备同步和用户账号，请配置 Supabase。
                  </p>
                  <a href="#/" class="btn btn-primary btn-sm"><i data-lucide="arrow-left"></i>返回首页（本地模式）</a>
                </div>
              </div>
            </div>
          </div>
        ` : `
          <!-- 切换标签 -->
          <div style="display:flex;background:var(--color-bg);border-radius:12px;padding:4px;margin-bottom:20px;">
            <button onclick="PageAuth.setMode('login')" style="flex:1;padding:10px;border-radius:8px;border:none;background:${state.mode==='login'?'var(--primary-gradient)':'transparent'};color:${state.mode==='login'?'#fff':'var(--text-secondary)'};font-weight:600;font-size:0.875rem;cursor:pointer;transition:all 0.2s;">
              登录
            </button>
            <button onclick="PageAuth.setMode('signup')" style="flex:1;padding:10px;border-radius:8px;border:none;background:${state.mode==='signup'?'var(--primary-gradient)':'transparent'};color:${state.mode==='signup'?'#fff':'var(--text-secondary)'};font-weight:600;font-size:0.875rem;cursor:pointer;transition:all 0.2s;">
              注册
            </button>
          </div>

          <!-- 错误提示 -->
          ${state.error ? `
            <div style="background:#FEF2F2;border:1px solid #FECACA;color:#DC2626;padding:12px 14px;border-radius:10px;font-size:0.8125rem;margin-bottom:16px;display:flex;align-items:flex-start;gap:8px;">
              <i data-lucide="alert-circle" style="width:16px;height:16px;flex-shrink:0;margin-top:1px;"></i>
              <span>${state.error}</span>
            </div>
          ` : ''}

          <!-- 成功提示 -->
          ${state.success ? `
            <div style="background:#F0FDF4;border:1px solid #BBF7D0;color:#16A34A;padding:12px 14px;border-radius:10px;font-size:0.8125rem;margin-bottom:16px;display:flex;align-items:flex-start;gap:8px;">
              <i data-lucide="check-circle" style="width:16px;height:16px;flex-shrink:0;margin-top:1px;"></i>
              <span>${state.success}</span>
            </div>
          ` : ''}

          <!-- 表单 -->
          <div class="card">
            <div class="card-body" style="padding:24px;">
              ${state.mode === 'signup' ? `
                <div class="form-group" style="margin-bottom:16px;">
                  <label class="form-label">昵称</label>
                  <input type="text" class="form-input" id="authNickname" placeholder="请输入昵称" value="${state.nickname}" style="width:100%;">
                </div>
              ` : ''}
              
              <div class="form-group" style="margin-bottom:16px;">
                <label class="form-label">邮箱</label>
                <input type="email" class="form-input" id="authEmail" placeholder="请输入邮箱" value="${state.email}" style="width:100%;">
              </div>
              
              <div class="form-group" style="margin-bottom:20px;">
                <label class="form-label">密码</label>
                <input type="password" class="form-input" id="authPassword" placeholder="请输入密码（至少6位）" style="width:100%;">
              </div>

              <button class="btn btn-primary btn-block" onclick="PageAuth.submit()" ${state.loading?'disabled':''} style="margin-bottom:16px;">
                ${state.loading ? '<span class="loading-spinner" style="width:18px;height:18px;border-width:2px;margin:0;"></span>处理中...' : (state.mode === 'login' ? '<i data-lucide="log-in"></i>登录' : '<i data-lucide="user-plus"></i>注册')}
              </button>

              <!-- 分割线 -->
              <div style="display:flex;align-items:center;gap:12px;margin:20px 0;">
                <div style="flex:1;height:1px;background:var(--color-border-light);"></div>
                <span style="font-size:0.75rem;color:var(--text-muted);">或</span>
                <div style="flex:1;height:1px;background:var(--color-border-light);"></div>
              </div>

              <!-- 第三方登录 -->
              <div style="display:flex;gap:10px;">
                <button class="btn btn-secondary btn-block" onclick="PageAuth.oauth('google')" style="flex:1;">
                  <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right:6px;"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                  Google
                </button>
                <button class="btn btn-secondary btn-block" onclick="PageAuth.oauth('github')" style="flex:1;">
                  <i data-lucide="github" style="width:18px;height:18px;margin-right:6px;"></i>
                  GitHub
                </button>
              </div>

              <p style="font-size:0.75rem;color:var(--text-muted);text-align:center;margin-top:20px;line-height:1.6;">
                登录即表示同意<a href="#" style="color:var(--color-primary);">服务条款</a>和<a href="#" style="color:var(--color-primary);">隐私政策</a>
              </p>
            </div>
          </div>

          <!-- 本地模式入口 -->
          <div style="text-align:center;margin-top:20px;">
            <a href="#/" onclick="PageAuth.useLocalMode()" style="font-size:0.8125rem;color:var(--text-secondary);text-decoration:underline;">
              暂不登录，使用本地模式
            </a>
          </div>
        `}
      </div>
    `;
  }

  function setMode(mode) {
    state.mode = mode;
    state.error = null;
    state.success = null;
    App.rerender();
  }

  async function submit() {
    const email = document.getElementById('authEmail')?.value?.trim();
    const password = document.getElementById('authPassword')?.value;
    const nickname = document.getElementById('authNickname')?.value?.trim();

    if (!email) { state.error = '请输入邮箱'; App.rerender(); return; }
    if (!password || password.length < 6) { state.error = '密码至少6位'; App.rerender(); return; }

    state.loading = true;
    state.error = null;
    state.success = null;
    App.rerender();

    try {
      if (state.mode === 'login') {
        const result = await SupabaseDB.signIn(email, password);
        if (result.success) {
          state.success = '登录成功，正在跳转...';
          App.rerender();
          setTimeout(() => App.navigate('#/'), 1000);
        } else {
          state.error = result.error || '登录失败';
        }
      } else {
        const result = await SupabaseDB.signUp(email, password, nickname);
        if (result.success) {
          state.success = '注册成功！请检查邮箱验证后登录';
          state.mode = 'login';
        } else {
          state.error = result.error || '注册失败';
        }
      }
    } catch (e) {
      state.error = e.message || '操作失败';
    }

    state.loading = false;
    App.rerender();
  }

  async function oauth(provider) {
    if (typeof SupabaseDB === 'undefined' || !SupabaseDB.isConfigured()) {
      state.error = 'Supabase 未配置';
      App.rerender();
      return;
    }
    try {
      // 第三方登录需要在 Supabase Dashboard 中启用对应 provider
      state.error = `请先在 Supabase Dashboard → Authentication → Providers 中启用 ${provider} 登录`;
      App.rerender();
    } catch (e) {
      state.error = e.message;
      App.rerender();
    }
  }

  function useLocalMode() {
    // 本地模式不需要特殊处理，直接返回首页
    return true;
  }

  return { render, setMode, submit, oauth, useLocalMode };
})();

/* ============================================================
   主应用：路由、状态管理、导航、localStorage持久化
   纯静态架构，无后端依赖
   ============================================================ */

const AppState = (() => {
  const KEYS = { profile: 'npv2_profile', records: 'npv2_records', role: 'npv2_role' };

  function updateUserChip() {
    const box = document.getElementById('userChip');
    if (!box) return;
    const u = (typeof Auth !== 'undefined') ? Auth.current() : null;
    if (!u) {
      box.innerHTML = '<a href="#/auth" class="user-chip user-chip-login"><i data-lucide="log-in"></i><span>登录 / 注册</span></a>';
    } else {
      const meta = Auth.ROLE_META[u.role] || Auth.ROLE_META.user;
      const initial = (u.nickname || 'U').slice(0, 1);
      box.innerHTML =
        '<div class="user-chip-wrap">' +
        '<button class="user-chip" onclick="App.toggleChipMenu()">' +
        '<span class="user-avatar" style="background:' + meta.color + '">' + initial + '</span>' +
        '<span class="user-meta"><span class="user-name">' + u.nickname + '</span>' +
        '<span class="user-role-tag" style="color:' + meta.color + '">' + meta.name + '</span></span>' +
        '<i data-lucide="chevron-down" style="width:14px;height:14px;"></i></button>' +
        '<div class="user-menu" id="userMenu" style="display:none;">' +
        '<a href="' + Auth.roleHome(u.role) + '"><i data-lucide="layout-dashboard"></i>我的工作台</a>' +
        '<a href="#/community"><i data-lucide="message-circle"></i>协同社区</a>' +
        '<a href="javascript:void(0)" onclick="App.doLogout()"><i data-lucide="log-out"></i>退出登录</a>' +
        '</div></div>';
    }
    if (window.lucide) lucide.createIcons({ root: box });
  }

  function toggleChipMenu() {
    const m = document.getElementById('userMenu');
    if (m) m.style.display = m.style.display === 'none' ? 'block' : 'none';
  }

  function doLogout() {
    Auth.logout();
    UI.toast('已退出登录', 'info');
    render();
  }

  function init() {
    if (!localStorage.getItem(KEYS.profile)) {
      localStorage.setItem(KEYS.profile, JSON.stringify(NPV2_DATA.DEFAULT_PROFILE));
    }
    if (!localStorage.getItem(KEYS.records)) {
      localStorage.setItem(KEYS.records, JSON.stringify([]));
    }
  }

  function getProfile() {
    try { return JSON.parse(localStorage.getItem(KEYS.profile)) || NPV2_DATA.DEFAULT_PROFILE; }
    catch { return NPV2_DATA.DEFAULT_PROFILE; }
  }

  function saveProfile(p) {
    localStorage.setItem(KEYS.profile, JSON.stringify(p));
  }

  function getRecords() {
    try { return JSON.parse(localStorage.getItem(KEYS.records)) || []; }
    catch { return []; }
  }

  function addRecord(r) {
    const records = getRecords();
    records.push(r);
    localStorage.setItem(KEYS.records, JSON.stringify(records));
  }

  function setRecords(records) {
    localStorage.setItem(KEYS.records, JSON.stringify(records || []));
  }

  function updateRecord(id, updates) {
    const records = getRecords();
    const idx = records.findIndex(r => r.id === id);
    if (idx > -1) {
      records[idx] = { ...records[idx], ...updates, updated_at: new Date().toISOString() };
      localStorage.setItem(KEYS.records, JSON.stringify(records));
    }
  }

  function deleteRecord(id) {
    const records = getRecords().filter(r => r.id !== id);
    localStorage.setItem(KEYS.records, JSON.stringify(records));
  }

  function getRole() {
    return localStorage.getItem(KEYS.role) || 'user';
  }

  function setRole(role) {
    localStorage.setItem(KEYS.role, role);
  }

  return { init, getProfile, saveProfile, getRecords, addRecord, setRecords, updateRecord, deleteRecord, getRole, setRole };
})();

const App = (() => {
  const routes = {
    '/': PageOverview,
    '/record/order': PageOrder,
    '/record/meal-photo': PageMeal,
    '/record/beverage': PageBeverage,
    '/history': PageHistory,
    '/goals': PageGoals,
    '/merchant': PageMerchant,

    '/merchant/dishes': PageMerchantDishes,
    '/merchant/community': PageMerchantCommunity,
    '/nutritionist': PageNutritionist,
    '/nutritionist/users': PageNutritionistUsers,

    '/nutritionist/stats': PageNutritionistStats,
    '/community': PageCommunity,
    '/auth': PageAuth,
    '/project': PageProject
  };

  let currentRoute = '/';

  function getRouteFromHash() {
    const hash = window.location.hash.replace(/^#/, '') || '/';
    return routes[hash] ? hash : '/';
  }

  function navigate(hash) {
    window.location.hash = hash;
  }

  function rerender() {
    render();
  }

  function render() {
    currentRoute = getRouteFromHash();
    const page = routes[currentRoute];
    const main = document.getElementById('mainContent');
    if (main && page) {
      main.innerHTML = page.render();
      // 刷新图标
      if (window.lucide) lucide.createIcons({ root: main });
      // 页面特定事件绑定
      if (page.bindEvents) page.bindEvents();
      // 滚动到顶部
      main.scrollTop = 0;
      window.scrollTo(0, 0);
      const _pc = main.querySelector(".page-content");
      if (_pc) setTimeout(() => { _pc.style.opacity = "1"; _pc.style.transform = "none"; }, 400);

    updateNavActive();
    updateRoleUI();
    updateUserChip();

        '<i data-lucide="chevron-down" style="width:14px;height:14px;"></i></button>' +
        '<div class="user-menu" id="userMenu" style="display:none;">' +
        '<a href="' + Auth.roleHome(u.role) + '"><i data-lucide="layout-dashboard"></i>我的工作台</a>' +
        '<a href="#/community"><i data-lucide="message-circle"></i>协同社区</a>' +
        '<a href="javascript:void(0)" onclick="App.doLogout()"><i data-lucide="log-out"></i>退出登录</a>' +
        '</div></div>';
    }
    if (window.lucide) lucide.createIcons({ root: box });
  }

  function toggleChipMenu() {
    const m = document.getElementById('userMenu');
    if (m) m.style.display = m.style.display === 'none' ? 'block' : 'none';
  }

  function doLogout() {
    Auth.logout();
    UI.toast('已退出登录', 'info');
    render();
  }

  function init() {
    AppState.init();

    // 路由变化
    window.addEventListener('hashchange', render);

    document.addEventListener('click', (e) => {
      const m = document.getElementById('userMenu');
      if (m && !e.target.closest('.user-chip-wrap')) m.style.display = 'none';
    });

    // 角色切换
    document.querySelectorAll('.role-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const role = btn.dataset.role;
        AppState.setRole(role);
        updateRoleUI();
    updateUserChip();
        const roleNames = { user: '用户', merchant: '商家', nutritionist: '营养师' };
        UI.toast(`已切换到${roleNames[role]}角色`, 'info');
        // 切换角色后导航到对应页面
        if (role === 'merchant') navigate('#/merchant');
        else if (role === 'nutritionist') navigate('#/nutritionist');
        else navigate('#/');
      });
    });

    // 移动端菜单
    const menuToggle = document.getElementById('menuToggle');
    const mainNav = document.getElementById('mainNav');
    if (menuToggle && mainNav) {
      const iconMenu = menuToggle.querySelector('.icon-menu');
      const iconClose = menuToggle.querySelector('.icon-close');
      function toggleMenuIcon(isOpen) {
        if (iconMenu && iconClose) {
          iconMenu.style.display = isOpen ? 'none' : 'block';
          iconClose.style.display = isOpen ? 'block' : 'none';
        }
      }
      menuToggle.addEventListener('click', () => {
        const isOpen = mainNav.classList.toggle('open');
        menuToggle.setAttribute('aria-expanded', isOpen);
        toggleMenuIcon(isOpen);
      });
      // 点击导航项后关闭菜单
      mainNav.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('click', () => {
          mainNav.classList.remove('open');
          menuToggle.setAttribute('aria-expanded', 'false');
          toggleMenuIcon(false);
        });
      });
    }

    // 初始渲染
    render();

    console.log('%c营养智链 · 外卖个性化营养管理平台', 'color:#0B7285;font-weight:bold;font-size:14px;');
    console.log('营养智链 · 数据安全存储于本机浏览器');
    console.log('数据存储于本机浏览器，保障隐私安全。');
  }

  return { init, render, rerender, navigate, updateUserChip, toggleChipMenu, doLogout };
})();

// 启动
document.addEventListener('DOMContentLoaded', () => {
  // Lucide 图标加载检测
  if (typeof lucide === 'undefined') {
    console.warn('Lucide 图标库未加载，将使用文字替代');
  }
  App.init();
});

</script>
</body>
</html>
