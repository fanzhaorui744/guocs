          <h4 style="font-size:0.875rem;margin:12px 0 8px;">数据来源</h4>
          ${sources || '<p style="font-size:0.8125rem;color:var(--color-text-muted);">来源不足</p>'}
          ${result.engine_info ? `<h4 style="font-size:0.875rem;margin:12px 0 8px;">引擎信息</h4><div class="source-item"><div class="source-publisher">${result.engine_info.name} v${result.engine_info.version}</div><div class="source-meta">${result.engine_info.status}</div><div class="source-meta">${result.engine_info.note}</div></div>` : ''}
        </div>
      </details>
    </div>`;
  }

  // ========== 协同时间线 ==========
  function collabTimeline(events) {
    if (!events || events.length === 0) return '<p style="font-size:0.8125rem;color:var(--color-text-muted);">暂无协同事件</p>';
    const roleColors = { user:'var(--color-primary-500)', merchant:'var(--color-accent-500)', nutritionist:'var(--color-warning-500)', system:'var(--color-unknown-500)' };
    return `<div class="timeline">
      ${events.map(e => `<div class="timeline-item">
        <div class="timeline-title" style="display:flex;align-items:center;gap:6px;">
          <span class="tag" style="background:${roleColors[e.actor]||'var(--color-unknown-500)'}20;color:${roleColors[e.actor]||'var(--color-unknown-600)'};border-color:transparent;">${e.actor_name || e.actor}</span>
          ${e.title}
        </div>
        <div class="timeline-desc">${e.desc || ''} · ${e.time || ''}</div>
      </div>`).join('')}
    </div>`;
  }

  // ========== 社区帖子卡片（记录即帖子） ==========
  function postCard(p, idx) {
    const isHidden = p.moderation_status === '已隐藏';
    const isPending = p.moderation_status === '待审核';
    const rs = p.record_snapshot;
    return `<div class="post-item" style="${isHidden?'opacity:0.6;':''}">
      <div class="post-header">
        <div class="post-avatar">${p.author_name?.[0] || 'U'}</div>
        <div><div class="post-author">${p.author_name} ${p.verification_badge?`<span class="post-role-badge">${p.verification_badge}</span>`:''}<span class="post-role-badge">${p.author_role==='user'?'用户':p.author_role==='merchant'?'商家':'营养师'}</span></div></div>
        <div class="post-time">${p.created_at?.slice(0,16).replace('T',' ') || ''}</div>
      </div>
      ${isPending ? '<div class="tag tag-pending" style="margin-bottom:8px;">待审核 · 仅自己可见</div>' : ''}
      ${isHidden ? '<div class="tag tag-error" style="margin-bottom:8px;">已隐藏 · 违反社区规则</div>' : ''}
      ${p.info_updated ? '<div class="tag tag-success" style="margin-bottom:8px;"><i data-lucide="refresh-cw" style="width:12px;height:12px;"></i>信息已更新</div>' : ''}
      <div class="post-title">${p.title}</div>
      <div class="post-body">${p.body}</div>
      ${rs ? `<div style="margin-top:10px;padding:12px;background:var(--color-bg-alt);border-radius:10px;border:1px solid var(--color-border-light);">
        <div style="font-size:0.75rem;font-weight:700;color:var(--color-text-secondary);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.03em;">📋 记录营养快照</div>
        <div style="font-size:0.8125rem;font-weight:600;margin-bottom:6px;">${rs.name}</div>
        <div style="display:flex;gap:12px;flex-wrap:wrap;font-size:0.75rem;color:var(--color-text-secondary);">
          <span>🔥 ${rs.kcal_interval?rs.kcal_interval.min+'-'+rs.kcal_interval.max+'kcal':'未知'}</span>
          <span>🥩 蛋白${rs.protein_g?rs.protein_g.min+'-'+rs.protein_g.max+'g':'未知'}</span>
          <span>🍬 糖${rs.sugar_g?rs.sugar_g.min+'-'+rs.sugar_g.max+'g':'未知'}</span>
          <span class="tag ${rs.confidence>=0.7?'tag-success':rs.confidence>=0.5?'tag-pending':'tag-source-low'}">置信度${Math.round((rs.confidence||0)*100)}%</span>
        </div>
        <div style="font-size:0.6875rem;color:var(--color-text-muted);margin-top:6px;">来源：${rs.source || '未知'} · ${rs.uncertainty || ''}</div>
        ${p.old_snapshot ? `<details style="margin-top:6px;"><summary style="font-size:0.6875rem;color:var(--color-accent-600);cursor:pointer;">查看旧值→新值变化</summary><div style="font-size:0.6875rem;color:var(--color-text-muted);margin-top:4px;">旧值：${p.old_snapshot.kcal_interval.min}-${p.old_snapshot.kcal_interval.max}kcal，糖${p.old_snapshot.sugar_g.min}-${p.old_snapshot.sugar_g.max}g · ${p.old_snapshot.note}</div></details>` : ''}
      </div>` : ''}
      ${(p.topic_tags||[]).length ? `<div class="post-tags">${p.topic_tags.map(t=>`<span class="post-tag">#${t}</span>`).join('')}</div>` : ''}
      <div class="post-footer">
        <button class="post-action" onclick="PageCommunity.like(${idx})"><i data-lucide="thumbs-up"></i>${p.likes||0}</button>
        <button class="post-action" onclick="PageCommunity.toggleCollect(${idx})"><i data-lucide="bookmark"></i>${p.collected||0}</button>
        <button class="post-action" onclick="PageCommunity.toggleComments(${idx})"><i data-lucide="message-circle"></i>${(p.comments||[]).length}</button>
        <button class="post-action" onclick="PageCommunity.report(${idx})"><i data-lucide="flag"></i>举报</button>
        <button class="post-action" style="margin-left:auto;" onclick="PageCommunity.viewPost(${idx})"><i data-lucide="external-link"></i>详情</button>
      </div>
      <div id="comments_${idx}" style="display:none;">
        <div class="comment-list">
          ${(p.comments||[]).map(c => `<div class="comment-item"><div class="comment-avatar">${c.author?.[0]||'U'}</div><div class="comment-body"><div class="comment-header">${c.author} <span class="post-role-badge">${c.role||'用户'}</span>${c.qualification?` <span class="post-role-badge">资质:${c.qualification}</span>`:''} · ${c.time}</div><div class="comment-text">${c.text}</div></div></div>`).join('')}
        </div>
        <div style="display:flex;gap:8px;margin-top:8px;"><input class="form-input" id="commentInput_${idx}" placeholder="写评论..." style="flex:1;"><button class="btn btn-primary btn-sm" onclick="PageCommunity.addComment(${idx})">发送</button></div>
      </div>
    </div>`;
  }

  // ========== 状态视图 ==========
  function stateView(type, opts = {}) {
    const configs = {
      idle: { icon:'image-plus', title:opts.title||'尚未选择照片', desc:opts.desc||'上传餐食照片开始识别，或使用替代路径。', actions:opts.actions||[] },
      uploading: { icon:'loader-2', title:opts.title||'正在处理...', desc:opts.desc||'本地演示模拟识别中，请稍候。', actions:opts.actions||[], loading:true },
      complete: { icon:'check-circle-2', title:opts.title||'识别完成', desc:opts.desc||'', actions:opts.actions||[] },
      partial: { icon:'alert-circle', title:opts.title||'部分识别', desc:opts.desc||'部分菜品已识别，部分待确认。', actions:opts.actions||[] },
      low_conf: { icon:'help-circle', title:opts.title||'识别置信度较低', desc:opts.desc||'结果区间较大，建议人工确认。', actions:opts.actions||[] },
      error: { icon:'x-circle', title:opts.title||'识别失败/服务不可用', desc:opts.desc||'请使用替代路径。', actions:opts.actions||[] },
      permission: { icon:'shield-alert', title:opts.title||'权限不足', desc:opts.desc||'需要相机或文件访问权限。', actions:opts.actions||[] },
      unknown: { icon:'help-circle', title:opts.title||'未知/待补充', desc:opts.desc||'资料不足，无法提供估算。', actions:opts.actions||[] },
      empty: { icon:'inbox', title:opts.title||'暂无数据', desc:opts.desc||'', actions:opts.actions||[] }
    };
    const c = configs[type] || configs.empty;
    return `<div class="state-view">
      ${c.loading ? '<div class="loading-spinner"></div>' : `<div class="state-icon"><i data-lucide="${c.icon}"></i></div>`}
      <div class="state-title">${c.title}</div>
      ${c.desc ? `<div class="state-desc">${c.desc}</div>` : ''}
      ${c.actions.length ? `<div class="state-actions">${c.actions.join('')}</div>` : ''}
    </div>`;
  }

  // ========== Toast / Modal ==========
  function toast(message, type = 'info', duration = 3000) {
    const container = document.getElementById('toastContainer');
    if (!container) return;
    const icons = { success:'check-circle', error:'x-circle', warning:'alert-triangle', info:'info' };
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.innerHTML = `<i data-lucide="${icons[type]||'info'}" style="width:18px;height:18px;flex-shrink:0;margin-top:1px;"></i><span>${message}</span>`;
    container.appendChild(el);
    if (window.lucide) lucide.createIcons({ root: el });
    setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity 0.3s'; setTimeout(()=>el.remove(), 300); }, duration);
  }

  function modal(title, bodyHTML, footerHTML = '', opts = {}) {
    const container = document.getElementById('modalContainer');
    if (!container) return;
    const id = 'modal_' + Date.now();
    const el = document.createElement('div');
    el.className = 'modal-overlay'; el.id = id;
    el.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="${id}_title">
      <div class="modal-header"><div class="modal-title" id="${id}_title">${title}</div><button class="modal-close" aria-label="关闭"><i data-lucide="x"></i></button></div>
      <div class="modal-body">${bodyHTML}</div>
      ${footerHTML ? `<div class="modal-footer">${footerHTML}</div>` : ''}
    </div>`;
    container.appendChild(el);
    if (window.lucide) lucide.createIcons({ root: el });
    const close = () => { el.remove(); document.removeEventListener('keydown', onKey); };
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    el.querySelector('.modal-close').addEventListener('click', close);
    el.addEventListener('click', (e) => { if (e.target === el) close(); });
    document.addEventListener('keydown', onKey);
    const focusable = el.querySelector('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
    if (focusable) focusable.focus();
    return { close, element: el };
  }

  function confirmDialog(title, message, onConfirm, confirmText = '确认', danger = false) {
    const footer = `<button class="btn btn-secondary" id="confirm_cancel">取消</button><button class="btn ${danger?'btn-danger':'btn-primary'}" id="confirm_ok">${confirmText}</button>`;
    const m = modal(title, `<p style="font-size:0.9375rem;color:var(--color-text-secondary);">${message}</p>`, footer);
    m.element.querySelector('#confirm_cancel').addEventListener('click', m.close);
    m.element.querySelector('#confirm_ok').addEventListener('click', () => { m.close(); onConfirm(); });
  }

  // ========== 其他 ==========
  function stepper(steps, current) {
    return `<div class="stepper">${steps.map((s, i) => {
      const cls = i < current ? 'completed' : i === current ? 'active' : '';
      return `<div class="step-item ${cls}"><div class="step-num">${i < current ? '<i data-lucide="check" style="width:14px;height:14px;"></i>' : (i+1)}</div><span class="step-label">${s}</span></div>${i < steps.length-1 ? '<div class="step-connector"></div>' : ''}`;
    }).join('')}</div>`;
  }

  function uploadZone(id, opts = {}) {
    return `<div class="upload-zone" id="${id}" tabindex="0" role="button" aria-label="${opts.label||'上传图片'}">
      <div class="upload-icon"><i data-lucide="${opts.icon||'upload-cloud'}"></i></div>
      <div class="upload-text">${opts.text||'点击或拖拽上传图片'}</div>
      <div class="upload-hint">${opts.hint||'支持 JPG/PNG，图片仅本地预览，不上传服务器'}</div>
      <input type="file" id="${id}_input" accept="image/*" style="display:none" aria-label="选择图片文件">
    </div>`;
  }

  function emptyState(icon, text, actionHTML = '') {
    return `<div class="empty-state"><i data-lucide="${icon}"></i><p>${text}</p>${actionHTML}</div>`;
  }

  function refreshIcons(root = document) { if (window.lucide) lucide.createIcons({ root }); }

  return {
    tag, demoTags, nutrientValue, nutritionGrid,
    ringProgress, macroDonut, mealBarChart, trendChart, sugarCard,
    resultCard, collabTimeline, postCard,
    stateView, toast, modal, confirmDialog, stepper, uploadZone, emptyState, refreshIcons
  };
})();

/* 总览/今日页 v3.0 - MacroFactor/Sleek风格重设计 */
const PageOverview = (() => {
  function render() {
    const profile = AppState.getProfile();
    const records = AppState.getRecords();
    const allRecords = [...NPV2_DATA.HISTORY_RECORDS, ...records];
    const today = new Date().toISOString().slice(0, 10);
    const todayRecords = allRecords.filter(r => r.created_at?.startsWith(today));

    let totalKcal = 0, totalProtein = 0, totalFat = 0, totalCarbs = 0, totalSugar = 0, sugarFromBev = 0, sugarFromMeal = 0;
    let mealKcal = { breakfast:0, lunch:0, dinner:0, snack:0 };
    let mealCount = { breakfast:0, lunch:0, dinner:0, snack:0 };
    let mealItems = { breakfast:[], lunch:[], dinner:[], snack:[] };

    for (const r of todayRecords) {
      const period = r.meal_period || 'snack';
      for (const item of (r.items || [])) {
        const k = item.calories_kcal;
        const kcal = k?.interval ? (k.interval.min + k.interval.max)/2 : (k?.value || 0);
        const prot = item.protein_g?.interval ? (item.protein_g.interval.min + item.protein_g.interval.max)/2 : (item.protein_g?.value || 0);
        const fat = item.fat_g?.interval ? (item.fat_g.interval.min + item.fat_g.interval.max)/2 : (item.fat_g?.value || 0);
        const carb = item.carbs_g?.interval ? (item.carbs_g.interval.min + item.carbs_g.interval.max)/2 : (item.carbs_g?.value || 0);
        const sug = item.sugar_g?.interval ? (item.sugar_g.interval.min + item.sugar_g.interval.max)/2 : (item.sugar_g?.value || 0);
        totalKcal += kcal; totalProtein += prot; totalFat += fat; totalCarbs += carb; totalSugar += sug;
        mealKcal[period] = (mealKcal[period]||0) + kcal;
        if (r.source_type === 'beverage' || item.category === 'beverage') sugarFromBev += sug;
        else sugarFromMeal += sug;
      }
      mealCount[period] = (mealCount[period]||0) + 1;
      mealItems[period] = [...(mealItems[period]||[]), r.merchant_label || '未命名'];
    }

    const target = profile.daily_target || { kcal:1800, protein_g:70, fat_g:60, carbs_g:220, sugar_g:50 };
    const remaining = Math.max(0, Math.round(target.kcal - totalKcal));
    const kcalPct = Math.min(100, Math.round((totalKcal / target.kcal) * 100));

    // 7天趋势数据
    const trendData = [];
    for (let d = 6; d >= 0; d--) {
      const date = new Date(); date.setDate(date.getDate() - d);
      const ds = date.toISOString().slice(0,10);
      const dayRecords = allRecords.filter(r => r.created_at?.startsWith(ds));

      for (const r of dayRecords) for (const it of (r.items||[])) {
        if (it.calories_kcal?.interval) dayKcal += (it.calories_kcal.interval.min + it.calories_kcal.interval.max)/2;
        else if (it.calories_kcal?.value) dayKcal += it.calories_kcal.value;
      }

    }

    // 问候语
    const hour = new Date().getHours();
    const greeting = hour < 11 ? '早上好' : hour < 14 ? '中午好' : hour < 18 ? '下午好' : '晚上好';
    const dateStr = new Date().toLocaleDateString('zh-CN', { month:'long', day:'numeric', weekday:'long' });

    return `

        <div class="card-header" style="margin-bottom:8px;">
          <div class="card-title"><i data-lucide="flame"></i>今日热量</div>
          <span class="tag tag-demo">演示数据</span>

              <span style="font-size:0.8125rem;font-weight:600;color:var(--primary);">🎯 每日目标</span>

  // 大环形进度图
  function renderLargeRing(remaining, consumed, target) {
    const pct = Math.min(100, Math.round((consumed / target) * 100));
    const radius = 80;
    const circumference = 2 * Math.PI * radius;
    const offset = circumference - (pct / 100) * circumference;
    return `<div class="ring-progress-large">
      <svg width="200" height="200" viewBox="0 0 200 200">
        <defs><linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0B7285"/><stop offset="100%" stop-color="#2A9D8F"/></linearGradient></defs>
        <circle class="ring-bg" cx="100" cy="100" r="${radius}"></circle>
        <circle class="ring-fill" cx="100" cy="100" r="${radius}" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"></circle>
      </svg>
      <div class="ring-center">
        <div class="ring-label-top">剩余</div>
        <div class="ring-value">${remaining}<span class="unit"> kcal</span></div>
        <div class="ring-label-bottom">已摄入 ${Math.round(consumed)} / ${target}</div>
      </div>
    </div>`;
  }

  // 宏量营养素迷你环形图
  function renderMacroRings(protein, fat, carbs, target) {
    const items = [
      { label:'蛋白质', value:Math.round(protein), target:target.protein_g, color:'#6366F1', bg:'#EEF0FE' },
      { label:'碳水', value:Math.round(carbs), target:target.carbs_g, color:'#D9A441', bg:'#FBF3E0' },
      { label:'脂肪', value:Math.round(fat), target:target.fat_g, color:'#2A9D8F', bg:'#E6F7F3' }
    ];
    return `<div class="mini-ring-group">
      ${items.map(item => {
        const pct = Math.min(100, Math.round((item.value / item.target) * 100));
        const r = 26;
        const circ = 2 * Math.PI * r;
        const offset = circ - (pct / 100) * circ;
        return `<div class="mini-ring-item">
          <div class="mini-ring">
            <svg width="68" height="68" viewBox="0 0 68 68">
              <circle class="mini-ring-bg" cx="34" cy="34" r="${r}"></circle>
              <circle class="mini-ring-fill" cx="34" cy="34" r="${r}" stroke="${item.color}" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"></circle>
            </svg>
            <div class="mini-ring-center" style="color:${item.color};">${pct}%</div>
          </div>
          <div class="mini-ring-label">${item.label}</div>
          <div class="mini-ring-value">${item.value}g / ${item.target}g</div>
        </div>`;
      }).join('')}
    </div>`;
  }

  // 三餐时间线
  function renderMealTimeline(mealKcal, mealCount, mealItems) {
    const meals = [
      { period:'breakfast', label:'早餐', time:'6:00-10:00', icon:'🌅', color:'#D9A441' },
      { period:'lunch', label:'午餐', time:'11:00-14:00', icon:'☀️', color:'#E76F51' },
      { period:'dinner', label:'晚餐', time:'17:00-21:00', icon:'🌙', color:'#0B7285' },
      { period:'snack', label:'加餐', time:'其他时间', icon:'☕', color:'#2A9D8F' }
    ];
    return `<div style="position:relative;padding-left:8px;">
      ${meals.map((m, i) => {
        const recorded = mealCount[m.period] > 0;
        const kcal = Math.round(mealKcal[m.period] || 0);
        const items = (mealItems[m.period] || []).slice(0, 2).join('、');
        return `<div style="display:flex;align-items:flex-start;gap:14px;padding:12px 0;${i < meals.length-1 ? 'border-bottom:1px solid var(--border-light);' : ''}">
          <div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;width:48px;">
            <div style="width:36px;height:36px;border-radius:50%;background:${recorded ? m.color+'20' : 'var(--bg-alt)'};display:flex;align-items:center;justify-content:center;font-size:1.125rem;">${m.icon}</div>
            <span style="font-size:0.625rem;color:var(--text-muted);font-weight:600;">${m.time}</span>
          </div>
          <div style="flex:1;min-width:0;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
              <span style="font-size:0.9375rem;font-weight:700;">${m.label}</span>
              ${recorded ? `<span style="font-size:1rem;font-weight:800;color:var(--text-primary);font-variant-numeric:tabular-nums;">${kcal} kcal</span>` : `<span style="font-size:0.8125rem;color:var(--text-muted);font-weight:500;">待记录</span>`}
            </div>
            ${recorded ? `<div style="font-size:0.75rem;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${items || `${mealCount[m.period]}条记录`}</div>` : ''}
          </div>
          ${recorded ? `<span class="tag tag-success" style="flex-shrink:0;align-self:center;">✓</span>` : `<a href="#/record/beverage" class="btn btn-primary btn-sm" style="flex-shrink:0;align-self:center;padding:6px 12px;min-height:32px;font-size:0.75rem;">+ 记录</a>`}
        </div>`;
      }).join('')}
    </div>`;
  }

  // 面积图
  function renderAreaChart(data, target) {
    const w = 600, h = 160, padL = 40, padR = 10, padT = 15, padB = 25;
    const maxV = Math.max(...data.map(d => d.kcal), target, 1) * 1.15;
    const xStep = (w - padL - padR) / (data.length - 1 || 1);
    const points = data.map((d, i) => {
      const x = padL + i * xStep;
      const y = h - padB - ((d.kcal - 0) / (maxV - 0)) * (h - padT - padB);
      return { x, y, ...d };
    });
    const pathD = points.map((p, i) => `${i===0?'M':'L'}${p.x},${p.y}`).join(' ');
    const areaD = pathD + ` L${points[points.length-1].x},${h-padB} L${points[0].x},${h-padB} Z`;
    const targetY = h - padB - (target / maxV) * (h - padT - padB);
    return `<div class="area-chart-container">
      <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0B7285" stop-opacity="0.25"/>
          <stop offset="100%" stop-color="#0B7285" stop-opacity="0"/>
        </linearGradient></defs>
        <line x1="${padL}" y1="${targetY}" x2="${w-padR}" y2="${targetY}" stroke="#D9A441" stroke-width="1.5" stroke-dasharray="5,4"/>
        <text x="${w-padR}" y="${targetY-5}" text-anchor="end" font-size="10" fill="#D9A441" font-weight="600">目标 ${target}</text>
        <path d="${areaD}" fill="url(#areaGrad)"/>
        <path d="${pathD}" fill="none" stroke="#0B7285" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        ${points.map((p, i) => `<circle cx="${p.x}" cy="${p.y}" r="${i===points.length-1?5:3.5}" fill="${i===points.length-1?'#0B7285':'#fff'}" stroke="#0B7285" stroke-width="2"/>
          <text x="${p.x}" y="${h-8}" text-anchor="middle" font-size="10" fill="${i===points.length-1?'#0B7285':'#8B9AAB'}" font-weight="${i===points.length-1?'700':'400'}">${p.day}</text>`).join('')}
      </svg>
    </div>`;
  }

  return { render };
})();

          <p>• <strong>AI 结构化提取</strong>：使用 DeepSeek 将识别文字转为结构化的商家/菜品/规格/价格。</p>
          <p>• <strong>本地规则匹配</strong>：无 AI 时的降级方案，基于关键词匹配生成候选。</p>
          <p>• <strong>隐私</strong>：API Key 仅保存在本地浏览器，图片和文字不上传到我们的服务器。</p>

        </div>

  function getStepIndex() {
    const map = { input:0, ocr_processing:1, ocr_result:1, ai_processing:2, candidates:3, manual:2 };
    return map[state.step] || 0;
  }

  function getCategoryTag(cat) {
    const map = { '固体餐':'tag-success', '饮品':'tag-demo', '小吃':'tag-pending', '水果':'tag-source-low', '其他':'tag-unknown' };
    return map[cat] || 'tag-unknown';
  }

  // 图片处理
  function handleImage(file) {
    if (!file) return;
    if (file.size > 4 * 1024 * 1024) { UI.toast('图片不能超过 4MB', 'warning'); return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      // Canvas 压缩
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const maxSize = 1024;
        let w = img.width, h = img.height;
        if (w > h && w > maxSize) { h = h * maxSize / w; w = maxSize; }
        else if (h > maxSize) { w = w * maxSize / h; h = maxSize; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        state.previewImage = e.target.result;
        state.compressedBase64 = canvas.toDataURL('image/jpeg', 0.85).replace('data:image/jpeg;base64,', '');
        state.step = 'input';
        state.error = null;
        App.rerender();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function clearImage() {
    state.previewImage = null;
    state.compressedBase64 = null;
    state.step = 'input';
    App.rerender();
  }

  // 百度 OCR
  const DEFAULT_BAIDU_API_KEY = 'bxEEs5XPPC54ucEly0xC9vFy';
  const DEFAULT_BAIDU_SECRET_KEY = '4XTMZfzGxZduKFXBaesKdcVxC7os8jhA';
  async function getBaiduAccessToken() {
    const apiKey = localStorage.getItem('baidu_ocr_api_key') || DEFAULT_BAIDU_API_KEY;
    const secretKey = localStorage.getItem('baidu_ocr_secret_key') || DEFAULT_BAIDU_SECRET_KEY;
    const proxy = localStorage.getItem('baidu_ocr_proxy') || 'https://api.allorigins.win/raw?url=';
    const cached = localStorage.getItem('baidu_access_token');
    const cachedTime = localStorage.getItem('baidu_token_time');
    if (cached && cachedTime && (Date.now() - parseInt(cachedTime) < 25*24*60*60*1000)) return cached;
    const tokenUrl = `https://aip.baidubce.com/oauth/2.0/token?grant_type=client_credentials&client_id=${apiKey}&client_secret=${secretKey}`;
    const response = await fetch(proxy + encodeURIComponent(tokenUrl));
    const data = await response.json();
    if (data.access_token) {
      localStorage.setItem('baidu_access_token', data.access_token);
      localStorage.setItem('baidu_token_time', Date.now().toString());
      return data.access_token;
    }
    throw new Error(data.error_description || '获取 access_token 失败');
  }

  async function baiduOCR(imageBase64, accessToken) {
    const proxy = localStorage.getItem('baidu_ocr_proxy') || 'https://api.allorigins.win/raw?url=';
    const ocrUrl = `https://aip.baidubce.com/rest/2.0/ocr/v1/general_basic?access_token=${accessToken}`;
    const formData = new URLSearchParams();
    formData.append('image', imageBase64);
    const response = await fetch(proxy + encodeURIComponent(ocrUrl), {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: formData.toString()
    });
    const data = await response.json();
    if (data.words_result) return data.words_result.map(item => item.words).join('\n');
    throw new Error(data.error_msg || 'OCR 识别失败');
  }

  async function startOCR() {
    if (!state.compressedBase64) { UI.toast('请先上传图片', 'warning'); return; }
    state.step = 'ocr_processing';
    state.error = null;
    App.rerender();
    try {
      const token = await getBaiduAccessToken();
      const text = await baiduOCR(state.compressedBase64, token);
      state.ocrText = text;
      state.orderText = text;
      state.step = 'ocr_result';
      UI.toast('OCR 识别完成', 'success');
    } catch (e) {
      state.error = { title: 'OCR 识别失败', detail: e.message + '。请检查密钥或代理设置，或手动粘贴订单文字。' };
      state.step = 'manual';
      UI.toast('OCR 失败，已切换到手动输入', 'error');
    }
    App.rerender();
  }

  function useManualInput() {
    state.step = 'manual';
    state.error = null;
    App.rerender();
  }

  // DeepSeek 提取
  const DEFAULT_DEEPSEEK_KEY = 'sk-' + '0dbe8fdfd39c47f780286ab29f6583a3';
  const DEFAULT_DEEPSEEK_BASE = 'https://api.deepseek.com';
  const DEFAULT_DEEPSEEK_MODEL = 'deepseek-chat';
  async function extractWithDeepSeek(orderText) {
    const apiKey = localStorage.getItem('deepseek_api_key') || DEFAULT_DEEPSEEK_KEY;
    const apiBase = localStorage.getItem('deepseek_api_base') || DEFAULT_DEEPSEEK_BASE;
    const model = localStorage.getItem('deepseek_model') || DEFAULT_DEEPSEEK_MODEL;
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 15000);
    try {
      const response = await fetch(`${apiBase}/chat/completions`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
        body: JSON.stringify({
          model: model,
          messages: [
            { role: 'system', content: '你是一个外卖订单信息提取助手。从用户提供的订单文本中提取结构化信息，返回严格的 JSON 格式，不要输出任何其他文字。\n\nJSON 格式：\n{\n  "merchant": "商家名称",\n  "order_time": "下单时间",\n  "items": [\n    {\n      "name": "菜品/饮品名称",\n      "specification": "规格/备注",\n      "quantity": 数量,\n      "price": 单价,\n      "category": "固体餐/饮品/小吃/水果/其他"\n    }\n  ],\n  "total_price": 总价,\n  "confidence": 0-1\n}\n\n规则：无法识别的字段填 null；只提取文本中明确存在的信息。' },
            { role: 'user', content: orderText }
          ],
          temperature: 0.1,
          response_format: { type: 'json_object' }
        }),
        signal: controller.signal
      });
      clearTimeout(timeoutId);
      if (!response.ok) throw new Error(`API 返回 ${response.status}`);
      const result = await response.json();
      const extracted = JSON.parse(result.choices[0].message.content);
      return { success: true, data: extracted };
    } catch (error) {
      clearTimeout(timeoutId);
      return { success: false, error: error.message };
    }
  }

  async function startAIExtract() {
    const text = document.getElementById('orderTextInput')?.value?.trim();
    if (!text) { UI.toast('请先输入或识别订单文字', 'warning'); return; }
    state.orderText = text;
    state.error = null;
    state.aiNotConfigured = false;
    state.step = 'ai_processing';
    App.rerender();
    const result = await extractWithDeepSeek(text);
    if (result.success) {
      state.extractedData = { ...result.data, source: 'deepseek' };
      state.candidates = result.data.items || [];
      state.step = 'candidates';
      UI.toast(`AI 提取完成，共 ${state.candidates.length} 项`, 'success');
    } else {
      state.error = { title: 'AI 提取失败', detail: result.error + '。已降级为本地规则匹配。' };
      localMatch(text);
    }
    App.rerender();
  }

  function useLocalMatch() {
    const text = document.getElementById('orderTextInput')?.value?.trim();
    if (!text) { UI.toast('请先输入订单文字', 'warning'); return; }
    state.orderText = text;
    localMatch(text);
    App.rerender();
  }

  function localMatch(text) {
    // 简单本地规则匹配
    const lines = text.split('\n').filter(l => l.trim());
    const candidates = lines.map(line => {
      const priceMatch = line.match(/(\d+\.?\d*)\s*元/);
      const qtyMatch = line.match(/[×xX*]\s*(\d+)/);
      return {
        name: line.replace(/\d+\.?\d*\s*元.*/, '').replace(/[×xX*]\s*\d+.*/, '').trim().slice(0, 30) || '未命名',
        specification: null,
        quantity: qtyMatch ? parseInt(qtyMatch[1]) : 1,
        price: priceMatch ? parseFloat(priceMatch[1]) : null,
        category: /茶|奶|咖啡|果汁|饮/.test(line) ? '饮品' : '固体餐'
      };
    }).filter(c => c.name && c.name.length > 1);
    state.extractedData = { merchant: null, order_time: null, total_price: null, confidence: 0.5, source: 'local' };
    state.candidates = candidates;
    state.step = 'candidates';
    UI.toast(`本地匹配完成，共 ${candidates.length} 项`, 'info');
  }

  function confirmItem(i) {
    UI.toast(`已确认：${state.candidates[i].name}`, 'success');
  }

  function editItem(i) {
    const item = state.candidates[i];
    const newName = prompt('修改名称', item.name);
    if (newName !== null) { state.candidates[i].name = newName; App.rerender(); }
  }

  function removeItem(i) {
    state.candidates.splice(i, 1);
    UI.toast('已移除', 'info');
    App.rerender();
  }

  function confirmAll() {
    if (state.candidates.length === 0) { UI.toast('没有可保存的项目', 'warning'); return; }
    // 保存到记录
    const now = new Date();
    const hour = now.getHours();
    const period = hour >= 6 && hour < 10 ? 'breakfast' : hour >= 11 && hour < 14 ? 'lunch' : hour >= 17 && hour < 21 ? 'dinner' : 'snack';
    const record = {
      id: 'order_' + Date.now(),
      source_type: 'order_import',
      raw_text: state.orderText,
      merchant_label: state.extractedData?.merchant || '未命名商家',
      meal_period: period,
      items: state.candidates.map(c => ({
        id: 'item_' + Math.random().toString(36).slice(2),
        name: c.name,
        category: c.category === '饮品' ? 'beverage' : 'meal',
        estimated_weight_g: null,
        consumed_ratio: 1,
        calories_kcal: { value: null, interval: { min: 0, max: 0 }, value_type: 'unknown' },
        protein_g: { value: null, interval: null, value_type: 'unknown' },
        fat_g: { value: null, interval: null, value_type: 'unknown' },
        carbs_g: { value: null, interval: null, value_type: 'unknown' },
        sugar_g: { value: null, interval: null, value_type: 'unknown' },
        sodium_mg: { value: null, interval: null, value_type: 'unknown' },
        confidence: state.extractedData?.confidence || 0.5,
        source_ids: [],
        value_type: 'unknown',
        interval: null,
        warnings: ['营养信息待补充，建议通过饮品配置或餐食拍照获取']
      })),
      status: 'confirmed',
      created_at: now.toISOString(),
      updated_at: now.toISOString()
    };
    const records = AppState.getRecords();
    records.push(record);
    AppState.setRecords(records);
    UI.toast(`已保存 ${state.candidates.length} 项记录`, 'success');
    state = { step:'input', orderText:'', ocrText:'', extractedData:null, candidates:[], previewImage:null, error:null };
    App.navigate('#/history');
  }

  return { render, handleImage, clearImage, startOCR, useManualInput, startAIExtract, useLocalMatch, confirmItem, editItem, removeItem, confirmAll };
})();

          </div>

  }

  // 图片处理
  function handleImage(file) {
    if (!file) return;
    if (file.size > 4 * 1024 * 1024) { UI.toast('图片不能超过 4MB', 'warning'); return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const maxSize = 1024;
        let w = img.width, h = img.height;
        if (w > h && w > maxSize) { h = h * maxSize / w; w = maxSize; }
        else if (h > maxSize) { w = w * maxSize / h; h = maxSize; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        state.previewImage = e.target.result;
        state.compressedBase64 = canvas.toDataURL('image/jpeg', 0.85).replace('data:image/jpeg;base64,', '');
        state.error = null;
        App.rerender();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function clearImage() {
    state.previewImage = null;
    state.compressedBase64 = null;
    state.step = 'upload';
    App.rerender();
  }

  function backToUpload() {
    state.step = 'upload';
    state.candidates = [];
    state.error = null;
    App.rerender();
  }

  // 百度菜品识别
  const DEFAULT_BAIDU_API_KEY = 'bxEEs5XPPC54ucEly0xC9vFy';
  const DEFAULT_BAIDU_SECRET_KEY = '4XTMZfzGxZduKFXBaesKdcVxC7os8jhA';
  async function getBaiduAccessToken() {
    const apiKey = localStorage.getItem('baidu_ocr_api_key') || DEFAULT_BAIDU_API_KEY;
    const secretKey = localStorage.getItem('baidu_ocr_secret_key') || DEFAULT_BAIDU_SECRET_KEY;
    const proxy = localStorage.getItem('baidu_ocr_proxy') || 'https://api.allorigins.win/raw?url=';
    const cached = localStorage.getItem('baidu_access_token');
    const cachedTime = localStorage.getItem('baidu_token_time');
    if (cached && cachedTime && (Date.now() - parseInt(cachedTime) < 25*24*60*60*1000)) return cached;
    const tokenUrl = `https://aip.baidubce.com/oauth/2.0/token?grant_type=client_credentials&client_id=${apiKey}&client_secret=${secretKey}`;
    const response = await fetch(proxy + encodeURIComponent(tokenUrl));
    const data = await response.json();
    if (data.access_token) {
      localStorage.setItem('baidu_access_token', data.access_token);
      localStorage.setItem('baidu_token_time', Date.now().toString());
      return data.access_token;
    }
    throw new Error(data.error_description || '获取 access_token 失败');
  }

  async function recognizeDish(imageBase64) {
    try {
      const accessToken = await getBaiduAccessToken();
      const proxy = localStorage.getItem('baidu_ocr_proxy') || 'https://api.allorigins.win/raw?url=';
      const apiUrl = `https://aip.baidubce.com/rest/2.0/image-classify/v2/dish?access_token=${accessToken}`;
      const formData = new URLSearchParams();
      formData.append('image', imageBase64);
      formData.append('top_num', '5');
      const response = await fetch(proxy + encodeURIComponent(apiUrl), {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: formData.toString()
      });
      const data = await response.json();
      if (data.result && data.result.length > 0) {
        return { success: true, results: data.result };
      } else if (data.error_msg) {
        return { success: false, error: data.error_msg };
      } else {
        return { success: false, error: '未识别到菜品' };
      }
    } catch (error) {
      return { success: false, error: error.message };
    }
  }

  async function startRecognize() {
    if (!state.compressedBase64) { UI.toast('请先上传图片', 'warning'); return; }
    state.error = null;
    state.step = 'recognizing';
    state.error = null;
    state.isMock = false;
    App.rerender();
    const result = await recognizeDish(state.compressedBase64);
    if (result.success) {
      state.candidates = result.results;
      state.lowConfidence = result.results.every(c => parseFloat(c.probability) < 0.3);
      state.step = 'candidates';
      UI.toast(`识别完成，共 ${result.results.length} 个候选`, 'success');
    } else {
      state.error = { title: '菜品识别失败', detail: result.error + '。可重试或使用演示数据。' };
      state.step = 'upload';
    }
    App.rerender();
  }

  function cancelRecognize() {
    state.step = 'upload';
    App.rerender();
  }

  function useMockData() {
    state.candidates = [...MOCK_DISHES];
    state.isMock = true;
    state.lowConfidence = false;
    state.step = 'candidates';
    state.error = null;
    UI.toast('已加载演示数据', 'info');
    App.rerender();
  }

  // DeepSeek 营养补充
  const DEFAULT_DEEPSEEK_KEY = 'sk-' + '0dbe8fdfd39c47f780286ab29f6583a3';
  async function estimateNutrition(dishName) {
    const apiKey = localStorage.getItem('deepseek_api_key') || DEFAULT_DEEPSEEK_KEY;
    const apiBase = localStorage.getItem('deepseek_api_base') || 'https://api.deepseek.com';
    const model = localStorage.getItem('deepseek_model') || 'deepseek-chat';
    try {
      const response = await fetch(`${apiBase}/chat/completions`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
        body: JSON.stringify({
          model: model,
          messages: [
            { role: 'system', content: '你是一个营养数据助手。根据菜品名称估算每100g的营养成分，返回严格的JSON格式，不要输出其他文字。JSON格式：{"protein_g":数字,"fat_g":数字,"carbs_g":数字,"sugar_g":数字,"sodium_mg":数字,"confidence":0-1,"note":"简要说明"}' },
            { role: 'user', content: dishName }
          ],
          temperature: 0.2,
          response_format: { type: 'json_object' }
        })
      });
      const result = await response.json();
      return { success: true, data: JSON.parse(result.choices[0].message.content) };
    } catch (error) {
      return { success: false, error: error.message };
    }
  }

  async function selectDish(index) {
    state.selectedDish = state.candidates[index];
    state.weight = 250;
    state.nutrition = null;
    state.step = 'detail';
    App.rerender();
    // 自动调用 DeepSeek 营养补充（使用默认或已配置的密钥）
    state.nutritionLoading = true;
    App.rerender();
    const result = await estimateNutrition(state.selectedDish.name);
    if (result.success) {
      state.nutrition = result.data;
    }
    state.nutritionLoading = false;
    App.rerender();
  }

  function setWeight(w) {
    state.weight = w;
    App.rerender();
  }

  function manualInput() {
    const name = prompt('请输入菜品名称：');
    if (name && name.trim()) {
      state.selectedDish = { name: name.trim(), probability: '0.5', calorie: '0' };
      state.isMock = true;
      state.weight = 250;
      state.nutrition = null;
      state.step = 'detail';
      App.rerender();
      state.nutritionLoading = true;
      App.rerender();
      estimateNutrition(name.trim()).then(result => {
        if (result.success) state.nutrition = result.data;
        state.nutritionLoading = false;
        App.rerender();
      });
    }
  }

  function saveRecord() {
    const dish = state.selectedDish;
    if (!dish) return;
    const calorie100g = parseFloat(dish.calorie) || 0;
    const totalKcal = Math.round(calorie100g * state.weight / 100);
    const now = new Date();
    const hour = now.getHours();
    const period = hour >= 6 && hour < 10 ? 'breakfast' : hour >= 11 && hour < 14 ? 'lunch' : hour >= 17 && hour < 21 ? 'dinner' : 'snack';
    const nut = state.nutrition;
    const record = {
      id: 'meal_' + Date.now(),
      source_type: state.isMock ? 'demo_mock' : 'baidu_dish',
      merchant_label: dish.name,
      meal_period: period,
      items: [{
        id: 'item_' + Math.random().toString(36).slice(2),
        name: dish.name,
        category: 'meal',
        estimated_weight_g: state.weight,
        consumed_ratio: 1,
        calories_kcal: { value: totalKcal, interval: null, value_type: 'estimated' },
        protein_g: nut ? { value: parseFloat((nut.protein_g * state.weight / 100).toFixed(1)), interval: null, value_type: 'estimated' } : { value: null, interval: null, value_type: 'unknown' },
        fat_g: nut ? { value: parseFloat((nut.fat_g * state.weight / 100).toFixed(1)), interval: null, value_type: 'estimated' } : { value: null, interval: null, value_type: 'unknown' },
        carbs_g: nut ? { value: parseFloat((nut.carbs_g * state.weight / 100).toFixed(1)), interval: null, value_type: 'estimated' } : { value: null, interval: null, value_type: 'unknown' },
        sugar_g: nut && nut.sugar_g ? { value: parseFloat((nut.sugar_g * state.weight / 100).toFixed(1)), interval: null, value_type: 'estimated' } : { value: null, interval: null, value_type: 'unknown' },
        sodium_mg: nut && nut.sodium_mg ? { value: Math.round(nut.sodium_mg * state.weight / 100), interval: null, value_type: 'estimated' } : { value: null, interval: null, value_type: 'unknown' },
        confidence: parseFloat(dish.probability) || 0.5,
        source_ids: [],
        value_type: 'estimated',
        warnings: state.isMock ? ['演示数据，非真实识别结果'] : ['百度菜品识别结果，卡路里为每100g参考值×份量']
      }],
      status: 'confirmed',
      created_at: now.toISOString(),
      updated_at: now.toISOString()
    };
    const records = AppState.getRecords();
    records.push(record);
    AppState.setRecords(records);
    state.step = 'saved';
    UI.toast(`已保存：${dish.name} ${totalKcal} kcal`, 'success');
    App.rerender();
  }

  function reset() {
    state = { step:'upload', previewImage:null, compressedBase64:null, candidates:[], selectedDish:null, weight:250, nutrition:null, nutritionLoading:false, error:null, isMock:false, lowConfidence:false };
    App.rerender();
  }

  return { render, handleImage, clearImage, startRecognize, cancelRecognize, useMockData, selectDish, setWeight, manualInput, saveRecord, reset, backToUpload };
})();

              <button class="config-option ${cfg.brand_id===c.brand_id?'selected':''}" onclick="PageBeverage.setBrand('${c.brand_id}','${c.brand_name}')">${c.brand_name}</button>
            </div>
          </div>

          <!-- SKU确认 -->
          <div class="config-section">
            <div class="config-section-title">
              产品/SKU ${cfg.confirmations.sku ? '<span class="tag tag-success">已确认</span>' : '<span class="tag tag-pending">待确认</span>'}
            </div>
            <div class="config-options">
              <button class="config-option ${cfg.sku_id===c.sku_id?'selected':''}" onclick="PageBeverage.setSku('${c.sku_id}','${c.display_name}')">${c.display_name}</button>
            </div>
          </div>

          <!-- 杯型/容量 -->
          <div class="config-section">
            <div class="config-section-title">
              杯型/容量 ${cfg.confirmations.cup_size ? '<span class="tag tag-success">已确认</span>' : '<span class="tag tag-pending">待确认</span>'}
            </div>
            <div class="config-options">
              ${(c.available_configuration?.cup_sizes || []).map(s => `
                <button class="config-option ${cfg.cup_size_id===s.id?'selected':''}" onclick="PageBeverage.setCupSize('${s.id}',${s.ml})">${s.label}（${s.ml}mL）</button>
              `).join('')}
            </div>
          </div>

          <!-- 糖度 -->
          <div class="config-section">
            <div class="config-section-title">
              糖度 ${cfg.confirmations.sugar_level ? '<span class="tag tag-success">已确认</span>' : '<span class="tag tag-pending">待确认</span>'}
            </div>
            <div class="config-options">
              ${(c.available_configuration?.sugar_levels || []).map(s => `
                <button class="config-option ${cfg.sugar_level_id===s.id?'selected':''}" onclick="PageBeverage.setSugar('${s.id}')">${s.label}</button>
              `).join('')}
            </div>
          </div>

          <!-- 冰量 -->
          <div class="config-section">
            <div class="config-section-title">
              冰量 ${cfg.confirmations.ice_level ? '<span class="tag tag-success">已确认</span>' : '<span class="tag tag-pending">待确认</span>'}
            </div>
            <div class="config-options">
              ${(c.available_configuration?.ice_levels || []).map(s => `
                <button class="config-option ${cfg.ice_level_id===s.id?'selected':''}" onclick="PageBeverage.setIce('${s.id}')">${s.label}</button>
              `).join('')}
            </div>
          </div>

          <!-- 小料 -->
          <div class="config-section">
            <div class="config-section-title">
              小料（可多选，不加则跳过）${cfg.toppings.length>0 ? `<span class="tag tag-success">已选${cfg.toppings.length}项</span>` : ''}
            </div>
            <div class="config-options">
              ${(c.available_configuration?.toppings || []).map(t => {
                const selected = cfg.toppings.find(x => x.topping_id === t.topping_id);
                return `<button class="config-option ${selected?'selected':''}" onclick="PageBeverage.toggleTopping('${t.topping_id}','${t.label}')">${t.label}</button>`;
              }).join('')}
              <button class="config-option ${cfg.toppings.length===0?'selected pending':''}" onclick="PageBeverage.clearToppings()">不加小料</button>
            </div>
          </div>

          <!-- 杯体状态 -->
          <div class="config-section">
            <div class="config-section-title">杯体状态（影响是否可输入剩余比例）</div>
            <select class="form-select" style="max-width:320px;" onchange="PageBeverage.setCupState(this.value)">
              <option value="unknown" ${cfg.cup_state==='unknown'?'selected':''}>未知/不适用</option>
              <option value="transparent_open" ${cfg.cup_state==='transparent_open'?'selected':''}>透明+未封口+液面可见</option>
              <option value="sealed" ${cfg.cup_state==='sealed'?'selected':''}>封口杯</option>
              <option value="opaque" ${cfg.cup_state==='opaque'?'selected':''}>不透明杯</option>
            </select>
            <p class="form-hint">仅"透明+未封口+液面可见+可靠初始容量"同时满足时，才允许输入剩余比例作为辅助。封口/不透明杯走整杯计算。</p>
          </div>

          <div style="display:flex;justify-content:space-between;margin-top:16px;">
            <button class="btn btn-secondary" onclick="PageBeverage.goStep(2)">返回</button>
            <button class="btn btn-primary" onclick="PageBeverage.goStep4()" ${!allConfirmed?'disabled':''}>
              ${cfg.cup_state === 'transparent_open' ? '下一步：剩余比例' : '计算估算结果'}<i data-lucide="arrow-right"></i>
            </button>
          </div>
          ${!allConfirmed ? '<p style="font-size:0.8125rem;color:var(--color-accent);margin-top:8px;text-align:right;">请完成品牌、SKU、杯型、糖度、冰量的确认后才能计算</p>' : ''}
        </div>
      </div>
    `;
  }

  function renderStep4() {
    const cfg = state.config;
    const canUseRatio = BeverageEngine.canUseConsumedRatio(cfg);

    if (cfg.cup_state !== 'transparent_open') {
      // 非透明开口杯，直接计算
      return calculateAndShow();
    }

    return `
      <div class="card">
        <div class="card-header">
          <div class="card-title"><i data-lucide="droplet"></i>Step 4：剩余比例辅助（可选）</div>
          <span class="tag ${canUseRatio ? 'tag-success' : 'tag-pending'}">${canUseRatio ? '条件满足' : '条件不满足'}</span>
        </div>
        <div class="card-body">
          ${canUseRatio ? `
            <div class="warning-item" style="background:var(--color-success-light);color:var(--color-success);">
              <i data-lucide="check-circle-2"></i>
              <span>条件满足：透明+未封口+液面可见+可靠初始容量（${cfg.volume_ml}mL）。可以输入剩余比例作为辅助输入。</span>
            </div>
            <div class="form-group" style="margin-top:16px;">
              <label class="form-label">实际摄入比例（目测估算）</label>
              <div class="config-options">
                ${[1,0.9,0.75,0.5,0.25].map(r => `
                  <button class="config-option ${cfg.consumed_ratio===r?'selected':''}" onclick="PageBeverage.setConsumedRatio(${r})">${r===1?'整杯':Math.round(r*100)+'%'}</button>
                `).join('')}
              </div>
              <p class="form-hint">剩余比例仅缩放已有依据的营养区间，不改变SKU、杯型、糖度、冰量、小料或serving basis。目测估算可能存在较大偏差。</p>
            </div>
          ` : `
            <div class="warning-item">
              <i data-lucide="alert-triangle"></i>
              <span>条件不满足。封口/不透明/信息不足时，不显示可误解为视觉测量的控件，按整杯计算。</span>
            </div>
          `}
          <div style="display:flex;justify-content:space-between;margin-top:16px;">
            <button class="btn btn-secondary" onclick="PageBeverage.goStep(3)">返回</button>
            <button class="btn btn-primary" onclick="PageBeverage.calculate()"><i data-lucide="calculator"></i>计算估算结果</button>
          </div>
        </div>
      </div>
    `;
  }

  function renderStep5() {
    if (!state.result) return '<p>无结果</p>';
    const r = state.result;
    return `
      ${UI.resultCard(r)}
      <div class="card">
        <div class="card-header">
          <div class="card-title"><i data-lucide="save"></i>保存记录</div>
        </div>
        <div class="card-body">
          <div class="form-group">
            <label class="form-label">餐次</label>
            <select class="form-select" id="bevMealPeriod" style="max-width:200px;">
              <option value="早餐">早餐</option>
              <option value="午餐">午餐</option>
              <option value="下午茶" selected>下午茶</option>
              <option value="晚餐">晚餐</option>
              <option value="加餐">加餐</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">备注（可选）</label>
            <input class="form-input" id="bevNote" placeholder="例如：实际喝了一半">
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn btn-primary" onclick="PageBeverage.saveRecord()"><i data-lucide="save"></i>保存到今日记录</button>
            <button class="btn btn-secondary" onclick="PageBeverage.reset()"><i data-lucide="rotate-ccw"></i>重新配置</button>
            <a href="#/" class="btn btn-ghost">返回总览</a>
          </div>
        </div>
      </div>
    `;
  }

  // ========== 交互方法 ==========
  function loadDemo(type) {
    const demos = {
      jasmine: '清叶茶铺（虚构）\n茉莉奶绿 中杯 半糖 少冰 +珍珠',
      berry: '果研所（虚构）\n满杯红柚 大杯 七分糖 正常冰',
      unknown: '某不知名奶茶店\n招牌奶茶 大杯 全糖'
    };
    state.inputText = demos[type] || '';
    const el = document.getElementById('bevText');
    if (el) el.value = state.inputText;
    UI.toast('已加载Demo文本', 'success');
  }

  function goStep2() {
    const text = document.getElementById('bevText')?.value || state.inputText;
    state.inputText = text;
    if (!text.trim()) { UI.toast('请输入或粘贴订单文字', 'warning'); return; }
    state.candidates = BeverageEngine.matchCandidates(text);
    state.selectedCandidate = null;
    state.step = 2;
    App.rerender();
  }

  function goStep(n) { state.step = n; App.rerender(); }

  function selectCandidate(i) {
    state.selectedCandidate = i;
    const c = state.candidates[i];
    state.config.brand_id = c.brand_id;
    state.config.sku_id = c.sku_id;
    state.config.confirmations.brand = true;
    state.config.confirmations.sku = true;
    App.rerender();
  }

  function manualSelect() {
    // 显示所有品牌供手动选择
    state.candidates = NPV2_DATA.BEVERAGE_CATALOG.slice(0, 12).map(s => ({
      brand_id: s.brand_id, brand_name: s.brand_name, sku_id: s.sku_id,
      display_name: s.display_name, score: 0.3,
      match_source: '手动选择（非文本匹配）',
      record_status: s.record_status, available_configuration: s.available_configuration
    }));
    state.selectedCandidate = null;
    state.step = 2;
    App.rerender();
    UI.toast('请从虚构示例目录中手动选择', 'info');
  }

  function goStep3() {
    if (state.selectedCandidate === null) { UI.toast('请先选择一个候选', 'warning'); return; }
    state.step = 3; App.rerender();
  }

  function setBrand(id, name) {
    state.config.brand_id = id; state.config.confirmations.brand = true; App.rerender();
  }
  function setSku(id, name) {
    state.config.sku_id = id; state.config.confirmations.sku = true; App.rerender();
  }
  function setCupSize(id, ml) {
    state.config.cup_size_id = id; state.config.volume_ml = ml; state.config.confirmations.cup_size = true; App.rerender();
  }
  function setSugar(id) {
    state.config.sugar_level_id = id; state.config.confirmations.sugar_level = true; App.rerender();
  }
  function setIce(id) {
    state.config.ice_level_id = id; state.config.confirmations.ice_level = true; App.rerender();
  }
  function toggleTopping(id, label) {
    const idx = state.config.toppings.findIndex(t => t.topping_id === id);
    if (idx > -1) state.config.toppings.splice(idx, 1);
    else state.config.toppings.push({ topping_id: id, servings: 1 });
    state.config.confirmations.toppings = state.config.toppings.length > 0;
    App.rerender();
  }
  function clearToppings() {
    state.config.toppings = []; state.config.confirmations.toppings = false; App.rerender();
  }
  function setCupState(val) {
    state.config.cup_state = val;
    if (val !== 'transparent_open') { state.config.consumed_ratio = null; state.config.consumed_ratio_source = null; }
    App.rerender();
  }
  function setConsumedRatio(r) {
    state.config.consumed_ratio = r;
    state.config.consumed_ratio_source = 'user_estimate';
    App.rerender();
  }

  function goStep4() {
    const validation = BeverageEngine.validateConfig(state.config);
    if (!validation.complete) { UI.toast(`未确认：${validation.missing.join('、')}`, 'warning'); return; }
    if (state.config.cup_state === 'transparent_open') {
      state.step = 4; App.rerender();
    } else {
      calculate();
    }
  }

  function calculate() {
    const validation = BeverageEngine.validateConfig(state.config);
    // 优先使用08引擎证据门控计算
    const c = state.candidates[state.selectedCandidate];
    const engineRecord = NPV2_DATA.ENGINE_CATALOG.records.find(r =>
      r.brand_id === c?.brand_id && r.sku_id === c?.sku_id
    );
    if (engineRecord && state.config.brand_id && state.config.sku_id) {
      const engine = new EvidenceBeverageEngine(NPV2_DATA.ENGINE_CATALOG);
      const request = {
        brand_id: state.config.brand_id,
        sku_id: state.config.sku_id,
        cup_size_id: state.config.cup_size_id || 'medium',
        sugar_level_id: state.config.sugar_level_id || 'full_sugar',
        ice_level_id: state.config.ice_level_id || 'normal_ice',
        toppings: (state.config.toppings || []).map(t => ({ topping_id: t.id || t, servings: t.servings || 1 })),
        consumed_ratio: state.config.consumed_ratio || 1,
        consumed_ratio_source: state.config.consumed_ratio ? 'user_confirmed' : 'full_serving',
        confirmations: { sugar_level: true, ice_level: true, toppings: true }
      };
      state.result = engine.estimate(request);
      state.result.engine_type = 'evidence_gated';
    } else {
      state.result = BeverageEngine.estimate(state.config);
      state.result.engine_type = 'local_demo';
    }
    state.step = 5;
    App.rerender();
  }

  function calculateAndShow() {
    return calculate();
  }

  function saveRecord() {
    if (!state.result) return;
    const r = state.result;
    const period = document.getElementById('bevMealPeriod')?.value || '下午茶';
    const note = document.getElementById('bevNote')?.value || '';
    const c = state.candidates[state.selectedCandidate];
    const record = {
      id: 'bev_' + Date.now(),
      source_type: 'beverage',
      raw_text: state.inputText,
      original_asset_ref: null,
      merchant_label: c?.brand_name || '饮品记录',
      meal_period: period,
      items: [{
        id: 'bev_item_' + Date.now(),
        name: `${c?.brand_name || ''} ${c?.display_name || ''}`.trim(),
        category: 'beverage',
        estimated_weight_g: null,
        consumed_ratio: state.config.consumed_ratio,
        calories_kcal: r.nutrients.kcal,
        protein_g: r.nutrients.protein_g,
        fat_g: r.nutrients.fat_g,
        carbs_g: r.nutrients.carbs_g,
        sugar_g: r.nutrients.sugar_g,
        confidence: r.confidence,
        source_ids: (r.sources || []).map(s => s.source_id),
        value_type: r.value_type,
        interval: r.nutrients.kcal.interval,
        warnings: r.warnings,
        beverage_config: state.config,
        beverage_result: r,
        note: note
      }],
      status: r.display_mode === 'unknown' ? 'pending_confirmation' : 'confirmed',
      created_at: new Date().toISOString(),
      updated_at: new Date().toISOString()
    };
    AppState.addRecord(record);
    UI.toast('饮品记录已保存', 'success');
    setTimeout(() => App.navigate('#/'), 800);
  }

  function reset() {
    state = {
      step: 1, inputText: '', imagePreview: null, candidates: [], selectedCandidate: null,
      config: {
        brand_id: null, sku_id: null, cup_size_id: null, volume_ml: null,
        sugar_level_id: null, ice_level_id: null, toppings: [],
        cup_state: 'unknown', consumed_ratio: null, consumed_ratio_source: null,
        confirmations: { brand: false, sku: false, cup_size: false, sugar_level: false, ice_level: false, toppings: false }
      },
      result: null
    };
    App.rerender();
  }

  function bindEvents() {
    const zone = document.getElementById('bevUpload');
    const input = document.getElementById('bevUpload_input');
    if (zone && input) {
      zone.addEventListener('click', () => input.click());
      input.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          state.imagePreview = ev.target.result;
          const prev = document.getElementById('bevImagePreview');
          if (prev) {
            prev.style.display = 'block';
            prev.innerHTML = `<img src="${ev.target.result}" alt="订单图片预览" style="max-height:160px;border-radius:8px;margin:0 auto;"><div class="preview-tag tag tag-not-connected">仅预览/OCR未接入</div>`;
          }
          UI.toast('图片已加载（仅预览，OCR未接入）', 'info');
        };
        reader.readAsDataURL(file);
      });
    }
  }

  return { render, loadDemo, goStep2, goStep, selectCandidate, manualSelect, goStep3, setBrand, setSku, setCupSize, setSugar, setIce, toggleTopping, clearToppings, setCupState, setConsumedRatio, goStep4, calculate, saveRecord, reset, bindEvents };
})();

/* 记录与趋势页 */
const PageHistory = (() => {
  let filter = 'all'; // all|7d|30d
  let periodFilter = 'all'; // all|breakfast|lunch|dinner|snack
  let view = 'list'; // list|trend

  function render() {
    const records = AppState.getRecords().sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    let filtered = filterRecords(records, filter);
    if (periodFilter !== 'all') filtered = filtered.filter(r => r.meal_period === periodFilter);

    return `
      <div class="page-header">
        <h1 class="page-title">记录与趋势</h1>
        <p class="page-subtitle">日/周/月筛选 · 修改/删除/补录 · 来源查看 · 本地存储</p>
        ${UI.demoTags(['demo', 'demo-data'])}
      </div>

      <div class="filter-bar">
        <div style="display:flex;gap:4px;background:var(--color-bg-alt);padding:4px;border-radius:8px;">
          <button class="btn btn-sm ${filter==='all'?'btn-primary':'btn-ghost'}" onclick="PageHistory.setFilter('all')">全部</button>
          <button class="btn btn-sm ${filter==='7d'?'btn-primary':'btn-ghost'}" onclick="PageHistory.setFilter('7d')">近7天</button>
          <button class="btn btn-sm ${filter==='30d'?'btn-primary':'btn-ghost'}" onclick="PageHistory.setFilter('30d')">近30天</button>
        </div>
        <div style="display:flex;gap:4px;background:var(--color-bg-alt);padding:4px;border-radius:8px;flex-wrap:wrap;">
          <button class="btn btn-sm ${periodFilter==='all'?'btn-primary':'btn-ghost'}" onclick="PageHistory.setPeriod('all')">全部时段</button>
          <button class="btn btn-sm ${periodFilter==='breakfast'?'btn-primary':'btn-ghost'}" onclick="PageHistory.setPeriod('breakfast')">🌅早餐</button>
          <button class="btn btn-sm ${periodFilter==='lunch'?'btn-primary':'btn-ghost'}" onclick="PageHistory.setPeriod('lunch')">☀️午餐</button>
          <button class="btn btn-sm ${periodFilter==='dinner'?'btn-primary':'btn-ghost'}" onclick="PageHistory.setPeriod('dinner')">🌙晚餐</button>
          <button class="btn btn-sm ${periodFilter==='snack'?'btn-primary':'btn-ghost'}" onclick="PageHistory.setPeriod('snack')">☕加餐</button>
        </div>
        <div style="display:flex;gap:4px;background:var(--color-bg-alt);padding:4px;border-radius:8px;">
          <button class="btn btn-sm ${view==='list'?'btn-primary':'btn-ghost'}" onclick="PageHistory.setView('list')"><i data-lucide="list"></i>列表</button>
          <button class="btn btn-sm ${view==='trend'?'btn-primary':'btn-ghost'}" onclick="PageHistory.setView('trend')"><i data-lucide="trending-up"></i>趋势</button>
        </div>
        <div style="margin-left:auto;display:flex;gap:8px;">
          <button class="btn btn-secondary btn-sm" onclick="PageHistory.exportData()"><i data-lucide="download"></i>导出JSON</button>
          <a href="#/record/beverage" class="btn btn-primary btn-sm"><i data-lucide="plus"></i>补录</a>
        </div>
      </div>

      ${view === 'trend' ? renderTrend(filtered) : renderList(filtered)}

      ${filtered.length === 0 ? UI.emptyState('inbox', '暂无记录，点击右上角"补录"开始记录') : ''}
    `;
  }

  function filterRecords(records, f) {
    if (f === 'all') return records;
    const days = f === '7d' ? 7 : 30;
    const cutoff = Date.now() - days * 86400000;
    return records.filter(r => new Date(r.created_at).getTime() >= cutoff);
  }

  function renderList(records) {
    return records.map(r => {
      const kcal = (r.items || []).reduce((sum, it) => {
        if (it.calories_kcal?.interval) return sum + (it.calories_kcal.interval.min + it.calories_kcal.interval.max) / 2;
        if (it.calories_kcal?.value) return sum + it.calories_kcal.value;
        return sum;
      }, 0);
      const date = new Date(r.created_at);
      const dateStr = date.toLocaleDateString('zh-CN', {month:'short',day:'numeric'}) + ' ' + date.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
      return `<div class="record-item">
        <div class="record-icon"><i data-lucide="${r.source_type==='beverage'?'cup-soda':r.source_type==='meal_photo'?'camera':'receipt'}"></i></div>
        <div class="record-content">
          <div class="record-title">${r.merchant_label || '未命名记录'}
            ${r.status==='pending_confirmation'?' <span class="tag tag-pending">待确认</span>':''}
            ${r.source_type==='beverage'?' <span class="tag tag-demo">饮品</span>':' <span class="tag tag-demo">餐食</span>'}
          </div>
          <div class="record-meta">${r.meal_period || ''} · ${(r.items||[]).length}项 · ${dateStr}</div>
          <div class="record-nutrition">约 ${Math.round(kcal)} kcal（估算中值）</div>
          ${(r.items||[]).some(it=>it.warnings&&it.warnings.length) ? `<div style="font-size:0.75rem;color:var(--color-warning);margin-top:4px;"><i data-lucide="alert-triangle" style="width:12px;height:12px;"></i> 含不确定性警告</div>` : ''}
        </div>
        <div class="record-actions">

  function renderTrend(records) {
    // 按天聚合
    const byDay = {};
    for (const r of records) {
      const day = r.created_at.slice(0, 10);
      if (!byDay[day]) byDay[day] = { kcal: 0, protein: 0, sugar: 0, count: 0 };
      for (const it of (r.items || [])) {
        if (it.calories_kcal?.interval) byDay[day].kcal += (it.calories_kcal.interval.min + it.calories_kcal.interval.max) / 2;
        if (it.protein_g?.interval) byDay[day].protein += (it.protein_g.interval.min + it.protein_g.interval.max) / 2;
        if (it.sugar_g?.interval) byDay[day].sugar += (it.sugar_g.interval.min + it.sugar_g.interval.max) / 2;
      }
      byDay[day].count++;
    }
    const days = Object.keys(byDay).sort();
    const maxKcal = Math.max(...days.map(d => byDay[d].kcal), 1);

    if (days.length === 0) return UI.emptyState('bar-chart-3', '暂无趋势数据');

    return `
      <div class="card">
        <div class="card-header">
          <div class="card-title"><i data-lucide="bar-chart-3"></i>每日热量趋势（估算中值）</div>
          <span class="tag tag-demo-data">演示数据</span>
        </div>
        <div class="card-body">
          <div style="display:flex;align-items:flex-end;gap:8px;height:180px;padding:10px 0;">
            ${days.map(d => {
              const h = Math.max(4, (byDay[d].kcal / maxKcal) * 160);
              return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;">
                <div style="font-size:0.6875rem;color:var(--color-text-muted);">${Math.round(byDay[d].kcal)}</div>
                <div style="width:100%;max-width:32px;height:${h}px;background:var(--color-primary);border-radius:4px 4px 0 0;opacity:0.85;"></div>
                <div style="font-size:0.6875rem;color:var(--color-text-muted);">${d.slice(5)}</div>
              </div>`;
            }).join('')}
          </div>
          <p style="font-size:0.75rem;color:var(--color-text-muted);margin-top:8px;">柱状图高度为估算中值，非精确测量。数据仅存于本机浏览器。</p>
        </div>
      </div>
      <div class="grid-3">
        <div class="card"><div class="card-title" style="font-size:0.875rem;">平均热量</div><div style="font-size:1.5rem;font-weight:700;">${Math.round(days.reduce((s,d)=>s+byDay[d].kcal,0)/days.length)} <span style="font-size:0.875rem;font-weight:400;color:var(--color-text-muted);">kcal/天</span></div></div>
        <div class="card"><div class="card-title" style="font-size:0.875rem;">平均蛋白质</div><div style="font-size:1.5rem;font-weight:700;">${Math.round(days.reduce((s,d)=>s+byDay[d].protein,0)/days.length)} <span style="font-size:0.875rem;font-weight:400;color:var(--color-text-muted);">g/天</span></div></div>
        <div class="card"><div class="card-title" style="font-size:0.875rem;">平均糖摄入</div><div style="font-size:1.5rem;font-weight:700;">${Math.round(days.reduce((s,d)=>s+byDay[d].sugar,0)/days.length)} <span style="font-size:0.875rem;font-weight:400;color:var(--color-text-muted);">g/天</span></div></div>
      </div>
    `;
  }

  function viewDetail(id) {
    const r = AppState.getRecords().find(x => x.id === id);
    if (!r) return;
    const itemsHTML = (r.items || []).map(it => `
      <div style="border:1px solid var(--color-border);border-radius:8px;padding:10px;margin-bottom:8px;">
        <div style="font-weight:500;margin-bottom:6px;">${it.name}
          ${it.confidence?`<span class="tag ${it.confidence>=0.7?'tag-success':it.confidence>=0.5?'tag-pending':'tag-source-low'}" style="margin-left:6px;">置信度${Math.round(it.confidence*100)}%</span>`:''}
        </div>
        ${UI.nutritionGrid({
          kcal: it.calories_kcal, protein_g: it.protein_g, fat_g: it.fat_g,
          carbs_g: it.carbs_g, sugar_g: it.sugar_g, sodium_mg: it.sodium_mg || {value:null,interval:null,value_type:'unknown'}
        })}
        ${it.warnings&&it.warnings.length?`<div style="font-size:0.75rem;color:var(--color-warning);margin-top:6px;">⚠ ${it.warnings.join('；')}</div>`:''}
        ${it.beverage_result?`<details style="margin-top:6px;"><summary class="detail-toggle">查看饮品计算详情</summary><div class="detail-content" style="font-size:0.75rem;color:var(--color-text-secondary);">
          目录版本：${it.beverage_result.catalog_version} · 生效：${it.beverage_result.effective_from}<br>
          serving basis：${it.beverage_result.serving_basis?.description || '未知'}<br>
          来源：${(it.beverage_result.sources||[]).map(s=>s.publisher).join('；') || '来源不足'}
        </div></details>`:''}
      </div>
    `).join('');
    UI.modal('记录详情', `
      <div style="margin-bottom:12px;font-size:0.875rem;color:var(--color-text-secondary);">
        ${r.merchant_label} · ${r.meal_period} · ${new Date(r.created_at).toLocaleString('zh-CN')}

      ${itemsHTML || '<p>无明细项</p>'}
    `, `<button class="btn btn-secondary" onclick="document.querySelector('.modal-overlay').remove()">关闭</button>`);
  }

    UI.confirmDialog('删除记录', '确定要删除这条记录吗？此操作不可恢复。', () => {
      AppState.deleteRecord(id);
      UI.toast('记录已删除', 'success');
      App.rerender();
    }, '删除', true);
  }

  function exportData() {
    const records = AppState.getRecords();
    const profile = AppState.getProfile();
    const data = { export_time: new Date().toISOString(), profile, records, note: '本地演示数据导出，不含真实身份信息' };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `nutrition_records_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    UI.toast('已导出JSON文件', 'success');
  }

  function setFilter(f) { filter = f; App.rerender(); }
  function setPeriod(p) { periodFilter = p; App.rerender(); }
  function setView(v) { view = v; App.rerender(); }

  return { render, setFilter, setPeriod, setView, viewDetail, editRecord, deleteRecord, exportData };
})();

  function saveApiConfig() {

    const model = document.getElementById('deepseekModel')?.value?.trim() || 'deepseek-chat';
    if (key) {
      localStorage.setItem('deepseek_api_key', key);
      localStorage.setItem('deepseek_api_base', base);

      UI.toast('AI 服务配置已保存', 'success');
    } else {
      UI.toast('请输入 API Key', 'warning');
    }
  }

  async function testApiConnection() {
    const resultEl = document.getElementById('apiTestResult');
    if (resultEl) resultEl.innerHTML = '<div style="padding:10px;background:var(--bg-alt);border-radius:8px;font-size:0.8125rem;">正在测试连接...</div>';
    const apiKey = document.getElementById('deepseekApiKey')?.value?.trim() || localStorage.getItem('deepseek_api_key');
    const apiBase = document.getElementById('deepseekApiBase')?.value?.trim() || 'https://api.deepseek.com';
    const model = document.getElementById('deepseekModel')?.value?.trim() || 'deepseek-chat';
    if (!apiKey) {
      if (resultEl) resultEl.innerHTML = '<div style="padding:10px;background:var(--warning-light);color:var(--warning);border-radius:8px;font-size:0.8125rem;">请先输入并保存 API Key</div>';
      return;
    }
    try {
      const response = await fetch(`${apiBase}/chat/completions`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
        body: JSON.stringify({ model: model, messages: [{ role: 'user', content: '你好' }], max_tokens: 10 })
      });
      if (response.ok) {
        if (resultEl) resultEl.innerHTML = '<div style="padding:10px;background:var(--success-light);color:var(--success);border-radius:8px;font-size:0.8125rem;font-weight:600;">✓ 连接成功，API Key 有效</div>';
        UI.toast('连接成功', 'success');
      } else {
        const err = await response.json().catch(() => ({}));
        if (resultEl) resultEl.innerHTML = `<div style="padding:10px;background:var(--error-light);color:var(--error);border-radius:8px;font-size:0.8125rem;">✗ 连接失败：${response.status} ${err.error?.message || ''}</div>`;
      }
    } catch (e) {
      if (resultEl) resultEl.innerHTML = `<div style="padding:10px;background:var(--error-light);color:var(--error);border-radius:8px;font-size:0.8125rem;">✗ 连接失败：${e.message}</div>`;

  }

  // 百度 OCR 配置
  function toggleOcrKeyVisibility() {
    const input = document.getElementById('baiduOcrSecretKey');
    const icon = document.getElementById('ocrEyeIcon');
    if (input && icon) {
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      icon.innerHTML = isPassword
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }
  }

  function saveOcrConfig() {
    const apiKey = document.getElementById('baiduOcrApiKey')?.value?.trim();
    const secretKey = document.getElementById('baiduOcrSecretKey')?.value?.trim();
    const proxy = document.getElementById('baiduOcrProxy')?.value?.trim() || 'https://api.allorigins.win/raw?url=';
    if (apiKey && secretKey) {
      localStorage.setItem('baidu_ocr_api_key', apiKey);
      localStorage.setItem('baidu_ocr_secret_key', secretKey);
      localStorage.setItem('baidu_ocr_proxy', proxy);
      const tag = document.getElementById('ocrStatusTag');
      if (tag) { tag.textContent = '已配置'; tag.className = 'tag tag-success'; }
      UI.toast('百度 OCR 配置已保存', 'success');
    } else {
      UI.toast('请输入 API Key 和 Secret Key', 'warning');
    }
  }

  async function testOcrConnection() {
    const resultEl = document.getElementById('ocrTestResult');
    if (resultEl) resultEl.innerHTML = '<div style="padding:10px;background:var(--bg-alt);border-radius:8px;font-size:0.8125rem;">正在获取 access_token...</div>';
    const apiKey = document.getElementById('baiduOcrApiKey')?.value?.trim() || localStorage.getItem('baidu_ocr_api_key');
    const secretKey = document.getElementById('baiduOcrSecretKey')?.value?.trim() || localStorage.getItem('baidu_ocr_secret_key');
    const proxy = document.getElementById('baiduOcrProxy')?.value?.trim() || 'https://api.allorigins.win/raw?url=';
    if (!apiKey || !secretKey) {
      if (resultEl) resultEl.innerHTML = '<div style="padding:10px;background:var(--warning-light);color:var(--warning);border-radius:8px;font-size:0.8125rem;">请先输入并保存 API Key 和 Secret Key</div>';
      return;
    }
    try {
      const tokenUrl = `https://aip.baidubce.com/oauth/2.0/token?grant_type=client_credentials&client_id=${apiKey}&client_secret=${secretKey}`;
      const response = await fetch(proxy + encodeURIComponent(tokenUrl));
      const data = await response.json();
      if (data.access_token) {
        localStorage.setItem('baidu_access_token', data.access_token);
        localStorage.setItem('baidu_token_time', Date.now().toString());
        if (resultEl) resultEl.innerHTML = `<div style="padding:10px;background:var(--success-light);color:var(--success);border-radius:8px;font-size:0.8125rem;font-weight:600;">✓ 连接成功，access_token 已获取（有效期30天）</div>`;
        UI.toast('百度 OCR 连接成功', 'success');
      } else {
        if (resultEl) resultEl.innerHTML = `<div style="padding:10px;background:var(--error-light);color:var(--error);border-radius:8px;font-size:0.8125rem;">✗ 失败：${data.error_description || '密钥无效'}</div>`;
      }
    } catch (e) {
      if (resultEl) resultEl.innerHTML = `<div style="padding:10px;background:var(--error-light);color:var(--error);border-radius:8px;font-size:0.8125rem;">✗ 失败：${e.message}（代理可能不可用）</div>`;
    }
  }

  // 配置导入导出
  function exportConfig() {
    const config = {
      deepseek_api_key: localStorage.getItem('deepseek_api_key') || '',
      deepseek_api_base: localStorage.getItem('deepseek_api_base') || 'https://api.deepseek.com',
      deepseek_model: localStorage.getItem('deepseek_model') || 'deepseek-chat',
      baidu_ocr_api_key: localStorage.getItem('baidu_ocr_api_key') || '',
      baidu_ocr_secret_key: localStorage.getItem('baidu_ocr_secret_key') || '',
      baidu_ocr_proxy: localStorage.getItem('baidu_ocr_proxy') || 'https://api.allorigins.win/raw?url=',
      export_time: new Date().toISOString()
    };
    const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'yingyangzhilian_config.json';
    a.click();
    URL.revokeObjectURL(url);
    UI.toast('配置已导出', 'success');
  }

  function importConfig(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const config = JSON.parse(e.target.result);
        if (config.deepseek_api_key) localStorage.setItem('deepseek_api_key', config.deepseek_api_key);
        if (config.deepseek_api_base) localStorage.setItem('deepseek_api_base', config.deepseek_api_base);
        if (config.deepseek_model) localStorage.setItem('deepseek_model', config.deepseek_model);
        if (config.baidu_ocr_api_key) localStorage.setItem('baidu_ocr_api_key', config.baidu_ocr_api_key);
        if (config.baidu_ocr_secret_key) localStorage.setItem('baidu_ocr_secret_key', config.baidu_ocr_secret_key);
        if (config.baidu_ocr_proxy) localStorage.setItem('baidu_ocr_proxy', config.baidu_ocr_proxy);
        UI.toast('配置已导入，页面刷新后生效', 'success');
        setTimeout(() => App.rerender(), 500);
      } catch (err) {
        UI.toast('导入失败：文件格式错误', 'error');
      }
    };
    reader.readAsText(file);
  }

  return { render, updateProfile, togglePref, saveProfile, grantConsent, confirmGrant, revokeConsent, exportAll, clearAll, toggleKeyVisibility, saveApiConfig, testApiConnection, toggleOcrKeyVisibility, saveOcrConfig, testOcrConnection, exportConfig, importConfig };
})();
